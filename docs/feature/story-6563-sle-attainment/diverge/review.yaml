  open_findings:
    - id: O1
      dimension: recommendation_coherence
      severity: major
      location: "recommendation.md 'Scope alternative' bold label '**A daily record of the share [new], 3.00.**'; 'For the requester' > Scope choices, 'A real trend: a column for each closed week or month'"
      issue: >-
        Rule 5 residue of F3. The coined handle 'A daily record of the share' (options-raw.md option 3 heading) is cited as a bold
        label in the body. 'A column for each closed week or month' (options-raw.md option 4 heading, identical wording) is
        used as a label in the requester section. Criterion 5.3: any handle cited as a label is a FAIL signal.
      fix: >-
        Write both by mechanism: 'a persisted record kept each day, with a line per day' and 'a column for each closed week
        or month' becomes 'the share per closed week or month, one column each, with its count and the target'. Score values unchanged.
    - id: O2
      dimension: taste_application
      severity: major
      location: "taste-evaluation.md section 2, constraint (b) text ('without set-up') and option 6 elimination row"
      issue: >-
        '(b) without set-up' is not in the requester's block. The source line cites the first bullet ('instead of hiding it behind
        chart toggles'), which does not say it. Option 6 (largest stated mass, 0.244) is eliminated on this added wording. Option 3
        passes (b) on the Predictability tab without saying why that tab is the page the reader opens. Application is not shown to
        be symmetric.
      fix: >-
        Either record 'without set-up' as a host-set constraint with its reason, or drop the words. Then state one page rule
        (for example 'a tab the reader opens for metrics by default') and apply it to all six, including option 3 and both packages.
    - id: O3
      dimension: recommendation_coherence
      severity: major
      location: "recommendation.md 'For the requester' > Parked by you; Dissent ('It is your first gut feeling')"
      issue: >-
        'Parked' is a host term. No requester-verbatim block says 'park'. Attributing it to the requester ('Parked by you') breaks
        rule 6. 'your first gut feeling' is not a rule 1 span ('first' is not in the block; the block says 'my gut feeling was').
      fix: >-
        Replace 'Parked by you' with a quoted span: 'You said the freely configurable bar is "too much for now".' Use
        'your gut feeling' (span 'gut feeling') or quote 'my gut feeling was'.
    - id: N1
      dimension: recommendation_coherence
      severity: minor
      location: "recommendation.md 'The maintainer's mix, scored' and section 'Scope choices', closing sentence"
      issue: >-
        'The mix leads only if a constraint ... is added. Then it is the second choice behind the columns alone.' A mix that is
        second under the only constraint that could lift it does not lead under any case tested. The sentence contradicts itself.
      fix: "Write: 'The mix does not lead under any case tested. Under the series constraint it is second, behind the columns alone.'"
    - id: N2
      dimension: option_diversity
      severity: minor
      location: "taste-evaluation.md section 0, pair 2-6 (mechanism 'Y')"
      issue: >-
        Option 2 (change against the preceding period) and option 6 (share in the Then window beside the Now window) both compare two
        windows. The pair is marked Y on mechanism without argument; the difference is the container. The pair still passes on
        assumption and cost.
      fix: "State the shared two-window computation in the pair note. Keep the pass on assumption and cost."
    - id: N3
      dimension: taste_application
      severity: minor
      location: "taste-evaluation.md section 5, rows 'Desirability of options 2 and 5 raised to 5' and 'Viability of options 2 and 3 ...'"
      issue: >-
        Text claims options 2 and 4 stay within 0.13 in every row. Two rows give 0.15 (3.90 vs 3.75). The claim is false in those rows.
      fix: "Change the text to 0.15, or to 'within 0.15 in every row'."
    - id: N4
      dimension: option_diversity
      severity: minor
      location: "taste-evaluation.md section 0, head-clustering read"
      issue: "'raising any of the three raw values by 0.05 puts the group over 0.5': the group reaches exactly 0.50, it does not pass it."
      fix: "Write 'reaches 0.50'."
    - id: N5
      dimension: jtbd_rigor
      severity: minor
      location: "job-analysis.md section 2 (Functional)"
      issue: >-
        The registered job_story (jobs.yaml 9125-9130) adds 'whether a change made it better, instead of pointing at a line on a chart'.
        job-analysis section 2 omits both. The registered job and the analysis differ.
      fix: "Align job-analysis section 2 with the registered job_story, or record the wording change."
    - id: N6
