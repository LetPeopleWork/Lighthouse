      severity: minor
      location: "job-analysis.md section 7 (new signal)"
      issue: >-
        Records only the first 'so no new widget' signal. The later blocks (gut-feeling mix, parked direction, reports plan) are not recorded there.
      fix: "Add the later requester-verbatim signals to section 7, or point to the recommendation section that records them."
    - id: N7
      dimension: recommendation_coherence
      severity: minor
      location: "recommendation.md 'For the requester' > Scope choices for you, item 'Your mix: ...'"
      issue: >-
        The requester's mix is quoted as 'mix' (span present). Its description is a host paraphrase presented as the requester's option.
        Rule 2 asks the name to be the quoted span in the option heading; the taste table does this. The requester section does not quote it.
      fix: "Quote the span: 'Your mix (\"one new dedicated SLE widget in the overview, perhaps SLE over time in predictability\")'."
    - id: N8
      dimension: taste_application
      severity: minor
      location: "taste-evaluation.md section 3b, package D = 5"
      issue: >-
        Packages score D 5 ('serves all three requests'), above both of their parts (D 4 each). The reason is stated but no rubric rule supports
        a composite above its best part. It is a judgement that the sensitivity rows only partly cover.
      fix: "State the rule for composite desirability, or score D 4 and show the effect (both packages still rank below option 1 and option 2)."
    - id: N9
      dimension: taste_application
      severity: minor
      location: "taste-evaluation.md section 3, option 5 T1 rationale ('the other readouts the maintainer's etc. implies')"
      issue: "The T1 reason argues from future readouts that are not part of this option. Score-from-scope, not from the mechanism scored."
      fix: "Restate T1 for the SLE-only readout as scored, and mention future readouts only as a note."
