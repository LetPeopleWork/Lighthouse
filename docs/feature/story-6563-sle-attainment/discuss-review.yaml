approval_status: "rejected_pending_revisions"
approval_conditions: "Resolve F1 (record the answer to the Q4 fill-time choice or re-status it as Proposed, and ask the maintainer) and F2 (re-status the four scope exclusions). Resolve F3 to F6 by revising the slices and promises. F7 to F14 may be handled in the same revision. Then re-review the brief."
