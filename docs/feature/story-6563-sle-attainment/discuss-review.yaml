  high: ["F1: quote or re-status the Q4 fill-time rule, and ask the maintainer if no answer exists."]
  medium: ["F2 to F6: resolve the scope exclusions, name the walking skeleton, split the multi-behaviour slices, move P9 and P10 into S3, and state the sad paths of the chart over history that is not stored."]
