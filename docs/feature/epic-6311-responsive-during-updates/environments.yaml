# Environment inventory - epic-6311-responsive-during-updates
# Consumed by DISTILL for environmental realism.
#
# Application change inside the existing product: no migration, no configuration key, no chart or image change,
# no new dependency. One more Redis pub/sub channel (cancel-all) on the existing connection, used only when
# ConnectionStrings:Redis is set (a proof of concept nobody is known to run, NMD-15). No slice needs to edit
# Program.cs: the startup banner reads ForecastSimulationLimits.Default itself. If one must, that push runs the full
# Integration suite; budget one flake re-run. The axes that matter are cores, replicas and client version.

target_environments:
  - name: clean
    description: "Any supported runtime, one replica. Nothing to install or configure."
    platform: [linux, macos, windows, docker, kubernetes]
    preconditions: []

  - name: restored-dev-instance
    description: >
      The dev instance restored from the production backup (Restore-DbBackup.ps1), run in Docker with --cpus=4.
      Where KPI-1, KPI-2 and KPI-3 are read and the production-data ACs run (AC-01.5, AC-02.7, AC-03.8, AC-04.4).
      KPI-1 is read a second time at --cpus=2, same p95 threshold.
    platform: [docker]
    preconditions:
      - "HARD slice-01 entry: KPI-3 baseline read before slice 01 changes anything (query in feature-delta.md, DEVOPS / Slice 01 entry and finalize). baseline: TO BE READ before slice 01"
      - "Startup banner reads 'Forecasts use up to 2 of 4 cores' (1 of 2 at --cpus=2) after slice 01"

  - name: helm-no-cpu-limit
    description: "Helm chart pod with no CPU limit: half the node's cores. Unmeasured; no KPI reading is taken here."
    platform: [kubernetes]
    preconditions: []

  - name: multi-replica-redis
    description: >
      Two or more replicas sharing Redis. Only reached in CI by Integration/Containers tests (Testcontainers Redis in
      ci_backend), following TaskManagerMultiReplicaTests. E2E and the verify workflows run one replica without Redis.
    platform: [linux]
    preconditions:
      - "Docker available to Testcontainers (locally and on the runner)"

notes:
  cores:
    values: [1, 2, 4, 32]
    why: >
      Worker bound = max(1, floor(cores / 2)) from Environment.ProcessorCount, which honours the container CPU quota
      and rounds up (--cpus=1.5 -> 2 -> 1 worker). The Helm chart sets requests.cpu 100m and no CPU limit, so a pod
      uses half the node's cores. DOTNET_PROCESSOR_COUNT overrides the count without a Lighthouse key. Tests inject the
      core count; never assert a wall clock. 1-2-core Standalone desktop hosts get 1 worker: accepted, not optimised.
  rolling_upgrade:
    values: [old-replica, new-replica]
    why: >
      An old replica ignores the cancel-all channel, so its running work goes on during the overlap; per-row Stop keeps
      its unchanged channel and still reaches it. An old replica shows today's date for a beyond percentile until the
      next forecast run (NMD-16). No test spans two binaries.
  client_version:
    values: [released-lh-mcp, upgraded-lh-mcp, web-app]
    why: >
      Released clients read expectedDate (a date 5 years out for a beyond percentile). Upgraded clients key on whether
      beyondHorizon is present, so a new client against an old server is safe. Release order: server first, clients
      any time after. Slices 03 and 04 ship in one release.
  db_provider:
    values: [sqlite, postgres]
    why: "N/A, because nothing is migrated or queried differently. verifysqlite / verifypostgres start the app as today."
  trackers:
    why: >
      Write-back writes nothing for a beyond percentile (existing no-answer path). The Jira Release forecast block
      writes '85%: more than 5 years'; covered by renderer and merge tests, no live connector test needed.

deployment_assumptions:
  - "Rollback is the previous release: no migration, an additive wire change, and a new endpoint that just goes away."
  - "Not clean for forecasts (NMD-16): the old binary shows today's date (a guessed date) for a beyond percentile until that Portfolio's next forecast run rewrites it."
  - "After a rollback: run a forecast update for every Portfolio (in the release and rollback notes). KPI-4 holds again once every Portfolio has a forecast row newer than the rollback."
  - "Nothing owed at deploy time: no flag, no configuration, no chart change."
