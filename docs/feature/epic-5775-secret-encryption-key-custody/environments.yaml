# Environment inventory — epic-5775-secret-encryption-key-custody
# Consumed by DISTILL for Mandate 4 (Environmental Realism).
#
# This feature changes where an instance's encryption key comes from, so "environment" here means
# "key custody topology" rather than "deployment target". The same binary behaves differently in each
# of the six product environments below, and three of them are failure-adjacent by design:
# docker-no-data-volume refuses to mint, upgrade-from-pre-epic depends on a retired key staying in the
# ring, and k8s-* cannot mint at all. Parametrizing an acceptance test over "linux/windows/macos" tells
# you nothing here; parametrizing it over custody mode tells you everything.
#
# Infrastructure surface owned by the DEVOPS wave: the Helm chart's required-value failure, the Secret
# volume projection, and the Tenant Zero rotation walkthrough. No new external service, no new cluster
# permission, no new observability stack.

target_environments:

  # --- Product environments (what a user actually runs) --------------------------------------

  - name: standalone-exe
    description: >
      Single-file executable on a workstation or a server. SQLite. The standalone initializer already
      sets an explicit data-protection key-store path, so the encryption ring resolves beside the
      database with no change to this environment at all (ADR-149 case 2).
    platform: [linux, macos, windows]
    custody_mode: generated-for-this-instance
    can_mint: true
    preconditions:
      - "Standalone initializer runs before key-store resolution — the bootstrap order is load-bearing (ADR-150)"
      - "Application data directory is writable and durable"
      - "No encryption value supplied by the operator"
    expected_outcome: "First boot generates a 32-byte key, wraps it with Data Protection, writes it beside the database, and the startup line names source, active key id and resolved path."

  - name: docker-with-data-volume
    description: >
      Single container, documented setup: a volume mounted at the data directory with the SQLite
      database on it. The ring follows the database onto the same volume (ADR-149 case 3), so an
      operator who mounted a volume keeps their key by doing nothing.
    platform: [docker]
    custody_mode: generated-for-this-instance
    can_mint: true
    preconditions:
      - "SQLite provider with an absolute DataSource path resolving to a directory on the mounted volume"
      - "Volume survives container recreation"
    expected_outcome: "docker rm + recreate against the same volume returns the SAME active key id and every stored secret stays readable."
    substrate_note: "Docker overlayfs and WSL2 DrvFs can no-op fsync. The bootstrapper re-reads and unprotects the ring after writing rather than assuming the write landed."

  - name: docker-no-data-volume
    description: >
      Single container with no mounted data volume, or an external Postgres with no local database
      file. No directory can be argued durable (ADR-149 case 4). This is a first-class environment, not
      an error path — a large part of the installed base looks like this today.
    platform: [docker, linux]
    custody_mode: no-durable-store
    can_mint: false
    preconditions:
      - "No Encryption:KeyStorePath and no Lighthouse:DataProtection:KeyStorePath configured"
      - "Either Postgres, or SQLite with a bare relative filename / in-memory DataSource"
    expected_outcome: >
      The application REFUSES to mint. An instance whose database already holds an encrypted secret
      starts, runs on the retired published default key so nothing breaks, and says so loudly on the
      startup line and the encryption panel. A FRESH instance with an empty database refuses to start,
      naming two one-line remedies. The discriminator is a query against the database, not a flag.
    kpi_note: "This is why KPI-1 is not automatically satisfied by slice 02 alone for a hand-rolled Postgres install."

  - name: k8s-explicit-key
    description: >
      Helm install with encryption.key supplied. The chart renders the ring into its own Secret and
      projects it as a file. Operator-owned custody: the application never mints here, because a minted
      key would go to the generated key store and the configured key would win the precedence order
      again on the next restart.
    platform: [kubernetes]
    custody_mode: configuration-supplied
    can_mint: false
    preconditions:
      - "encryption.key is a base64 32-byte value the application can parse. Well-formedness is a values.schema.json pattern (^$|^[A-Za-z0-9+/]{43}=$), so a malformed key fails at RENDER naming the key, not at pod startup as a crash loop. The empty alternative keeps the chart's own default valid"
      - "Chart version carrying the encryption values keys is deployed"
      - "Secret volume projected read-only at encryption.mountPath with file mode 0444 (the runtime image runs as USER app and the chart sets no podSecurityContext, so a root-owned 0400 file is unreadable)"
    expected_outcome: "Custody reported as configuration-supplied; the encryption panel offers re-encrypt only, never mint."

  - name: k8s-existing-secret
    description: >
      Helm install with encryption.existingSecret naming a Secret that External Secrets Operator or
      OpenBao owns. The chart renders no key material of its own. This is the platform's per-tenant
      shape and the only one where a leaked backup is one tenant's problem.
    platform: [kubernetes]
    custody_mode: external-store
    can_mint: false
    preconditions:
      - "The named Secret EXISTS before the pod schedules — the volume is not optional, so a missing Secret leaves the pod unschedulable and visible in kubectl describe"
      - "The Secret carries the ring as ONE line under encryption.secretKey (default: keys), first entry active"
      - "The Secret is NOT added to the stakater reloader watch — the application picks a new key up by polling the mounted file's content, and rolling the pod would defeat the reason the mount was chosen"
    expected_outcome: "Custody reported as external; a key added to the Secret is noticed within one poll interval without a restart, logged with the key ids and never any material."

  - name: upgrade-from-pre-epic
    description: >
      Any of the five environments above, upgraded from a version predating this epic. Every stored
      secret was written under the published default key that ships in the public repository.
    platform: [linux, macos, windows, docker, kubernetes]
    custody_mode: mixed
    can_mint: "depends on the environment it upgraded into"
    preconditions:
      - "The published default enters the ring as a RETIRED entry, never eligible to become active"
      - "It arrives as a compiled-in constant, not from configuration, so the literal can leave appsettings.json without breaking readability"
      - "Writes move to the instance's own key immediately; reads keep working through the retired entry"
    expected_outcome: "Zero secrets become unreadable across the upgrade. The default can be dropped from the ring only once a rotation has left no row referencing it."
    substrate_note: "Verify against a REAL restored backup, not seeded demo rows — the dev instance on :5169 is restored from one."

  # --- CI substrates (where the gates actually run) -------------------------------------------

  - name: ci-chart
    description: "GitHub Actions ubuntu-latest, existing ci_chart.yml validate job. No cluster."
    platform: [linux]
    custody_mode: fixture
    preconditions:
      - "helm v3.16.3 + helm-unittest v1.0.3 (the last release whose plugin.yaml loads on helm v3)"
      - "helm lint runs in LINT MODE, where required and fail are neutralised — a template-level guard does NOT fail lint, but a values.schema.json constraint violated by the chart's own values.yaml DOES"
      - "helm unittest renders EVERY template before selecting the one under test, so an unconditional fail in deployment-api.yaml fails suites that never reference it — each of the five suites needs a suite-level set: supplying a fixture encryption.key"
      - "The standalone render gate and the helm-docs README drift gate both run here"
    expected_outcome: "All five existing suites plus the seven new encryption cases green; the render gate needs --set encryption.key added."

  - name: kind-install-smoke
    description: >
      GitHub Actions + kind, existing ci_chart.yml install-smoke job. The only substrate where a real
      kubelet projects a real Secret into the real non-root runtime user.
    platform: [linux]
    custody_mode: fixture
    preconditions:
      - "helm install --wait --timeout 5m needs --set encryption.key added or the render fails before anything is applied"
      - "Bundled Postgres StatefulSet, embedded SPA, ingress disabled"
      - "A SECOND install covering encryption.existingSecret: kubectl create secret generic, then helm install --set encryption.existingSecret. Without it, the path Tenant Zero actually uses is never exercised against a real kubelet, and the two modes resolve the volume's secretName differently"
    expected_outcome: "Pod reaches Ready and serves /health/ready in BOTH custody modes, which proves the mounted ring is readable by the non-root user — the only evidence-based answer to the 0444-vs-0400 file-mode question."

  - name: tenant-zero
    description: >
      The platform's own tenant, rendered by ArgoCD. The proving ground for the rotation walkthrough
      and the only environment that reaches the cluster through `helm template` rather than
      `helm install` — which is why the chart must never generate a key.
    platform: [kubernetes]
    custody_mode: external-store
    preconditions:
      - "ArgoCD Application values carry encryption.existingSecret; the manifests live in the PRIVATE lighthouse-platform repository, not this one"
      - "The tenant's Secret exists BEFORE the tenant's chart version is bumped, or the render fails and the sync stops"
      - "Premium licence present if any licensed surface is exercised during the dogfood"
    expected_outcome: "Three consecutive helm upgrades with unchanged values leave every Connection syncing; the four-action rotation completes with zero credentials re-entered."

coexistence_matrix:
  - tool: existing-chart-unit-suites
    must_not_break: true
    rationale: >
      56 tests across five suites are green today. A template-level encryption guard fails 46 of them,
      because helm-unittest renders the whole chart before selecting a document. The fix is one
      suite-level set: block per file; every existing exact failedTemplate message assertion must keep
      matching, which is why the new guard is ordered AFTER assertFrontendMode and assertScaling.
  - tool: postgresql.auth.existingSecret
    must_not_break: true
    rationale: "The established operator/ESO-owned database credential idiom. Encryption adds a third existingSecret that deliberately behaves differently (mounted file, not env var); neither existing idiom may change shape."
  - tool: oidc.existingSecret
    must_not_break: true
    rationale: "Same. The OIDC client secret still travels as a secretKeyRef environment variable and must keep doing so."
  - tool: stakater-reloader-wiring
    must_not_break: true
    rationale: >
      lighthouse.reloadSecrets must keep returning exactly the database and OIDC secrets. A tenant whose
      only managed credential is the encryption Secret must render NO reload annotations and NO
      checksum/config, because the application reloads the ring itself by polling the mounted file.
  - tool: standalone-single-container-product
    must_not_break: true
    rationale: "Byte-unchanged by the chart work. Encryption:KeysFile is unset there, so the resolver never looks for a mounted file."
  - tool: helm-docs-README-drift-gate
    must_not_break: true
    rationale: "New `# --` comments in values.yaml regenerate chart/README.md. The gate fails on a stale README; the hand-written quick-start lives in README.md.gotmpl and needs the new flag added by hand."
  - tool: chart-publish-version-guard
    must_not_break: true
    rationale: "version-guard.sh asserts Chart.yaml version+appVersion agree with README.md, NOTES.txt and values-enterprise.yaml image.tag, and refuses to overwrite a published version. A chart version bump is required or nothing ships."
  - tool: live-argocd-tenant-syncs
    must_not_break: true
    rationale: "A tenant synced before this chart version must not be rendered by the new chart until its encryption Secret exists, or the render fails and the sync stops. Order: create the Secret, then bump the tenant's chart version."
  - tool: existing-SonarCloud-quality-gate
    must_not_break: true
    rationale: "No new issues of any severity, including security hotspots. The compiled-in retired default constant carries exactly one narrow inline suppression with a plain-language justification."
  - tool: existing-Stryker-mutation-gate
    must_not_break: true
    rationale: "per-feature, >= 80% kill on the changed backend surface. The chart carries no mutable code; its equivalent is the seven-case unit suite plus two shell gates."

platform_coverage:
  Linux: [Ubuntu 22.04, Ubuntu 24.04]
  Windows: [Windows Server 2022, Windows 11]
  macOS: [13.x, 14.x, "arm64 standalone"]
  Docker: ["mcr.microsoft.com/dotnet/aspnet:10.0 base image; runtime stage ends on USER app (non-root)"]
  WSL: [WSL2]
  Kubernetes: ["kind (CI smoke)", "the platform's cluster, rendered by ArgoCD via helm template"]
  CI: ["GitHub Actions ubuntu-latest — existing ci_chart.yml, no new workflow"]
  Helm: ["v3.16.3 (CI)", "helm-unittest v1.0.3 (CI)", "helm-docs v1.14.2 (CI)"]
  Database:
    SQLite: ["3.40+"]
    PostgreSQL: ["15.x", "16.x", "17 (bundled chart StatefulSet)"]

deployment_assumptions:
  - "Rolling deployment / ArgoCD sync. No canary, no blue-green. The failure this slice defends against is a wrong or missing key, which is decided before a pod serves its first request, not under traffic."
  - "The chart NEVER generates a key. lookup returns empty on every helm template render, which is how ArgoCD renders, so a lookup-guarded generator would mint a fresh key on every tenant sync and orphan the tenant's whole credential set. Refusing to generate removes the failure by construction rather than guarding against it."
  - "Upgrade idempotence is structural, not defended: nothing is minted, so nothing can be regenerated. It is still gated — a grep asserting no template references randAlphaNum, randBytes, uuidv4, genPrivateKey or lookup for an encryption value, plus a render-determinism check diffing two identical renders byte for byte."
  - "Lighthouse holds NO write permission on any Kubernetes Secret, before or after this epic. Enforced structurally: no type in the backend may reference a Kubernetes client, so there is nothing to probe because nothing can compile."
  - "The key reaches the container as a mounted file, never an environment variable. An env var is readable in /proc/<pid>/environ and cannot change under a running process, which would make hot reload impossible."
  - "Encryption__KeysFile is a PATH, not key material, and lives in the ConfigMap alongside the other non-secret configuration. The enforcement test covers both the ConfigMap data keys and the container env list: nothing matching ^Encryption__Key except that one, whose value must start with /."
  - "No EF migration. The three secret columns carry no HasMaxLength and are unbounded text/TEXT in both model snapshots. One is owed only if the slice-03 concurrency probe forces a token onto OAuthCredential, and then it is generated with the CreateMigration script, additive only."
  - "Rollback is total on the chart side. A failed render applies nothing; a pod that cannot resolve a ring never writes; a wrong key is fixed in the Secret and picked up within one poll interval. The only step with a persistence consequence is the operator dropping the old key, which is deliberately last and never automated."
  - "No telemetry. Every signal — the startup line, keyring.reloaded, a rejected reload, an unreadable secret — lands in the operator's own logs and nowhere else. Vendor-observable KPIs are limited to Tenant Zero and the dev instance."
  - "The public repository carries the specifications, the product documentation and the chart. The platform's infrastructure and GitOps manifests live in the private lighthouse-platform repository, and the rotation walkthrough is split accordingly: the four operator actions and the ring grammar are public, the tenant's ExternalSecret template, ArgoCD Application values and concrete secret-store paths are private."
