# environments.yaml — epic-5733-opt-in-usage-data
#
# Consumed by DISTILL to parametrise acceptance scenarios. Five axes change behaviour:
#   auth on/off, licence tier, replica count, database provider, and fresh-install vs upgrade.
# Provider is an axis and not packaging: the dedup migration must be tested on both, and the
# get-or-create concurrency test is vacuous on EF InMemory, which does not enforce unique indexes.
# Everything else in this file is packaging.

target_environments:
  - name: standalone
    description: "Signed desktop binary. Single process, SQLite, auth impossible."
    platform: [windows, macos, linux]
    preconditions: []
    notes: "One replica by definition. Collector host overridable via appsettings.json."

  - name: docker-single
    description: "Single container. Reference shape for the slice-01 walking skeleton."
    platform: [linux]
    preconditions: ["container runtime"]
    notes: "Collector host overridable via environment variable."

  - name: kubernetes-single
    description: "Helm chart, Postgres-only, replicaCount 1."
    platform: [linux]
    preconditions: ["chart >= 0.1.16 for a collector host override"]
    notes: "Before 0.1.16 the chart cannot reach UsageData__CollectorBaseUrl at all."

  - name: kubernetes-multi
    description: "Helm chart, replicaCount > 1, Redis backplane configured."
    platform: [linux]
    preconditions: ["redis.connectionString set", "chart >= 0.1.16"]
    notes: >-
      Every replica runs the emitter. AC-04.1 (one heartbeat per instance per day) holds only
      because of the UsageData:LastHeartbeatDay compare-and-swap. This is the environment that
      falsifies it if the CAS is wrong, and the only one.

  - name: auth-off
    description: "DisabledAuthenticationHandler active — every caller is lighthouse|auth-disabled."
    platform: [windows, macos, linux]
    preconditions: ["no OIDC, no local auth"]
    notes: >-
      The consent endpoints are unauthenticated by necessity here, not by oversight. Per-account
      consent would collapse to one shared decision.

  - name: auth-on
    description: "OIDC or local authentication configured."
    platform: [windows, macos, linux]
    preconditions: ["identity provider reachable"]
    notes: >-
      Consent stays per browser. Two accounts sharing one browser share one decision — intended
      per D2, and currently written down nowhere. DISTILL owes it a scenario.

  - name: community-licence
    description: "No premium licence."
    platform: [windows, macos, linux]
    preconditions: []
    notes: "Admin cannot switch the asking off. Declined browsers are re-asked in ~3 months."

  - name: premium-licence
    description: "Valid premium licence imported."
    platform: [windows, macos, linux]
    preconditions: ["valid_not_expired_license.json imported"]
    notes: "Admin switch operable. A decline is final — the dialog says so, and must stay true."

  - name: air-gapped-self-collector
    description: "Customer points the channel at their own collector; no route to eu.i.posthog.com."
    platform: [linux, windows, macos]
    preconditions: ["UsageData__CollectorBaseUrl set to a customer endpoint", "chart >= 0.1.16 on Kubernetes"]
    notes: >-
      The non-negotiable inherited from Epic #5015 and the whole reason P4 exists. The substitute
      endpoint must speak PostHog's capture API — PostHog sunset its Helm deployment, so in practice
      that means their Docker Compose build or something protocol-compatible. This is not
      "point it at any URL" and the docs must not say it is.

  - name: upgrade-from-pre-5733
    description: "Existing install upgrading across the consent-table and AppSetting.Key index migration."
    platform: [linux, windows, macos]
    preconditions: ["database predates this Epic", "may contain duplicate AppSettings keys"]
    notes: >-
      The highest-risk environment in this feature and the only one where the dedup manifests.
      Must be exercised on both providers. A fresh install never reaches this code path.

  - name: rollback-after-upgrade
    description: "Image rolled back to the pre-5733 version after the migration has run."
    platform: [linux, windows, macos]
    preconditions: ["migration applied", "unique index present"]
    notes: >-
      The consent table is ignored by the old code and is fine. The unique index is not: the old
      image never ran against it, and the deleted duplicate rows cannot be restored by a Down
      migration. Recovery is a database restore. Assert the documented instruction matches reality.

  - name: ci-clean
    description: "GitHub Actions runner with no route to the collector host."
    platform: [linux]
    preconditions: ["no POSTHOG_* secrets in scope"]
    notes: >-
      Where the three hard gates run. All of them must pass with zero egress; a gate that needs
      a vendor to be reachable is not a gate. This is a CI shape, not a customer shape — it is
      not a substitute for air-gapped-self-collector.

coexistence_matrix:
  - tool: live-connector test categories (Jira, Linear, ADO, ServiceNow, GitHub)
    must_not_break: true
    note: "Program.cs edit expands the CI filter to the full Integration run. Land it in one commit."
  - tool: "Telemetry: configuration section (OpenTelemetry / Prometheus)"
    must_not_break: true
    note: "Namespace-disjoint by decision. Nothing new may be named Telemetry*."
  - tool: DeltaSync optional feature
    must_not_break: true
    note: "Not premium. Must stay ungated when the premium refusal becomes real in slice 03."
  - tool: existing OptionalFeaturesController callers
    must_not_break: true
    note: "AC-07.1 changes the response contract. Extend the test factory first."
  - tool: Helm installs on chart 0.1.15 and earlier
    must_not_break: true
    note: "0.1.16's value is additive with a default."
  - tool: local `dotnet test` without secrets
    must_not_break: true
    note: "UsageDataCanary category must be in the documented exclusion filter."

platform_coverage:
  Linux: [Ubuntu 22.04, Ubuntu 24.04]
  Windows: [Windows 11, Windows Server 2022]
  macOS: [13.x, 14.x]
  Kubernetes: [chart 0.1.16+, Postgres-only]
  CI: [GitHub Actions ubuntu-latest]

database_providers:
  # An axis, not packaging. Both must be exercised for the migration scenarios.
  - sqlite
  - postgres
  # EF InMemory is NOT a third option here: it does not enforce unique indexes, so the
  # get-or-create concurrency test passes vacuously on it.

deployment_assumptions:
  - "The consent table is expand-only: rolling the image back leaves a table the old code ignores."
  - "The AppSetting.Key migration is NOT reversible. It deletes duplicate rows before indexing, and
     a Down migration cannot restore them. Recovery from a bad upgrade is a database restore, not an
     image rollback, and the operator instruction must say so."
  - "A unique index on a shared pre-existing table constrains the rolled-back image too — it was
     never tested against that constraint."
  - "An install that never sets the collector host behaves exactly as it does today."
  - "The canary workflow is the only CI job that talks to the collector. This is enforced by the
     Integration test-category exclusion, not by network policy: GitHub-hosted runners have
     unrestricted egress and there is no per-workflow allowance to grant."
  - "Every E2E app-start block overrides the collector host to a blackhole, and the backend refuses
     an emit to the production default under a test environment — the override is six YAML lines and
     a missing one is silent."
