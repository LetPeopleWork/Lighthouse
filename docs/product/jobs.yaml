      emotional: >
        Move from discovering a dependency mid-review to knowing about it while reading the board.
      social: >
        Answer "why has that not started?" in the meeting rather than afterwards by email.
    forces:
      push: >
        The answer exists, in the tracker, one context switch away — and nobody makes that switch
        while reading a forecast, which is precisely when it matters.
      pull: >
        The fact and the dates on one screen.
      anxiety: >
        "Will another column make an already busy list unreadable?" Mitigated by shipping a count
        rather than a list, and putting the detail behind a click.
      habit: >
        Product owners already check the tracker for links. The change is not having to.
    opportunity_score:
      importance: 4
      current_satisfaction: 1
      gap: 3
      rationale: >
        Importance: 4 — a diagnostic that precedes a decision rather than being one. Current
        satisfaction: 1, not 0, because a real workaround exists: go and read the tracker. Gap: 3.

  - id: job-config-admin-point-at-the-field-that-carries-dependencies
    title: Name the field our dependencies actually live in
    persona: config-admin
    feature_context: epic-4365-dependencies
    created: 2026-08-14
    note: >
      RESOLVED by the user on 2026-08-14: the epic's "potentially allow the user to override (similar
      to parent override)" means the per-Portfolio pointer at a tracker field, in the shape of
      ParentOverrideAdditionalFieldDefinitionId (IWorkItemQueryOwner:27) — once per Portfolio, not a
      per-Feature value. A per-Feature declaration made inside Lighthouse was considered during the
      DISCUSS wave and rejected: it would make Lighthouse an author of dependency data rather than a
      reader of it.

      One real difference from the parent override, and it is where the work is: a parent is 0..1, so
      GetParentReference (AzureDevOpsWorkTrackingConnector.cs:1095-1106) returns one string. A
      dependency list is 0..n, so the field's value has to be split and each entry resolved
      independently, with an unresolvable entry skipped rather than discarding the list beside it.
    job_story: >
      When my teams record dependencies in a custom field rather than the tracker's built-in link
      type, I want to tell Lighthouse which field that is, once, for the whole Portfolio, so our
      instance gets dependency forecasting without anyone re-recording anything.
    dimensions:
      functional: >
        A per-Portfolio setting naming an additional field; when set, the connector reads dependencies
        from it and skips the relation fetch entirely.
      emotional: >
        Move from "this feature is not for us, our tracker is configured differently" to setting one
        dropdown and having it work.
      social: >
        Avoid being the admin who has to tell a team their process is wrong for the tool.
    forces:
      push: >
        Without it the instance gets nothing at all — not a degraded version, an empty column — and
        the reason is invisible: the tracker holds the data, in a field the connector does not read.
      pull: >
        One dropdown beside the parent override the same person already set.
      anxiety: >
        "If I point it at the wrong field, does the forecast quietly go wrong?" Mitigated because an
        entry that resolves to no Feature is skipped and shown as skipped, rather than guessed at.
      habit: >
        Config admins already map fields for this connection; this is one more row in a form they
        have filled in before.
    opportunity_score:
      importance: 4
      current_satisfaction: 0
      gap: 4
      rationale: >
        Importance: 4 rather than 5 because it is conditional on how a given tracker is configured:
