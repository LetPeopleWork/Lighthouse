  # --- Epic #5565 Sync Delivery Dates with the Work Tracking System (feature epic-5565-delivery-date-sync) ---

  - id: job-forecaster-bind-a-delivery-to-the-release-it-tracks
    title: Point a Delivery at the Release it already tracks
    persona: delivery-forecaster
    feature_context: epic-5565-delivery-date-sync
    job_story: >
      When the thing I am forecasting already exists as a Release in the work tracking system,
      I want to point a Delivery at it instead of describing it again,
      so I stop maintaining the same date and the same scope in two places that can disagree.
    dimensions:
      functional: >
        A third way to define a Delivery, beside Manual and Rules: pick a Release the connected system
        offers, and the Delivery takes its name, its date and its Features from that Release. The
        Release's identifier is what is stored, so a rename on the far side does not break the link.
        Available only where the connection actually offers it — four of the five connectors have no
        Release concept and show nothing.
      emotional: >
        Move from the low-grade suspicion that comes with owning a hand-copied number, into not having
        to think about the date at all.
      social: >
        A Delivery whose date is visibly the work tracking system's date cannot be argued with as
        "someone's optimistic guess". The provenance is the credibility.
    forces:
      push: >
        The date already exists and is already maintained by the project system. Copying it into
        Lighthouse is duplicate effort, and the two copies start disagreeing the first time one moves.
        Picking the Features by hand repeats the same problem for scope.
      pull: >
        One picker replaces a typed name, a typed date and a hand-picked Feature list — and it keeps
        being right afterwards, which hand entry never does.
      anxiety: >
        "Will it actually find my Features?" — met by previewing before saving. The version has to be
        set on the items Lighthouse tracks for a Release to carry them; that is a convention the team
        owns, and an item without one is simply not in the Release, exactly as a Feature failing a rule
        is not in a rule-based Delivery. An empty preview therefore names a Jira-side gap the team can
        close, rather than leaving the user staring at a blank grid.
        Second worry: "am I giving up control?" — met by unbind, which returns the Delivery to Manual
        with everything it last synced, editable.
      habit: >
        The habit is creating a Delivery by typing what you already know, because that is the only way
        the product has ever offered. The picker has to be visibly the same act, one step shorter.
    opportunity_score:
      importance: 4
      current_satisfaction: 1
      gap: 3
      rationale: >
        Importance: 4 — the request came from a customer, and it removes a standing correctness risk
        rather than an inconvenience. Current satisfaction: 1 — nothing exists; the connector has no
        Release code at all. Rules can approximate the Feature selection if an admin configures the
        version as an additional field, but yield no date, match a single string against a list, and
        break silently on rename, so the approximation is worse than the absence.

  - id: job-forecaster-trust-the-delivery-date-without-rechecking-jira
    title: Present a forecast without first checking the target still holds
    persona: delivery-forecaster
    feature_context: epic-5565-delivery-date-sync
    job_story: >
      When a Release date moves in the work tracking system,
      I want Lighthouse to already know,
      so I can present a likelihood without first opening the other tool to check what it is measured
      against.
    dimensions:
      functional: >
        A bound Delivery re-reads its Release's date, name and membership on every Portfolio refresh,
        on the cadence the Portfolio already runs. A date that has moved into the past is accepted and
        shown as overdue rather than rejected. A Release that has disappeared freezes the Delivery on
        its last known values and says so, instead of leaving a stale date looking live.
      emotional: >
        Move from the pre-meeting ritual of cross-checking two tools, into quoting the number on screen.
      social: >
        Being the person whose forecast is measured against the current target, not last month's — the
        difference between a forecast that informs a decision and one that gets corrected in the room.
    forces:
      push: >
        A likelihood is a statement about a target. When the target silently moves, the likelihood is
        quietly wrong, and nobody can tell how long it has been wrong. The current answer is that
        somebody notices and re-types it.
      pull: >
        The date is simply right, with no action and no new setting, on the same cycle everything else
        on the Delivery already updates.
      anxiety: >
        "How do I know it synced?" — met by showing the provenance and the last successful sync on the
        Delivery itself, and by making a vanished Release say so rather than sit there looking current.
        Second worry: a transient read failure must not be mistaken for a deleted Release, or every
        network blip cries wolf.
      habit: >
        The habit is checking the other tool before a review, because it has always been the only way
        to be sure. That habit only dies once the displayed date has been visibly right through a
        move the user watched happen.
    opportunity_score:
      importance: 5
      current_satisfaction: 1
      gap: 4
      rationale: >
        Importance: 5 — this is the Epic's actual payload. Binding a Delivery to a Release without
        keeping it in step would just relocate the manual copy. A forecast measured against a stale
        target is the single most consequential way this product can be wrong while looking right.
        Current satisfaction: 1 — no mechanism exists, so drift is undetectable rather than merely
        uncorrected.

  - id: job-po-see-the-forecast-without-opening-lighthouse
    title: See the forecast on the Release, in the tool I already use
    persona: product-owner
    feature_context: epic-5565-delivery-date-sync
    job_story: >
      When I plan against a Release in the work tracking system,
      I want the forecast to be on that Release,
      so I can judge whether the plan is credible without being asked to learn another tool.
    dimensions:
      functional: >
        An opt-in, per-Portfolio publish that writes the Delivery's forecast — the 85% date, the
        likelihood of hitting the target, and when it was last updated — into a delimited block on the
        Release itself. Re-writing replaces the block rather than appending; text around it is never
        touched. Only Deliveries bound to a Release publish; the rest have nowhere to write to.
      emotional: >
        Move from planning against a target date as though it were a forecast, into knowing the
        difference between the two without asking anyone.
      social: >
        The scope conversation happens among the people who own the scope, in their own tool, without a
        Lighthouse user having to be in the room to translate.
    forces:
      push: >
        The forecast exists and the people who most need it never see it. Today they either ask someone
        or treat the target date as a prediction, which is precisely the confusion the product exists
        to remove.
      pull: >
        The number appears where they already look, with no new tool, no new login and no new habit.
      anxiety: >
        "Is Lighthouse going to change my Release date?" — the decisive worry, and the reason the
        forecast is written to the description and never to the date field. Lighthouse must not
        overwrite the field it declares the far side owns, or its own forecast becomes the target it is
        then measured against.
        Second worry: notification noise, met by reusing the suppression posture already established
        for write-back.
      habit: >
        The habit is planning to the release date because it is the only date visible. A second,
        clearly-labelled date next to it is the smallest possible intervention in that habit.
    opportunity_score:
      importance: 3
      current_satisfaction: 1
      gap: 2
      rationale: >
        Importance: 3 — high reach and low certainty. It puts the forecast in front of a much larger
        audience than opens Lighthouse, but the underlying work item had no description at all, so the
        demand is inferred from the Epic rather than evidenced by a request. Current satisfaction: 1 —
        the forecast is invisible outside Lighthouse. Sequenced last deliberately: if the
        permission bar for writing a Release turns out to be prohibitive, this detaches cleanly and the
        inbound jobs still ship whole.

  - id: job-config-admin-know-when-a-delivery-source-degrades
    title: Know when a synced Delivery has stopped being synced
    persona: config-admin
    feature_context: epic-5565-delivery-date-sync
    job_story: >
      When something on the far side changes underneath a Delivery that was syncing — the Release is
      deleted, the credential loses sight of the project, or a write is refused —
      I want Lighthouse to say so where I would look,
      so I fix the cause instead of discovering months later that a number stopped updating.
    dimensions:
      functional: >
        Three degradations, each visible where the person who can fix it already looks. A vanished
        Release: the Delivery keeps its last synced values, says the source is unavailable, names when
        it last synced, and offers a way back to manual control. A connection that no longer offers the
        capability at all: degrades identically rather than erroring. A refused write: reported against
        the connection, naming the project and the time, without disabling anything and without a tight
        retry.
      emotional: >
        Move from the background dread of silent staleness into a state where anything that stopped
        working is something you were told about.
      social: >
        Never being the admin who switched something on months ago and cannot say whether it has been
        working since.
    forces:
      push: >
        A frozen date looks exactly like a live one. A refused write looks exactly like a feature that
        was never switched on. Both are the kind of quiet wrongness nobody discovers until it has
        already misinformed a decision.
      pull: >
        Each failure names itself, in the place its fix lives, with enough detail to act on — the
        project, the time, and what was refused.
      anxiety: >
        "Will this cry wolf?" — the real risk. A transient read failure must not be mistaken for a
        deleted Release, or every network blip raises an alarm and the alarms stop being read. Only a
        resolved "this does not exist" raises the broken-source state.
        Second worry: that a refused write takes down the reading too. It must not — reading Releases
        and writing them are separate capabilities, and a credential that can do one but not the other
        should degrade on one side only.
      habit: >
        The habit is trusting that a switch left on is still working, because nothing has ever said
        otherwise. Reporting the exception is what replaces that assumption with a check.
    opportunity_score:
      importance: 4
      current_satisfaction: 0
      gap: 4
      rationale: >
        Importance: 4 — the two inbound jobs are both about not being quietly wrong, and this is what
        stops the sync itself becoming a new way to be quietly wrong. Current satisfaction: 0 rather
        than 1, because unlike every other job here there is no partial answer today: the mechanism
        being reported on does not exist yet, so the degradation and its reporting have to arrive
        together or the feature ships with a silent failure mode built in.

  - id: job-maintainer-see-the-installed-base
    title: Know how many Lighthouse instances exist and which versions they run
    persona: lighthouse-maintainer
    feature_context: epic-5733-opt-in-usage-data
    created: 2026-08-22
    note: >
      NEW in epic-5733-opt-in-usage-data (ADO #5733, superseding the Removed #5015). Lighthouse is
      self-hosted and no instance reports anything, so the installed base is genuinely unknown — its
      only proxies are GitHub download counts and whoever happens to post in the community channel.
      The instance heartbeat this Epic adds is the first signal of its kind, and it is gated on a
      browser holding live consent, so the census counts instances with at least one consenting user
      rather than instances.
    job_story: >
      When I am planning a breaking change, an upgrade path, or dropping support for something,
      I want to know how many instances exist and which versions they are running,
      so I can pick a date that does not strand people, and afterwards see whether the upgrade
      actually propagated.
    dimensions:
      functional: >
        A daily heartbeat from consenting instances carrying an anonymous instance identifier, the
        Lighthouse version, the deployment mode (standalone / container / cluster) and the licence
        tier — five fields, enumerated in the consent dialog and in the docs before any is sent.
      emotional: >
        Move from guessing ("I think most people are on a recent version") to knowing, and from
        anxiety about breaking an invisible user to a dated, defensible deprecation decision.
      social: >
        Be a maintainer who announces deprecations with a number attached rather than an apology
        afterwards.
    forces:
      push: >
        Every support conversation starts by asking what version they are on, because there is no
        other way to find out. Deprecation dates are set by feel. An upgrade ships and nobody knows
        whether anyone took it.
      pull: >
        One small daily signal answers all three questions at once, and it is the cheapest possible
        payload — no user in it, nothing about what anyone does.
      anxiety: >
        That a phone-home, however minimal, breaks the promise the product has made in its own UI and
        in its CRA self-assessment. Mitigated by making consent the precondition for the very first
        byte, and by correcting both of those surfaces in the same slice.
      habit: >
        The habit is inferring the installed base from GitHub download counts and community chatter,
        and treating "we cannot know" as a fixed constraint rather than a decision.
    opportunity_score:
      importance: 4
      current_satisfaction: 0
      gap: 4
      rationale: >
        Importance: 4 — every deprecation, migration and support decision currently rests on a guess.
        Current satisfaction: 0, not 1: there is no partial answer today, only proxies that measure
        downloads rather than running instances. Gap: 4 — the largest in this Epic, and the cheapest
        to close, because the payload has no user in it and needs no event vocabulary.

  - id: job-maintainer-know-if-a-shipped-feature-landed
    title: Tell whether a shipped feature is actually being used
    persona: lighthouse-maintainer
    feature_context: epic-5733-opt-in-usage-data
    created: 2026-08-22
    note: >
      NEW in epic-5733-opt-in-usage-data. Seven outcome KPIs across five earlier features sit at
      status deferred-pending-telemetry-feature in docs/product/kpi-contracts.yaml, each naming the
      telemetry gap as blocked_by. This is the job those KPIs were written for. It is deliberately
      sequenced last in the Epic: the event vocabulary should be chosen once there is a real
      consenting population to spend it on.
    job_story: >
      When I have shipped a feature,
      I want to see whether anyone turned it on and kept using it,
      so I can decide to invest further, fix it, or retire it — instead of reading three support
      tickets and calling it a signal.
    dimensions:
      functional: >
        A small named set of product events (two to four, chosen deliberately per slice) carrying the
        instance identifier and nothing about the customer's content, subject to the same consent and
        the same administrator switch as the heartbeat, enumerated in the docs and the consent dialog
        before any is emitted.
      emotional: >
        Move from building on faith to building on evidence — and from the specific discomfort of not
        knowing whether the last three months of work mattered to anyone.
      social: >
        Be able to tell the community why a feature is being invested in or retired, with the reason
        rather than the assertion.
    forces:
      push: >
        Post-release questions are answered from community chatter and from the vendor's own instance,
        which is a sample of one. Seven KPIs have been sitting unmeasurable for months.
      pull: >
        A handful of named events answers the question directly, and the KPI contracts already say
        exactly which questions matter — the minimum event set does not have to be guessed.
      anxiety: >
        That "a few events" becomes "instrument everything", which is both a privacy problem and the
        thing the originating Epic explicitly warned against. Mitigated by a hard two-to-four limit
        per slice and by requiring every event to be documented before it is emitted.
        Second worry: whether widening the payload requires re-consent from browsers that agreed to
        a narrower one. Unresolved — a legal question, flagged rather than assumed.
      habit: >
        The habit is treating "we cannot measure adoption" as a property of being self-hosted rather
        than as a decision that was never revisited.
    opportunity_score:
      importance: 5
      current_satisfaction: 1
      gap: 4
      rationale: >
        Importance: 5 — this is the Epic's stated primary goal ("gauge whether certain features had
        an effect or not") and it gates the product's whole feedback loop. Current satisfaction: 1 —
        community feedback and the vendor demo instance are real signals, just heavily biased and
        tiny. Gap: 4 — high, but scored below a 5 because closing it depends on a consenting
        population that does not exist yet, so the event set alone does not deliver the outcome.

  - id: job-user-decide-once-whether-lighthouse-may-learn-from-me
    title: Decide, on evidence, whether Lighthouse may learn from how I use it
    persona: privacy-decider
    feature_context: epic-5733-opt-in-usage-data
    created: 2026-08-22
    note: >
      NEW in epic-5733-opt-in-usage-data. The consent unit is the browser, not the user account:
      authentication is optional in Lighthouse and impossible in standalone, and with auth off every
      caller shares the subject "lighthouse|auth-disabled", so an account-scoped consent would
      collapse to one person deciding for everybody. The record is an opaque token minted after the
      click — deliberately not a device fingerprint, which would need consent before it could be
      taken and so could never record consent in the first place.
    job_story: >
      When Lighthouse asks whether it may send usage data,
      I want to see exactly what would leave my machine and decide once,
      so I can help improve the tool without feeling watched — and change my mind later without
      hunting through settings for the switch.
    dimensions:
      functional: >
        A dialog that names every field in the payload, says where it goes and who runs it, says what
        is never sent, and offers two decisions and no dismiss; a permanent footer indicator showing
        the current state in words; and a one-click revocation that stops the next transmission.
      emotional: >
        Move from the low background unease of not knowing what a tool sends home, to a settled sense
        of having read the list and chosen — and knowing the choice is still mine.
      social: >
        Contribute to something used by peers, visibly and voluntarily, rather than being harvested.
        Weak for someone who declines, and that is fine: the job is the decision, not the yes.
    forces:
      push: >
        Nothing in the product says what it sends anywhere, and the one statement that exists — a
        popup claiming Lighthouse never tracks you — is about to stop being true. Meanwhile the
        instance already calls GitHub for the release check and nobody has ever been told.
      pull: >
        A list rather than a category, a named recipient, and a control that stays where you can see
        it. Consent to a specific thing is easy to give; consent to "usage data" is not.
      anxiety: >
        The recorded frustrations of the community-respondent persona are the exact risks here:
        "I worry an in-app survey is quietly phoning home my usage data", and "once I dismiss a nag it
        often comes back next session — I cannot make it stop". The second is answered by no
        remind-me-later and an honest statement of the re-ask cadence; the first by making nothing
        leave before the click and proving it.
      habit: >
        The habit is dismissing consent dialogs unread, because almost all of them are unreadable and
        almost none of them are honest about whether they will return.
    opportunity_score:
      importance: 5
      current_satisfaction: 0
      gap: 5
      rationale: >
        Importance: 5 — this is the non-negotiable the whole Epic is built around; getting it wrong
        does not merely fail the job, it damages the product's standing. Current satisfaction: 0 —
        there is no consent surface at all, and the only relevant statement in the product is one that
        is about to become false. Gap: 5 — the highest here, and the reason the walking skeleton
        leads with the consent path rather than with the events.

  - id: job-admin-stop-lighthouse-asking-my-people
    title: Enforce an organisational policy on usage data with one switch
    persona: config-admin
    feature_context: epic-5733-opt-in-usage-data
    created: 2026-08-22
    note: >
      NEW in epic-5733-opt-in-usage-data. Modelled as a premium OptionalFeature defaulting to on: it
      governs whether Lighthouse may ask, not whether the user consented. Turning it off suspends
      existing consent rather than revoking it, and turning it back on resumes silently — the
      administrator overrode the user's choice, the user never withdrew it. The premium gating is a
      deliberate commercial line: a Community administrator can see the switch and cannot move it.
    job_story: >
      When my organisation's policy forbids product analytics,
      I want one switch that stops the asking for everyone and guarantees nothing can be sent,
      so I can close the security review with a screenshot instead of a discussion, and without
      relying on every individual answering no.
    dimensions:
      functional: >
        An instance-wide, system-administrator-only switch that both suppresses the prompt and stops
        emission at the emit path — including from browsers holding live consent and from stale tabs
        — with the suspend-and-resume behaviour stated in plain words on the settings page.
      emotional: >
        Move from "I have to trust that nobody clicked yes" to being able to demonstrate the control,
        which is the difference between a policy and a hope.
      social: >
        Be the administrator who can answer the security questionnaire in one screen rather than
        escalating it to the vendor.
    forces:
      push: >
        Without an instance-level lever, an organisational policy is enforced by asking every user
        individually and hoping — which is not an answer a security review accepts.
      pull: >
        One toggle, in the place toggles already live, guarded by the permission that already guards
        them, visible in a screenshot.
      anxiety: >
        That the switch does not actually do what it says. This is a live risk rather than a
        hypothetical: the existing premium gate on optional features silently drops the write and
        returns success, so a Community administrator today can turn something "off" and have nothing
        happen. That defect is fixed as part of this job, because a privacy control cannot ship on it.
        Second worry: that turning it off destroys consent that would then have to be re-collected —
        answered by suspend-and-resume, and by saying so on the page.
      habit: >
        The habit is looking for privacy controls in a security or privacy section, not in a list of
        optional features. Watch the first support question for whether this home was the right one.
    opportunity_score:
      importance: 4
      current_satisfaction: 0
      gap: 4
      rationale: >
        Importance: 4 — high, and specifically load-bearing for regulated and enterprise adopters,
        but it serves fewer people than the individual consent decision. Current satisfaction: 0 —
        nothing to govern today, and the mechanism that would govern it is itself defective. Gap: 4 —
        real, and cheap to close because the toggle scaffolding, the permission guard and the premium
        field all already exist.

  - id: job-operator-trust-that-a-finished-refresh-tells-the-truth
    title: Believe the status a refresh reports
    persona: platform-operator
    feature_context: epic-5511-task-manager
    created: 2026-08-23
    note: >
      NEW in epic-5511-task-manager, from ADO Bug #5788. This job exists because the product currently
      fails it outright rather than serving it partially: a periodic refresh that throws pushes
      Status=Completed to the browser while the RefreshLog row written in the same finally block says
      Success=false. UpdateProgress.Failed exists in the enum and is unreachable from any periodic
      refresh. Every other job in this Epic is built on the surface this one repairs, which is why it
      ships first and alone.
    job_story: >
      When a scheduled refresh ends,
      I want the answer I am shown to be the answer that happened,
      so I can build an operational habit on it instead of treating a green tick as decoration.
    dimensions:
      functional: >
        The terminal status delivered over SignalR agrees with the RefreshLog row and the summary line
        the same run wrote, on both the success and the failure path.
      emotional: >
        Move from a quiet suspicion that the indicators are cosmetic to being able to act on one.
      social: >
        Be able to tell a colleague "it failed at 14:20" from the product, rather than from a log file
        they would have to take on trust.
    forces:
      push: >
        A failure is currently indistinguishable from a success in the browser. The operator finds out
        days later, from a throughput chart that stopped moving.
      pull: >
        The correct answer is already computed and already persisted twice per run. Only the channel the
        user is looking at reports the wrong one.
      anxiety: >
        That letting the exception through changes behaviour for callers that await an update, or
        strands a write-back round, or leaves work held behind the failed key parked for good. All three
        are real and all three are acceptance criteria.
      habit: >
        Operators have learned to ignore the indicator and open the refresh history instead, which is
        exactly the habit this Epic is trying to make unnecessary.
    opportunity_score:
      importance: 5
      current_satisfaction: 0
      gap: 5
      rationale: >
        Importance 5 - it is not a missing feature but a false statement, and every surface this Epic
        adds would repeat it. Current satisfaction 0 - the browser is wrong 100% of the time a periodic
        refresh fails. Gap 5, the largest in the Epic, and the cheapest to close.

  - id: job-operator-see-what-lighthouse-is-doing-right-now
    title: See what is running and what is waiting, from wherever I am
    persona: platform-operator
    feature_context: epic-5511-task-manager
    created: 2026-08-23
    note: >
      NEW in epic-5511-task-manager. The Epic's central job. Note the constraint the user set on the
      solution shape: a header popover, not a page - "something you just quickly check, independent of
      where you are". A surface that costs a navigation does not serve this job even if it shows the
      same information. Also note the store cannot answer this today: IUpdateStatusStore offers TryGet
      per key and HasActiveWork as a bool, and nothing that enumerates.
    job_story: >
      When I am wondering whether Lighthouse is working or wedged,
      I want to see what is running and what is waiting without leaving the page I am on,
      so the question costs me a glance instead of a log download.
    dimensions:
      functional: >
        A live list of every admitted update - type, entity name, status - readable from any page, and
        correct across replicas rather than reporting only the pod that answered.
      emotional: >
        Move from "I think it is stuck, but I cannot tell" to a settled answer in one click.
      social: >
        Answer a colleague's "is the sync running?" immediately, rather than promising to check.
      # The list is admin-only for the same reason the refresh log and the log file already are: it
      # carries team and portfolio names, connection names and connector failure text.
    forces:
      push: >
        Nothing in the product lists what is running. The only global signal is a boolean count, and
        under Redis it counts only the calling pod's own dictionary.
      pull: >
        The live channel already exists - every client joins a GlobalUpdates SignalR group that already
        fires on every status change. The surface needs no new transport.
      anxiety: >
        That a list of raw update keys is not actually legible - UpdateType has five members and two of
        them are delete operations the UI has never had to name.
      habit: >
        Today the habit is to open Settings, find System Info, and read a refresh history that is not
        live. The popover has to be enough better to displace that.
    opportunity_score:
      importance: 5
      current_satisfaction: 1
      gap: 4
      rationale: >
        Importance 5 - it is the Epic. Current satisfaction 1 rather than 0 because the refresh history
        under System Info answers the past tense of the question. Gap 4.

  - id: job-operator-stop-a-refresh-that-is-doing-harm
    title: Stop a refresh without restarting the instance
    persona: platform-operator
    feature_context: epic-5511-task-manager
    created: 2026-08-23
    note: >
      NEW in epic-5511-task-manager. Cancellation is cooperative and best-effort by user decision -
      hard abort risks half-written work items and an orphaned write-back round. The honest risk is
      recorded rather than smoothed over: no method on IWorkTrackingConnector takes a CancellationToken,
      and the evidence from Epic #5687 says the wall-clock of a refresh is overwhelmingly connector
      paging. So the reachable checkpoint may be coarse. The slice opens with a probe that measures it,
      and the acceptance criterion asserts the measured number rather than an intention.
    job_story: >
      When a refresh is hammering a tracker I need quiet, or chewing through a rate limit I share with
      other tools,
      I want to stop it from inside Lighthouse,
      so my options are not "wait it out" or "restart the container".
    dimensions:
      functional: >
        Queued work is dropped before it starts; running work stops at its next reachable checkpoint;
        the outcome is a visible terminal state rather than a silent disappearance.
      emotional: >
        Move from watching something you caused and cannot stop to having a lever.
      social: >
        Be able to answer the platform team's "can you stop it?" with yes.
    forces:
      push: >
        There is no cancel anywhere. The queue holds Func<Task> and no token; restarting the process is
        the only way to stop a running refresh, and that takes everything else down with it.
      pull: >
        The queue already owns the lifecycle of every admitted key, so it is the natural owner of a
        token per key, and an ambient scoped context already exists for exactly this kind of value.
      anxiety: >
        That cancelling mid-flight leaves half-written work items, or strands the write-back round the
        run belonged to - a round that never finishes silently drops everything it staged.
      habit: >
        Operators currently reach for the container restart, which is a bigger hammer with side effects
        they have learned to tolerate.
    opportunity_score:
      importance: 4
      current_satisfaction: 0
      gap: 4
      rationale: >
        Importance 4 - real and occasionally urgent, but wanted less often than knowing what is running.
        Current satisfaction 0 - the capability does not exist in any form. Gap 4, with the highest
        implementation uncertainty in the Epic.

  - id: job-config-admin-know-any-credential-is-failing-not-just-oauth
    title: Be told when any connection's credential breaks, whatever its authentication method
    persona: config-admin
    feature_context: epic-5511-task-manager
    created: 2026-08-23
    note: >
      NEW in epic-5511-task-manager, from ADO User Story #5019. The existing header icon reads
      OAuthCredential.Status, so a connection with no OAuth credential row is invisible to it - which is
      every PAT and every scoped API token. Generalising it is not a rename: a Jira 401 currently
      arrives at the updater as an untyped Exception, so the signal this job needs does not yet exist.
      Health is derived from classified refresh failures plus an on-demand test, never from a background
      probe loop - a loop would add recurring outbound calls to rate limits we already share and already
      trip. A connection that has never failed and never been tested reads Unknown, not Healthy.
    job_story: >
      When a connection's credential stops working - a revoked token, an expired PAT, a deprovisioned
      owner -
      I want Lighthouse to say so regardless of which authentication method that connection uses,
      so I fix it before the team notices their data froze.
    dimensions:
      functional: >
        A health state per connection covering every authentication method, plus a way to re-check one
        on demand.
      emotional: >
        Move from discovering a dead credential through a complaint to noticing it yourself.
      social: >
        Be the administrator whose integrations do not quietly rot.
    forces:
      push: >
        Non-OAuth authentication fails silently. Lighthouse keeps making 401-returning calls, team data
        freezes, and the first signal is a flat throughput chart nobody can date.
      pull: >
        The refresh that would notice is already happening on a schedule. The signal is a by-product of
        work already being done, not a new outbound cost.
      anxiety: >
        That a mis-classified failure sends someone to reissue a credential that was never the problem.
        Answered by refusing to say "authentication failed" unless the connector actually said so.
      habit: >
        Administrators check a credential when something looks wrong, not on a cadence - so the product
        has to be the one that notices.
    opportunity_score:
      importance: 4
      current_satisfaction: 1
      gap: 3
      rationale: >
        Importance 4 - a dead credential silently freezes a team's data, which is the failure mode this
        product can least afford. Current satisfaction 1 - OAuth connections are covered today and are a
        real share of connections. Gap 3.

  - id: job-operator-read-the-warnings-without-reading-the-log
    title: See recent warnings without deciding to open a log file
    persona: platform-operator
    feature_context: epic-5511-task-manager
    created: 2026-08-23
    note: >
      NEW in epic-5511-task-manager. There is no structured log store: Serilog writes to a rolling text
      file and the read path loads the newest file whole into a string. So this is a new bounded
      in-memory sink, not a query. Being per-process and restart-scoped is a real limitation and the
      copy has to say so - an operator who believes a short list is a complete history draws a wrong
      conclusion from it.
    job_story: >
      When something has gone wrong repeatedly,
      I want the warnings and errors surfaced where I already look,
      so noticing does not depend on me choosing to read a log file.
    dimensions:
      functional: >
        The most recent warning-and-above events as structured records, in the same popover as the task
        list, with a link to the full log.
      emotional: >
        Move from a suspicion that something has been failing to seeing it.
      social: >
        Be able to paste the actual message into a support conversation rather than describing symptoms.
    forces:
      push: >
        Warnings exist only inside a rolling text file. Noticing requires deciding to go and look, which
        is the step that does not happen.
      pull: >
        The events are already being emitted and the level switch is already runtime-adjustable; a sink
        is a small addition to a pipeline that already exists.
      anxiety: >
        That a level filter surfaces noise rather than signal, and the section becomes a wall of text
        nobody reads. This is the slice's stated hypothesis, and the answer decides whether the follow-up
        is curation rather than filtering.
      habit: >
        The habit is to open the log only after something has already gone visibly wrong - which is by
        definition too late to be a warning.
    opportunity_score:
      importance: 3
      current_satisfaction: 1
      gap: 2
      rationale: >
        Importance 3 - genuinely useful, but it explains a problem rather than surfacing one, so it
        serves the operator after the task list has already got their attention. Current satisfaction 1 -
        the log viewer exists and works, it just requires intent. Gap 2, the smallest in the Epic, which
        is why it ships last.

  - id: job-admin-find-every-instance-switch-in-one-place
    title: Find every instance-wide switch in one place
    persona: config-admin
    feature_context: story-5876-behaviour-settings
    created: 2026-08-31
    note: >
      NEW in story-5876-behaviour-settings. Grounded in a code reality check on 2026-08-31 that
      contradicted the ADO description in one respect and sharpened it in another. The description
      says "the optional features must support Premium only flags" - they already do: OptionalFeature
      carries IsPremium and IsPreview, OptionalFeatureSeeder refreshes both on every upgrade, and
      SystemSettingsTab already renders a premium row as a disabled Switch inside a LicenseTooltip.
      Nothing has ever exercised that branch, because DeltaSync is the only live optional feature and
      it is preview, not premium.

      What the description does not carry is the reason the move is not a move. Ordering ownership is
      an enum in AppSetting, and flipping it runs FeatureRankSeeder.SeedMissingRanks() BEFORE the
      value is persisted. That ordering is load-bearing: SeedMissingRanks reads the sequence through
      IFeatureOrdering, which reads the policy, so seeding after the flip sorts by an all-null
      ManualRank and renumbers the whole list in Id order. "Nothing moves when you turn it on" is the
      promise the control was built on, and a post-commit domain-event handler breaks it.

      Two further finds: OptionalFeatureSeeder never overwrites Enabled on an existing key, so a new
      key gets exactly one chance to carry the old value across, at first add. And the premium gate at
      OptionalFeaturesController:41 returns 200 with the unchanged entity, so this story - which
      creates the first premium optional feature - is the first change that makes that branch
      reachable at all.
    job_story: >
      When I want to change how my Lighthouse instance behaves,
      I want every instance-wide switch to be in the same list,
      so I can find the one I need without already knowing which release introduced it.
    dimensions:
      functional: >
        One table under Settings - System listing every instance-wide behaviour switch, each with its
        name, what it does, whether it is on, and whether the licence covers it.
      emotional: >
        Move from scanning a settings page for sections that happen to contain a switch, to reading
        one list and knowing it is complete.
      social: >
        Be able to answer "what is turned on in our instance" from one screenshot rather than from
        memory of the release notes.
    forces:
      push: >
        Which switches live in the Optional Features table and which live in their own section is a
        fact about release history, not about what they do. Manual ordering shipped as its own section
        because it arrived with its own Epic.
      pull: >
        The table already exists, already renders premium and preview rows correctly, and already has
        the guard the ordering setting needs. Nothing has to be built for the destination.
      anxiety: >
        That the move loses the setting on upgrade, or that turning it on for the first time
        re-sequences the list. Both are real failure modes with named mechanisms, not vague risk -
        the seeder gets one shot at the value, and the seed must observe the pre-flip order.
      habit: >
        Administrators look for a setting where they last saw it. A move is only worth it if the new
        place is the one they would look first - which is why the group is renamed to say what its
        rows decide rather than that they are optional.
    opportunity_score:
      importance: 2
      current_satisfaction: 1
      gap: 1
      rationale: >
        Importance 2 - the setting is findable today, just not where a reader would look, so this is
        coherence rather than capability. Current satisfaction 1 - there are two places to look and no
        rule saying which. Gap 1, the smallest of any job on the board, which is honest: the value
        here is that every future instance-wide switch has an obvious home, not that this one switch
        was hard to find.
