  - id: job-flow-coach-read-blocked-health-at-a-glance
    title: Read blocked health at a glance without reading each blocked item
    persona: flow-coach
    feature_context: epic-5074-blocked-items
    job_story: >
      When I scan a team's dashboard during a flow review and I want to know whether blocked items
      need attention right now,
      I want the Blocked widget to show a red/amber/green status driven by how long the
      longest-blocked item has been stuck,
      so I can decide whether to dig into blockers this session without opening and reading the age of
      every blocked item.
    dimensions:
      functional: >
        A RAG (red/amber/green) indicator on the Blocked overview widget keyed on MAX blocked age
        across the currently-blocked items, calibrated against the existing
        blockedStalenessThresholdDays: red = an item has been blocked past the threshold, amber = an
        item is aging toward it, green = nothing is aging. Uses the blockedSince already available on
        the blocked items in the metrics view.
      emotional: >
        Move from "there are 5 blocked, but I don't know if any are urgent" to "the widget is red — the
        oldest blocker has crossed our line, dig in now" — an at-a-glance triage cue.
      social: >
        Be the coach whose dashboard surfaces the urgent case immediately, so the team trusts the widget
        to flag "this needs a conversation today".
    forces:
      push: >
