  - id: job-operator-survive-multiple-replicas
    title: Run Lighthouse with more than one replica without it breaking
    persona: platform-operator
    feature: epic-5305-k8s-readiness
    job_story: >
      When I scale Lighthouse past a single replica behind a load balancer so it can absorb
      load and survive a node failure,
      I want each external work-tracking sync to run once across the fleet, every client to
      receive every SignalR notification regardless of which pod raised it, and concurrent
      pod startups to apply migrations exactly once,
      so I can operate Lighthouse as a normal horizontally-scaled web app instead of a
      single-instance singleton that corrupts itself the moment a second pod starts.
    dimensions:
      functional: One distributed update path (single consumer / cluster-wide per-entity lock + shared status store); SignalR Redis backplane; migration lock so exactly one pod migrates
      emotional: Move from "I daren't run more than one pod" to "I scale this like any other service"
      social: Stand behind an SLA — "Lighthouse stays up through a node failure" — to my own stakeholders
    forces:
      push: Lighthouse is a stateful singleton; >1 replica means N× syncs racing Postgres rows, notifications that reach only one pod's clients, and a per-pod status cache that answers inconsistently
      pull: A genuinely cluster-safe app scales on CPU, rolls without flapping, and tolerates a lost node
      anxiety: >
        Will electing a leader for the timer fix it, when manual refreshes are handled inline on
        whichever replica serves the request? Will I silently double-sync and not notice?
      habit: Operators expect a web app to be stateless-enough to scale by changing a replica count
    opportunity_score:
      importance: 5
      current_satisfaction: 1
      gap: 4
      rationale: >
        Importance: 5 - hard blocker for any multi-replica / SaaS operation; nothing in Bands D-E
        works without it. Current satisfaction: 1 - naive scale-out is actively broken in three ways.
        Gap: 4 - the largest, highest-uncertainty job in the epic (the update-queue itself must
        become cluster-aware; leader election is necessary-not-sufficient).

  - id: job-operator-zero-downtime-rollout
    title: Upgrade Lighthouse with no dropped requests and no data loss
    persona: platform-operator
    feature: epic-5305-k8s-readiness
    job_story: >
      When I roll out a new Lighthouse version under a Kubernetes rolling update, so old and
      new pods briefly run side by side against one shared database,
      I want each release's migrations to be additive-only (so an old pod never depends on a
      column the new release dropped) and every terminating pod to drain its in-flight HTTP
      requests, SignalR connections and queued updates before it exits,
      so I can ship updates during the working day without a maintenance window and without a
      user ever seeing a failed request or a half-written change.
    dimensions:
      functional: Expand-only (expand now / contract later) migration discipline; SIGTERM handling that stops intake and drains within terminationGracePeriodSeconds
      emotional: Move from "upgrades are a scary after-hours event" to "I merge a PR and it rolls"
      social: Deliver upgrades invisibly; no "Lighthouse will be down 22:00-23:00" email
    forces:
      push: A rolling update today kills pods mid-request (no drain) and a destructive migration can break the old pods still serving during the rollout
      pull: Zero-downtime upgrades make Lighthouse safe to update often and cheaply
      anxiety: Will a migration that drops/renames a column break the old replica before it's gone? Will an in-flight forecast write be lost when the pod dies?
      habit: Operators are used to scheduling downtime for database migrations
    opportunity_score:
      importance: 4
      current_satisfaction: 1
      gap: 3
      rationale: >
        Importance: 4 - required for credible SaaS upgrades and for safe self-hoster updates.
        Current satisfaction: 1 - no drain, no expand-contract discipline today. Gap: 3.

  - id: job-operator-trust-pod-health
    title: Let Kubernetes route to only-truly-ready pods and restart only dead ones
    persona: platform-operator
    feature: epic-5305-k8s-readiness
    job_story: >
      When Kubernetes decides whether to send traffic to a Lighthouse pod or to restart it,
      I want readiness gated on real serving capacity (DB reachable, migrations applied),
      liveness shallow enough that a slow dependency never triggers a restart, and a startup
      probe that covers a slow boot/migration window,
      so I can trust that traffic only reaches pods that can actually serve and that the
      orchestrator never restart-loops a healthy-but-slow pod.
    dimensions:
      functional: ASP.NET Core health checks driving three distinct probes (readiness DB+migrations, shallow liveness, startup)
      emotional: Move from "is this 503 the app or the probe?" to "the probes mean what they say"
      social: Show a green, trustworthy deployment status to whoever watches the cluster
    forces:
      push: Without real probes, k8s sends traffic to not-yet-ready pods (cold 500s) or restart-loops on a slow dependency
      pull: Correct probes give clean rollouts and accurate health signals
      anxiety: Will a shared liveness/readiness endpoint restart a pod that's merely waiting on the DB?
      habit: Operators expect every serious app to expose liveness/readiness/startup endpoints
    opportunity_score:
      importance: 4
      current_satisfaction: 2
      gap: 2
      rationale: >
        Importance: 4 - prerequisite for any safe rollout. Current satisfaction: 2 - story 04
        exercised probes as a spike but there is no product implementation. Gap: 2.

  - id: job-operator-correct-behind-proxy
    title: Serve correct HTTPS, cookies, OIDC and SignalR behind a reverse proxy
    persona: platform-operator
    feature: epic-5305-k8s-readiness
    job_story: >
      When I put Lighthouse behind Traefik / nginx / an Ingress that terminates TLS,
      I want the app to honour X-Forwarded-Proto / -Host / -For from the proxy I trust,
      so that HTTPS redirects, secure cookies, OIDC callback URLs and SignalR negotiation all
      use the real public scheme and host instead of the pod's internal http://hostname.
    dimensions:
      functional: UseForwardedHeaders gated on a declared set of known proxies/networks
      emotional: Move from "why does OIDC redirect to http and loop?" to "login just works behind the proxy"
      social: Hand users a clean HTTPS URL that logs in first try
    forces:
      push: Behind a proxy today, HTTPS redirects loop, OIDC callbacks come out http://, secure cookies drop
      pull: One config switch makes every reverse-proxy deployment behave correctly
      anxiety: If I trust forwarded headers, am I opening a spoofing hole from untrusted clients?
      habit: Operators are used to setting UseForwardedHeaders / trusted-proxy config on .NET apps behind a proxy
    opportunity_score:
      importance: 4
      current_satisfaction: 1
      gap: 3
      rationale: >
        Importance: 4 - blocks correct auth on ANY reverse-proxy deployment, not just k8s.
        Current satisfaction: 1 - broken behind a TLS-terminating proxy today. Gap: 3.

  - id: job-operator-observe-in-cluster
    title: See per-instance metrics, structured logs and traces in my monitoring stack
    persona: platform-operator
    feature: epic-5305-k8s-readiness
    job_story: >
      When I run Lighthouse in a cluster with Prometheus / Loki / an OTel collector,
      I want the app to expose a /metrics endpoint, emit structured JSON logs to stdout, and
      produce OpenTelemetry traces,
      so I can monitor request rates, error rates and latency, query logs by field, and trace
      a slow request — without bolting on a sidecar to scrape unstructured text.
    dimensions:
      functional: Prometheus /metrics endpoint; structured JSON logging to stdout; OpenTelemetry traces
      emotional: Move from "Lighthouse is a black box in my cluster" to "it's a first-class citizen on my dashboards"
      social: Report instance health/usage to stakeholders from the same Grafana everyone else uses
    forces:
      push: No /metrics and unstructured logs make Lighthouse invisible to Prometheus and painful in Loki
      pull: Native instrumentation drops Lighthouse straight onto existing dashboards
      anxiety: Will always-on tracing/metrics cost the single-container self-hoster performance?
      habit: Operators expect cloud-native apps to expose /metrics + JSON logs out of the box
    opportunity_score:
      importance: 3
      current_satisfaction: 2
      gap: 1
      rationale: >
        Importance: 3 - valuable for operating the SaaS, less critical for a single self-hoster.
        Current satisfaction: 2 - logging exists but unstructured; no /metrics. Gap: 1 - real but
        the smallest in the epic; off-by-default keeps the self-hoster cost at zero.

  - id: job-mcp-caller-own-identity
    title: Drive the MCP server as myself, not as a shared baked-in key
    persona: platform-operator
    feature: epic-5305-k8s-readiness
    job_story: >
      When I expose the Lighthouse MCP HTTP server so colleagues' agents can call it,
      I want each caller to authenticate with their own credential (an OAuth token, or their
      own Lighthouse API key) that the MCP server passes through,
      so that every caller drives Lighthouse as themselves with their own RBAC scope and audit
      trail — instead of every caller sharing one baked LIGHTHOUSE_API_KEY whose owner and
      scope they all silently inherit.
    dimensions:
      functional: MCP spec (2025-06-18) OAuth pass-through (preferred) or X-Api-Key pass-through (interim), reusing owner-resolved/scoped Lighthouse keys
      emotional: Move from "one shared key I must bake, seal, distribute and rotate" to "callers bring their own"
      social: Give security review a clean answer — no ambient authority, per-user audit
    forces:
      push: The mcp-http container is a confused deputy - one baked key means every caller acts as that owner/scope with no per-user audit
      pull: Per-caller identity removes the shared secret entirely; an unauth'd /mcp is no longer an open hole
      anxiety: Is adopting the MCP OAuth framework too heavy vs the interim X-Api-Key pass-through?
      habit: Operators are used to giving a service one API key and accepting the blast radius
    opportunity_score:
      importance: 4
      current_satisfaction: 1
      gap: 3
      rationale: >
        Importance: 4 - the confused deputy is a real security gap the moment the MCP server is
        exposed beyond ClusterIP. Current satisfaction: 1 - single baked key today. Gap: 3. Change
        lands mostly in the lighthouse-clients repo; version-gate the endpoint per CLAUDE.md.


  # ───────────────────────────────────────────────────────────────────────────
  # epic-5306-k8s-productization (SCOPED: stories #5199 Helm chart, #5200 docs)
  # Install / package / configure / document / publish — the NEW job space the
  # six epic-5305 RUNTIME jobs above do not cover. Distribution model LOCKED:
  # PUBLIC OSS Helm chart on a GitHub Pages repo; `helm install` for any
  # external self-hoster. Every job inherits the standalone gate (D4): the
  # single-container shape stays the default; the chart is additive.
  # ───────────────────────────────────────────────────────────────────────────

  - id: job-operator-install-whole-stack-one-command
    title: Install the whole Lighthouse stack with one command
    persona: platform-operator
    feature: epic-5306-k8s-productization
    job_story: >
      When I want to run Lighthouse on Kubernetes for my own org instead of hand-assembling raw
      manifests,
      I want to install the entire stack (API, optional MCP, Postgres, ingress) with a single
      `helm install l8e ./chart -f values-enterprise.yaml` against a published public chart,
      so I can stand up a real, production-grade Lighthouse as a unit in minutes instead of
      spending a day writing and debugging a dozen interdependent YAML files.
    dimensions:
      functional: A publishable Helm chart that renders the full stack from one command; sensible defaults; embedded single-container shape as the default (standalone gate)
      emotional: Move from "deploying this is a day of fragile YAML" to "one command and it's up"
      social: Adopt Lighthouse for my org and show a working install, not a science project
    forces:
      push: Running Lighthouse on k8s today means hand-writing Deployment + Service + Ingress + Postgres + Secrets + ConfigMaps and wiring them together, with a dozen ways to get it subtly wrong
      pull: One `helm install` brings the whole stack up healthy end to end
      anxiety: Will the chart hide so much that I can't understand or fix what it deployed? Will it force a topology I don't want?
      habit: Operators expect non-trivial k8s apps to ship a Helm chart, not a wall of raw manifests
    opportunity_score:
      importance: 5
      current_satisfaction: 1
      gap: 4
      rationale: >
        Importance: 5 - this IS the headline deliverable of #5199 and the gate for self-hosting on
        k8s at all; without it there is no productized deployment. Current satisfaction: 1 - only
        raw manifests / source clone exist today, no chart. Gap: 4 - the walking skeleton plus
        full-stack wiring is the bulk of the chart work.

  - id: job-operator-configure-via-values
    title: Configure the deployment by editing values, not templates
    persona: platform-operator
    feature: epic-5306-k8s-productization
    job_story: >
      When I install Lighthouse from the chart and need to fit it to my environment,
      I want to set the image tag, replica count, ingress hostname, OIDC config, Postgres creds,
      whether MCP is enabled, and the frontend topology (embedded|split) entirely through a
      values file,
      so I can pin a version, place it on my own hostname and wire my own identity/DB without ever
      editing a chart template or forking the chart.
    dimensions:
      functional: Parameterised chart values with safe defaults; values-enterprise.yaml as the production reference; frontend.mode toggle defaulting to embedded
      emotional: Move from "to change anything I edit raw manifests" to "I edit a documented values file"
      social: Hand a teammate a single reviewable values file that fully describes our deployment
    forces:
      push: Changing the image, hostname or auth today means editing hand-written manifests, easy to get wrong and hard to review
      pull: A documented values file makes the whole deployment a single, reviewable, version-pinnable artifact
      anxiety: If I omit a value, will the install silently misbehave instead of failing clearly?
      habit: Operators expect to configure a Helm release via values overrides, not template surgery
    opportunity_score:
      importance: 4
      current_satisfaction: 1
      gap: 3
      rationale: >
        Importance: 4 - configurability is what makes the chart usable across environments rather
        than a fixed demo. Current satisfaction: 1 - no values surface exists today. Gap: 3.

  - id: job-operator-trust-clean-first-run
    title: Trust a clean first run with clear post-install guidance
    persona: platform-operator
    feature: epic-5306-k8s-productization
    job_story: >
      When I install the chart for the first time,
      I want NOTES.txt to tell me exactly what to do next (the access URL, first steps) and a
      production-grade values-enterprise.yaml to copy from, with omitted-required-value failures
      that are loud and clear rather than half-broken releases,
      so I can trust that a fresh install lands in a known-good state and I'm never left guessing
      whether it worked or what to do next.
    dimensions:
      functional: NOTES.txt post-install guidance; values-enterprise.yaml as the canonical reference; fail-fast validation on missing required values
      emotional: Move from "did that actually work, and now what?" to "it told me the URL and the next step"
      social: Demonstrate a clean, self-explaining install to whoever I'm onboarding
    forces:
      push: A bare `kubectl apply` leaves the operator guessing whether it worked and what the URL is
      pull: Post-install NOTES + a reference values file make the first run self-explaining
      anxiety: Will a missing value half-install something broken that I then have to untangle?
      habit: Operators expect a good Helm chart to print actionable NOTES after install
    opportunity_score:
      importance: 3
      current_satisfaction: 1
      gap: 2
      rationale: >
        Importance: 3 - first-run trust is the difference between "adopted" and "abandoned mid-eval",
        though secondary to the install itself. Current satisfaction: 1 - no NOTES/reference today.
        Gap: 2.

  - id: job-operator-self-host-from-docs
    title: Self-host and evaluate Lighthouse from the docs alone
    persona: platform-operator
    feature: epic-5306-k8s-productization
    job_story: >
      When I'm deciding whether to self-host Lighthouse (or pitching it internally),
      I want published docs with an architecture diagram, a copy-paste quick-start, a full config
      reference for values-enterprise.yaml, and a runnable demo walkthrough (install -> auth ->
      MCP -> scaling),
      so I can both stand it up myself AND build the case to adopt it — without a sales call or a
      support ticket.
    dimensions:
      functional: Architecture diagram (Ingress -> oauth2-proxy -> API + MCP + Postgres); prerequisites; quick-start; full config reference; demo walkthrough; published to the LPW GitHub org
      emotional: Move from "can I actually run this, and is it real?" to "I can deploy it AND I'd pitch it"
      social: Make the case internally with a credible, demoable artifact rather than aspirational marketing
    forces:
      push: Most OSS projects' docs stop at `docker run` with no production or evaluation story
      pull: Docs good enough to self-host AND evaluate remove the need for a sales call or support ticket
      anxiety: Will the docs drift from the shipped chart so the quick-start no longer works?
      habit: Evaluators expect a serious product to have a self-serve quick-start and a real architecture story
    opportunity_score:
      importance: 4
      current_satisfaction: 1
      gap: 3
      rationale: >
        Importance: 4 - this IS #5200 and the pitch-readiness payoff; the chart is only adoptable if
        the docs make it self-serve. Current satisfaction: 1 - no enterprise self-host docs today.
        Gap: 3.

  - id: job-maintainer-publish-versioned-chart
    title: Publish and version the chart with near-zero per-release ceremony
    persona: lighthouse-maintainer
    feature: epic-5306-k8s-productization
    job_story: >
      When I finalize a release that touches the deployment,
      I want to package the chart, bump its version, and publish it (chart + README) to the
      LetPeopleWork GitHub org Helm repo as one low-ceremony, automatable step,
      so external self-hosters always see a current installable chart via `helm repo update` and I
      never face a big batched catch-up under release-day pressure.
    dimensions:
      functional: helm package + version bump + GitHub Pages Helm repo index/publish; refuse-silent-overwrite guard; README ships alongside
      emotional: Move from "publishing a public chart is a drift-prone chore I'll get wrong" to "it's a cheap default at finalization"
      social: Give external self-hosters a chart they can trust is current; uphold the project's low-ceremony-automation value
    forces:
      push: Manually packaging and publishing a chart to a public repo is exactly the chore that gets skipped or batched into an error-prone catch-up
      pull: A scripted publish step keeps the public chart current as a side effect of work already done
      anxiety: Will I silently overwrite a version or publish a README that drifts from the chart?
      habit: Maintainers default to batching deployment/doc updates to release time, accumulating drift
    opportunity_score:
      importance: 3
      current_satisfaction: 1
      gap: 2
      rationale: >
        Importance: 3 - publishing is what makes the chart externally consumable, but it is the
        plumbing behind the operator-facing jobs rather than an independent end-user ask. Current
        satisfaction: 1 - no published chart pipeline today. Gap: 2 - real but bounded; mirrors the
        already-shipped website-screenshot finalization-gate pattern.


  # ───────────────────────────────────────────────────────────────────────────
  # epic-5306-productization-platform (the SaaS-OPERATOR flavour of platform-operator)
  # The SECOND flavour the persona already names: "the LPW SaaS operator running
  # many replicas across MANY TENANTS". The epic-5305 jobs above are RUNTIME (one
  # instance behaves in a cluster); the epic-5306-k8s-productization jobs are
  # INSTALL/CONFIGURE (a self-hoster stands up ONE instance from the chart). These
  # jobs are FLEET / MULTI-TENANT: substrate → gitops → routing → secrets →
  # provisioning → upgrades → observability → backup/DR, with LPW as Tenant Zero.
  # Every job inherits the STANDALONE GATE (the single-container product stays
  # byte-unchanged) and VENDOR-NEUTRALITY (official images, OpenTofu, no cloud
  # lock-in). The platform is built ON the shipped #5199 chart (ADR-080..085), not
  # instead of it. Tenancy model is the central shared decision (named, not yet
  # finalized — see feature-delta DISCUSS decisions).
  # ───────────────────────────────────────────────────────────────────────────

  - id: job-saas-operator-provision-substrate
    title: Stand up a hosting cluster on any provider without lock-in
    persona: platform-operator
    feature: epic-5306-productization-platform
    job_story: >
      When I need a Kubernetes cluster to host Lighthouse tenants and I do not want to be
      married to one cloud vendor's console,
      I want to declare the whole substrate (cluster, node pools, ingress controller, base
      add-ons) in OpenTofu and `tofu apply` it against whichever provider I choose,
      so I can create, reproduce or tear down the platform substrate as reviewable code on
      Infomaniak Public Cloud today and a different provider tomorrow, instead of hand-clicking a console and
      pinning the platform to a single vendor's proprietary surface.
    dimensions:
      functional: OpenTofu modules producing a conformant cluster (control plane, nodes, CNI, ingress controller, storage class) parameterised per provider; one `tofu apply` stands it up, `tofu destroy` removes it
      emotional: Move from "the platform lives in a cloud console nobody dares touch" to "the substrate is code I can review, diff and rebuild"
      social: Tell prospects and security that hosting has no single-cloud lock-in — substrate is portable by construction
    forces:
      push: Hand-built clusters drift, can't be reproduced, and chain the platform to one vendor's proprietary console and managed services
      pull: One declarative `tofu apply` reproduces the whole substrate on any conformant provider; teardown is as cheap as creation
      anxiety: Will the abstraction leak so the "neutral" module is really only tested on one provider? Will provider-specific bits (load balancer, storage) bleed into the platform layer?
      habit: Operators reach for the cloud console or a provider-specific CLI for the first cluster, then never codify it
    opportunity_score:
      importance: 5
      current_satisfaction: 1
      gap: 4
      rationale: >
        Importance: 5 - the substrate is the foundation every other platform job stands on, and
        vendor-neutrality is an explicit epic constraint. Current satisfaction: 1 - no substrate-as-code
        exists; LPW's own hosting is hand-assembled. Gap: 4 - large and foundational; the substrate
        decision gates GitOps, DNS, secrets and tenancy.

  - id: job-saas-operator-declare-platform-as-code
    title: Change the platform by merging a PR, and trust drift is auto-corrected
    persona: platform-operator
    feature: epic-5306-productization-platform
    job_story: >
      When I need the platform's running state to always match what has been reviewed and
      version-controlled,
      I want every platform component and every tenant declared in a git repo that ArgoCD
      continuously reconciles against the cluster,
      so I can change the platform by merging a pull request and trust that manual drift is
      detected and corrected, instead of `kubectl apply`-ing changes by hand and never being
      sure the cluster matches the repo.
    dimensions:
      functional: ArgoCD app-of-apps reconciling platform components + tenants from a git repo; git is the source of truth; drift is detected and self-healed; a merged PR changes the cluster
      emotional: Move from "I think the cluster matches what's in git" to "the cluster IS what's in git, continuously"
      social: Give reviewers a real change-control story — every platform change is a reviewable, revertable PR
    forces:
      push: Hand-applied kubectl changes drift silently; there is no audit trail and no guarantee the live state matches the repo
      pull: GitOps makes the repo authoritative — drift self-heals, rollback is a git revert, every change is reviewed
      anxiety: Will ArgoCD fight a hotfix I genuinely need to apply live during an incident? Will the repo layout make tenants hard to reason about?
      habit: Operators are used to kubectl apply / helm upgrade by hand against the live cluster
    opportunity_score:
      importance: 4
      current_satisfaction: 1
      gap: 3
      rationale: >
        Importance: 4 - GitOps is the control-plane discipline that makes a multi-tenant platform
        operable and auditable; it carries the tenant-provisioning model. Current satisfaction: 1 -
        no GitOps today. Gap: 3.

  - id: job-saas-operator-onboard-tenant
    title: Provision a fully isolated tenant with one declarative action
    persona: platform-operator
    feature: epic-5306-productization-platform
    job_story: >
      When a new customer signs up for hosted Lighthouse,
      I want to provision their isolated instance — namespace, database, secrets, subdomain
      route and the Lighthouse app itself — with a single declarative action (one tenant entry
      committed to the GitOps repo),
      so I can onboard a customer in minutes with no hand-crafted per-tenant YAML and no risk of
      one tenant seeing another's data, instead of copy-pasting and tweaking a pile of manifests
      and hoping I isolated everything.
    dimensions:
      functional: One declarative tenant entry (ApplicationSet generator entry / tenant CR / values record) expands into a full isolated tenant — namespace, Postgres, secrets, ingress route, app workload — reconciled by ArgoCD; provisioning and de-provisioning are both one action
      emotional: Move from "onboarding a tenant is a careful manual ritual I can get wrong" to "I add one tenant record and the platform builds the rest"
      social: Offer customers same-day onboarding and a credible isolation guarantee
    forces:
      push: Per-tenant onboarding by hand is slow, error-prone, and a cross-tenant data-leak risk if isolation is missed
      pull: A single tenant declaration that fans out into a complete isolated instance makes onboarding a minutes-long, repeatable, reviewable act
      anxiety: Will the isolation actually hold (DB, secrets, network), or will a missed boundary leak one tenant into another? Will de-provisioning leave orphans?
      habit: Operators expect to write/duplicate manifests per environment; "one record provisions everything" is a new trust step
    opportunity_score:
      importance: 5
      current_satisfaction: 1
      gap: 4
      rationale: >
        Importance: 5 - automated, isolated tenant provisioning IS the productization payoff; without
        it there is no SaaS. Current satisfaction: 1 - nothing automates multi-tenant provisioning today.
        Gap: 4 - large; binds the tenancy model, routing, secrets and DB isolation into one act.

  - id: job-saas-operator-route-tenant-by-subdomain
    title: Give every tenant its own subdomain with valid TLS, automatically
    persona: platform-operator
    feature: epic-5306-productization-platform
    job_story: >
      When I provision a tenant,
      I want them reachable at their own `{tenant}.lighthouse.letpeople.work` subdomain
      automatically — wildcard DNS plus ingress routing plus a valid TLS certificate — with no
      per-tenant DNS record to create by hand,
      so a tenant gets a clean, branded, HTTPS URL the moment they are provisioned, instead of me
      editing DNS and requesting a certificate for every new customer.
    dimensions:
      functional: Wildcard DNS (`*.lighthouse.letpeople.work`) + ingress host routing per tenant + automatic TLS (wildcard or per-host cert via cert-manager); a new subdomain serves the right tenant with a trusted cert with zero manual DNS/cert steps
      emotional: Move from "every new tenant means a DNS ticket and a cert request" to "their URL just works the moment they exist"
      social: Hand each customer a branded `{them}.lighthouse.letpeople.work` URL that logs in first try
    forces:
      push: Per-tenant DNS records and certificates are manual, slow, and a step that gets forgotten — a tenant with no route or an invalid cert looks broken
      pull: Wildcard DNS + automatic TLS means routing is solved once and every future tenant inherits it for free
      anxiety: Will one tenant's host accidentally route to another's pods? Will wildcard TLS or per-host issuance hit rate limits / fail silently?
      habit: Operators are used to adding a DNS record and a cert per hostname
    opportunity_score:
      importance: 4
      current_satisfaction: 1
      gap: 3
      rationale: >
        Importance: 4 - without automatic per-tenant routing, provisioning is not actually one action.
        Current satisfaction: 1 - no wildcard/multi-tenant routing today. Gap: 3.

  - id: job-saas-operator-isolate-tenant-secrets
    title: Keep each tenant's secrets isolated and out of git, never in plaintext
    persona: platform-operator
    feature: epic-5306-productization-platform
    job_story: >
      When each tenant needs its own database credentials, OIDC client config and license, and I
      keep all platform state in a GitOps repo,
      I want those secrets generated, stored and injected per tenant from a managed secret store
      — never committed as plaintext to the repo —
      so a tenant's credentials stay isolated and rotatable and I can keep desired state in git
      without ever leaking a secret into version control, instead of choosing between "secrets in
      git" and "secrets managed outside GitOps and therefore drifting".
    dimensions:
      functional: Per-tenant secrets sourced from a managed store (External Secrets Operator + cloud/secret-manager backend, or Sealed Secrets, or Vault — decision named for DESIGN); injected into the tenant namespace; no plaintext secret in the GitOps repo; rotatable per tenant
      emotional: Move from "secrets are the awkward exception to GitOps" to "secrets flow through the platform like everything else, but stay encrypted/external"
      social: Give security review a clean answer — no plaintext secrets in git, per-tenant isolation, rotation supported
    forces:
      push: GitOps wants everything in git, but secrets must never be plaintext in a repo; the naive workaround leaks credentials or breaks the GitOps model
      pull: A managed secret store referenced from git gives both — declarative tenants AND encrypted, isolated, rotatable secrets
      anxiety: Will a tenant's secret ever be readable by another tenant or land in git history? Will rotation break a running tenant?
      habit: Operators paste secrets into a values file or a kubectl-created Secret and forget about rotation/isolation
    opportunity_score:
      importance: 5
      current_satisfaction: 1
      gap: 4
      rationale: >
        Importance: 5 - secret isolation is a hard security and compliance requirement for multi-tenant
        hosting; getting it wrong is a breach. Current satisfaction: 1 - no per-tenant managed-secret
        model today. Gap: 4 - foundational and security-critical.

  - id: job-saas-operator-upgrade-all-tenants-safely
    title: Roll a new Lighthouse version across every tenant with zero downtime
    persona: platform-operator
    feature: epic-5306-productization-platform
    job_story: >
      When a new Lighthouse version ships,
      I want to roll it out across every tenant automatically — a single version bump in git that
      ArgoCD propagates, each tenant taking it as a zero-downtime rolling update with expand-only
      migrations —
      so all tenants get the update during the working day with no dropped requests and no tenant
      stuck on a broken release, instead of upgrading each tenant by hand or scheduling a
