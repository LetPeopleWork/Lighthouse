    opportunity_score:
      importance: 3
      current_satisfaction: 1
      gap: 2
      rationale: >
        Importance: 3 — the blocked TREND is a real improvement-planning signal but lower-frequency and
        less acute than the per-item duration the coach acts on daily. Current satisfaction: 1 — no
        over-time blocked view exists today; only the current count. Gap: 2 — valuable but built almost
        entirely on the established delivery-metrics history pattern plus the new per-sync capture, so
        the marginal lift is a count snapshot and a chart.

  - id: job-flow-coach-stale-when-blocked-too-long
    title: Treat an item as stale when it has been blocked too long, not only when it sits in a state
    persona: flow-coach
    feature_context: epic-5074-blocked-items
    created: 2026-06-11
    note: >
      NEW in epic-5074-blocked-items (ADO Epic #5074); ties into Epic #4144 staleness. A DISTINCT
      staleness trigger keyed on BLOCKED DURATION, separate from the existing time-in-state staleness
      (time-in-state-and-staleness: IsStale = Doing AND now−CurrentStateEnteredAt > StalenessThresholdDays).
      A blocked item becomes Stale after a configured blocked-duration threshold
      (blockedStalenessThresholdDays, 0 = disabled, twin of StalenessThresholdDays, config-admin gated).
      The two staleness sources are OR'd but reported with DISTINCT reasons. Depends on the per-sync
      blocked capture (blockedSince). Non-premium.
    job_story: >
      When an item has been blocked for a long time but is sitting in a state that the time-in-state
      staleness signal doesn't flag (or isn't moving in a way that signal notices),
      I want it to be marked Stale because it has been BLOCKED too long — with the reason saying so —
      so a long-blocked item shows up in the same "needs a conversation" signal I already use, instead
      of slipping past because today's staleness only watches time-in-state.
    dimensions:
      functional: >
        A new blocked-duration staleness trigger: an item blocked longer than a configured
        blockedStalenessThresholdDays (per Team and Portfolio; 0 disables; config-admin gated, twin of
        StalenessThresholdDays) is flagged Stale. This is OR'd with the existing time-in-state staleness
        but reported with a DISTINCT reason ("stale: blocked 12 days" vs "stale: 11 days in Review") so
        the coach knows which trigger fired. Derives the blocked duration from the per-sync blockedSince
        capture. Non-premium.
      emotional: >
        Move from "a long-blocked item can slip past my staleness signal because that signal only watches
        time-in-state" to "blocked-too-long items show up in the same stale signal, with the reason that
        explains why". Confidence the stale signal catches blocked rot, not just slow states.
      social: >
        Be the coach whose stale list catches the right items for the right reasons — "this is stale
        because it's been blocked twelve days" reads as precise, not generic.
    forces:
      push: >
        Today staleness only fires on time-in-current-state; an item can be blocked for weeks without
        tripping it (e.g. blocked while technically in a state that keeps getting touched), so blocked rot
        escapes the one signal coaches rely on.
      pull: >
        One extra threshold reuses the staleness signal and treatment the coach already knows, adding a
        blocked-duration trigger with a clear distinct reason — no new mental model, just a second source
        of "needs a conversation".
      anxiety: >
        Will this double-count an item that's both blocked-stale and state-stale? (Mitigated: the sources
        are OR'd into a single stale state with both reasons listed, not two separate flags.)
        Will it spam if the threshold is wrong? (Mitigated: configurable per Team/Portfolio, 0 disables,
        same calibration model as time-in-state staleness.)
      habit: >
        Coaches already use the stale red treatment from time-in-state-and-staleness; a blocked-duration
        source feeds the SAME signal, so it's the same muscle memory with one more reason.
    opportunity_score:
      importance: 3
      current_satisfaction: 1
      gap: 2
      rationale: >
        Importance: 3 — closes a real gap (blocked rot escaping the time-in-state-only staleness signal)
        but is a refinement of an existing signal rather than a foundational capability. Current
        satisfaction: 1 — there is no blocked-duration staleness today; staleness watches time-in-state
        only. Gap: 2 — genuine but contained; reuses the staleness signal, treatment, and threshold model
        wholesale, adding a second trigger source keyed on the new blockedSince capture.

