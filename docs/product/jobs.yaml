  - id: job-flow-coach-see-age-as-of-selected-date
    title: See how old work was on the date I selected
    persona: flow-coach
    job_story: >
      When I review a past period in a retro and select that date range,
      I want every Work-Item-Age readout to describe how old the work was on the last day of
      that range,
      so I can talk honestly about what was happening then instead of unknowingly reading
      today's numbers under last month's heading.
    dimensions:
      functional: >
        Work Item Age becomes a function of the selected date: the population is the items in
        progress on the last day of the range (WasItemProgressOnDay) and each age is measured to
        that day, not to now. Applies to the Work Item Age Percentiles card, the Total Work Item
        Age widget, and the dot heights on the Work Item Aging chart. When the range ends today
        the numbers are unchanged — this is a correctness fix for historical ranges. Computed
        from existing started/closed dates via the same arithmetic that already backs the
        total-age-over-time chart; no new persistence. Also the enabling fix for a meaningful
        previous-period trend on the percentiles widget.
      emotional: >
        Move from "these numbers are under a date heading but I'm not sure they're about that
        date" to being able to quote a past period's WIP age without a caveat.
      social: >
        Be the coach whose retro numbers hold up when someone checks them, rather than the one
        who has to explain that the tool was showing today's ages all along.
    forces:
      push: >
        Selecting a historical range silently produces wrong answers: survivors are aged to
        today and anything that has since closed disappears from the population entirely. The
        error is invisible — nothing warns the reader — which makes it worse than a blank.
      pull: >
        The arithmetic already exists and is already trusted (GenerateTotalWorkItemAgeByDay), so
        date-honest age is a generalisation of code the product already ships, not new machinery.
      anxiety: >
        Will this change what Lighthouse writes back into Jira/ADO, or move today's numbers?
        (Mitigated by hard constraints: the WorkItemAge property that feeds write-back is not
        repointed, and an endDate-is-today regression assertion pins the live view byte-for-byte.)
      habit: >
        Practitioners already assume a date-range selector filters everything on the page; the
        product has been quietly violating that assumption for one metric family.
    opportunity_score:
      importance: 4
      current_satisfaction: 1
      gap: 3
      rationale: >
        Importance: 4 — this is a correctness defect, not a polish item: a silently wrong number
        under a date heading is worse than a missing one, and it blocks any honest
        previous-period comparison for the whole Work-Item-Age family. Current satisfaction: 1 —
        historical ranges are wrong today with no indication. Gap: 3 — the largest in this
        feature, and the one the other Work-Item-Age improvements depend on.

  - id: job-delivery-lead-trust-portfolio-blocked-history
    title: Trust a portfolio blocked number for a past range enough to compare periods
    persona: delivery-lead-rte
    feature_context: portfolio-blocked-history
    created: 2026-07-19
    note: >
      NEW in portfolio-blocked-history (ADO Story #5524). Found during the adversarial review at
      finalization of Story #5508 — not a regression from it, a gap it exposed. #5508 made the Blocked
      Overview honest on historical ranges for TEAMS by answering a past range from
      WorkItemBlockedTransition history instead of replaying today's blocked rules against today's item.
      Portfolios did not get this and cannot: no blocked/unblocked domain event is ever raised for
      Features, so there is no history for a portfolio read to consult, and FeatureDto still calls
      FeatureIsBlocked(feature) against the feature as it stands right now. Verified corrections to the
      original report: the portfolio blocked-COUNT trend already works (BlockedCountSnapshot has carried
      OwnerType/OwnerId since introduction and BlockedCountSnapshotRecordingHandler already handles
      PortfolioFeaturesRefreshed); the frontend is fully shared (PortfolioMetricsView renders the same
      BaseMetricsView as TeamMetricsView, and blockedMaxAgeRag/deriveStaleness are scope-agnostic), so
      the whole gap is backend data capture. Non-premium, consistent with all of epic-5074.
    job_story: >
      When I select a past date range on a Portfolio and read the Blocked Overview to tell leadership
      whether we are clearing blockers faster than they arrive,
      I want the number to report what was actually blocked in that window rather than today's state
      wearing last month's date,
      so I can compare this period against the last one and make a claim about direction that survives
      being questioned.
    dimensions:
      functional: >
        A historic range on a Portfolio is answered from captured Feature blocked spells, gated by the
        same isHistoricRange guard TeamMetricsController already uses (asOfDate.Date < UtcNow.Date), with
        the live rule retained as fallback for features that predate capture. Fixes the error in BOTH
        directions: a feature blocked during the range but clear today currently reads not-blocked
        (understating the count), and a feature blocked only today currently reads blocked on every
        historical range including ranges that closed before it was ever blocked (overstating it).
      emotional: >
        Move from "I know this number is probably wrong but I have nothing better" to quoting a portfolio
        blocked figure without a mental asterisk.
      social: >
        Be the lead whose blocked trend claim holds up when someone checks it — rather than the one whose
        numbers turn out to have been today's state all along.
    forces:
      push: >
        The same date range answers correctly on a Team and incorrectly on a Portfolio, with nothing
        indicating the difference. A silently wrong number under a date heading is worse than a blank,
        and it makes every period-over-period portfolio comparison meaningless — both figures are just
        "today".
      pull: >
        The mechanism is already built, shipped and proven one level down: the capture/close handler
        pair, the transition repository, the historic-read guard and the ADR-099 reconciliation guard all
        exist for teams, and FeatureStateTransition already proves the feature-keyspace variant of the
        pattern works.
      anxiety: >
        Will this move numbers people already reported on? (It will, and it should — the current numbers
        are wrong. Capture is forward-only, so pre-capture ranges fall back to the live rule with the
        same honesty caveat teams already carry; nothing is retroactively fabricated.)
      habit: >
        Practitioners already assume the date-range selector governs everything on the page, and already
        read blocked signals this way on Teams. The portfolio has been quietly violating an expectation
        the product itself established.
    opportunity_score:
      importance: 5
      current_satisfaction: 1
      gap: 4
      rationale: >
        Importance: 5 — a correctness defect that is wrong in both directions and invisible to the
        reader, on the surface leadership reads. It also gates the entire portfolio parity column: the
        blocked-Nd badge, the max-blocked-age RAG chip and blocked->stale are all downstream of the same
        missing capture, so one mechanism closes five parity gaps. Current satisfaction: 1 — portfolios
        answer historic ranges from today's state with no indication. Gap: 4 — the largest open gap in
        the blocked family, and the only one where Team and Portfolio give different answers to the same
        question.

  - id: job-flow-coach-see-predictability-trend
    title: See whether flow-metric predictability is firming up or drifting over time
    persona: flow-coach
    feature_context: epic-5427-percentiles-over-time
    created: 2026-07-22
    note: >
      Epic 5427 "Show Percentiles over Time Charts" (Community/Productboard). Cycle-time percentiles
      (`percentiles` widget), work-item-age percentiles (`workItemAgePercentiles`) and the PBC widgets are
      point-in-time today; their only "trend" is `previous-period` (a single up/down arrow in
      categoryMetadata.ts). No daily percentile/PBC persistence exists (verified: only DeliveryMetricSnapshot
      and BlockedCountSnapshot DbSets). This is the flow-metric sibling of job-forecast-delivery-trend-over-time:
      a forward-only daily snapshot (latest-write-wins per day, recorded on a metrics-refresh domain event)
      feeding dedicated over-time charts. Widget decision (D1): one combined "Percentiles Over Time" widget
      with a toggle row [WIA | CT-30 | CT-60 | CT-90]; PBC-over-time is a separate widget (see the
      delivery-lead job). Free-tier, ungated (D3).
    job_story: >
      When I run a periodic flow or ops review for my team,
      I want to see how our cycle-time and work-item-age percentiles (50/70/85/95) have moved day by day over
      the last N days — not just today's four numbers,
      so I can tell whether our predictability is firming up or drifting, and show that trend rather than
      assert it from memory.
    dimensions:
      functional: >
        A combined "Percentiles Over Time" widget in the Predictability category (team and portfolio) plots
        50/70/85/95 as dated lines using the existing red->green percentile ramp. A toggle switches between
        Work Item Age and Cycle Time at 30/60/90-day lookback horizons; each day's value is read from a
        persisted daily snapshot (as-of-that-day), not recomputed live for history. Forward-only: on a fresh
        team the chart reads "builds forward from today — no snapshots recorded yet" rather than a broken axis.
        The dashboard date pickers scope the chart to the period under review (slice-03b, D9): only the days
        recorded inside the selected range are plotted, inclusive at both ends, so a flow review can ask
        "what did the trend look like last sprint?" instead of only "over all of recorded history". A range
        with nothing recorded inside it reads "no data recorded in the selected range" (D10), which is a
        different and honest statement from the forward-only copy.
      emotional: >
        Move from eyeballing four numbers and trusting a hunch that "things feel tighter lately" to reading
        the shape of the trend — confidence that a process change actually moved the percentiles, grounded in
        the line rather than in memory.
      social: >
        Be the coach who opens the review with "here's how our cycle-time spread has tightened over six weeks"
        instead of "I think we've improved" — a trend leadership and the team can see and act on.
    forces:
      push: >
        Today the widgets show only the current window; to answer "are we getting more predictable?" the coach
        screenshots the numbers week over week or rebuilds a spreadsheet, losing the in-tool advantage.
        Second push, found by user review of the shipped widget on 2026-07-26: the date pickers sat above the
        over-time charts and did nothing to them, so the coach could not scope the trend to the period being
        reviewed and the widget silently contradicted every sibling widget on the same dashboard.
      pull: >
        Open the widget, toggle WIA or a CT horizon, read the trend off dated lines that are already coloured
        the way the point-in-time percentiles are — no export, no spreadsheet.
      anxiety: >
        Will the chart look broken when it's empty just because recording just started? (Mitigated: forward-only
        empty state is explicit and honest, same contract as the delivery-metrics forecast trend.)
        Will switching horizons trigger a slow recompute of history? (No: each horizon is a pre-persisted
        series; the toggle just re-plots.)
      habit: >
        Coaches read today's percentiles and judge trend from memory or a side spreadsheet; the widget asks
        them to read trend in-tool. Eased because the chart reuses the percentile colours and lookback horizons
        they already know from the Aging chart's WIA<->CT toggle.
    opportunity_score:
      importance: 4
      current_satisfaction: 1
      gap: 3
      rationale: >
        Importance: 4 — "are we getting more predictable?" is a recurring, high-value flow-review question and
        the spine of this epic. Current satisfaction: 1 — the metrics are snapshot-only; trend means manual
        screenshotting or a spreadsheet. Gap: 3 — a genuine missing capability, kept tractable because the
        per-day computation already exists and only a forward-only snapshot + chart is new (reuses the proven
        DeliveryMetricSnapshot pattern).

  - id: job-delivery-lead-see-process-stability-trend
    title: See whether a metric's process behaviour limits are shifting over time
    persona: delivery-lead-rte
    feature_context: epic-5427-percentiles-over-time
    created: 2026-07-22
    note: >
      Epic 5427, PBC branch. The Predictability category already has point-in-time PBC widgets
      (throughputPbc, arrivalsPbc, wipPbc, totalWorkItemAgePbc, cycleTimePbc, featureSizePbc) each showing one
      current set of natural process limits (UNPL/Average/LNPL) via ProcessBehaviourChart. This job is the
      over-time view of those limits: a separate "PBC Over Time" widget (D1) with a metric-type toggle, fed by
      the same forward-only daily-snapshot pipeline as the percentile job. Shipped after the percentile slices
      (Throughput first, then the remaining types). Feature Size stays portfolio-only (D8). Free-tier (D3).
    job_story: >
      When I review a team's or portfolio's process health,
      I want to see how a metric's PBC natural process limits (UNPL, Average, LNPL) have moved day by day,
      so I can tell a genuine process shift over time from a single out-of-limit point, and pick which
      behaviour's limits are actually drifting.
    dimensions:
      functional: >
        A separate "PBC Over Time" widget in the Predictability category plots UNPL/Average/LNPL as three dated
        lines from a persisted daily NPL snapshot, with a metric-type toggle across Throughput, WIA, WIP,
        Cycle Time, Arrivals and (portfolio-only) Feature Size. Styling matches the point-in-time PBC widgets;
        forward-only empty state per D6. The dashboard date pickers scope the chart to the review period
        (slice-03b, D9): only the days recorded inside the selected range are plotted, inclusive at both
        ends. A range with nothing recorded inside it says so ("no data recorded in the selected range",
        D10) rather than reusing the forward-only copy.
      emotional: >
        Move from reacting to whichever PBC happens to show a special-cause point today toward reading whether
        the limits themselves have shifted — calmer, systemic judgement instead of point-in-time alarm.
      social: >
        Be the delivery lead who says "the throughput limits have genuinely widened since the reorg" with the
        limit-history line to back it, rather than debating whether last week's point was noise.
    forces:
      push: >
        The point-in-time PBC shows one set of limits; to see when the limits moved, the lead compares
        screenshots across reviews or trusts recollection.
      pull: >
        Open "PBC Over Time", toggle the metric, read limit movement off three dated lines — the shift is
        visible, not remembered.
      anxiety: >
        Will flat limit lines look like a bug? (No — stable limits SHOULD be flat; that is the honest reading
        of a stable process.)
      habit: >
        Leads read a single PBC and infer stability from the current chart; the over-time widget asks them to
        read limit movement directly. Eased by reusing the existing PBC visual language.
    opportunity_score:
      importance: 3
      current_satisfaction: 1
      gap: 2
      rationale: >
        Importance: 3 — process-limit drift is a real systemic-review question but lower-frequency and more
        specialist than the coach's percentile-trend spine. Current satisfaction: 1 — no over-time NPL view
        exists. Gap: 2 — valuable and served entirely by reusing the percentile job's snapshot pipeline on a
        second widget, hence a smaller build than the lead job.

  - id: job-forecast-multi-team-joint-probability
    title: Trust a multi-team feature's date to account for every team that must finish
    persona: delivery-forecaster
    feature_context: epic-5459-multi-team-forecasts
    created: 2026-07-27
    note: >
      ADO #5459 "Multi Team Forecasts", raised from the community. Lighthouse currently reports a
      multi-team feature's forecast as the SLOWEST single team's distribution
      (`AggregatedWhenForecast` picks `MaxBy(f => f.GetProbability(85))` and copies that team's whole
      histogram). A feature is done only when ALL contributing teams are done, so the honest figure
      is the joint probability across teams, which is strictly lower. Two teams at 85% each land near
      72% jointly; the gap widens with team count. A second, unreported defect rides along: because
      the "worst" team is chosen at p85 only and team distributions cross, the reported p50/p70/p95
      can be read off a team that is not the worst at that percentile.
    job_story: >
      When I forecast a feature that several teams must each finish before it is done,
      I want the date and likelihood to reflect the chance that ALL of those teams are finished —
      not the chance that the single slowest one is —
      so the date I commit to in front of leadership is not optimistic by construction, and I find
      out about the risk from the tool rather than from missing the date.
    dimensions:
      functional: >
        For a feature with two or more contributing teams, every percentile (50/70/85/95) and the
        target-date likelihood are computed from the joint completion distribution — the product of
        the contributing teams' completion CDFs — instead of being copied from one selected team.
        Single-team features are unchanged. When a contributing team cannot be forecast at all, the
        feature reports no date and no likelihood rather than a number built on the teams that could
        be forecast.
      emotional: >
        Move from suspicion ("three teams, one 85% number — that cannot be right, and I cannot show
        my working") to trust ("the number moved out because the maths says it should, and I can
        explain exactly why to anyone who asks").
      social: >
        Be the forecaster whose multi-team dates hold up — and who is never the person who presented
        an 85% that was really a 60% because the tool ignored two of the three teams.
    forces:
      push: >
        Multi-team features are the normal case in the portfolios Lighthouse is built for, and their
        forecasts are systematically optimistic today. The bias is invisible: nothing on screen hints
        that the other teams' probabilities were discarded, so there is no workaround a user could
        even construct — they would have to re-run the maths by hand from per-team dates.
      pull: >
        One change at one seam makes every multi-team forecast surface honest at once: portfolio
        feature columns, delivery likelihood, per-feature likelihood, MCP/CLI output. Nothing new to
        configure, nothing new to learn.
      anxiety: >
        Dates will move OUT, and a recorded delivery trend will show a one-time step at the release
        boundary — a forecaster mid-commitment may read that as the delivery getting worse rather
        than the tool getting honest. Mitigated by documenting the step in release notes and the
        forecasting concept page. Second anxiety: forecasting is the core of the product, so a maths
        error here is a trust-ending bug — mitigated by a numeric spike that quantifies the change on
        real portfolio data BEFORE any production code, and a diff review before commit.
      habit: >
        Forecasters are used to reading a multi-team feature's date as if it were a single team's.
        The new number is more conservative and needs no new ritual, but the first release will
        prompt "why did my dates move?" — the concept-page explanation is what converts that from
        alarm to trust.
    opportunity_score:
      importance: 5
      current_satisfaction: 1
      gap: 4
      rationale: >
        Importance: 5 — forecasting is THE core functionality, multi-team features are the primary
        use case for portfolio tracking, and the defect biases the answer in the dangerous direction
        (too optimistic) on the surface leadership anchors on. Current satisfaction: 1 — the
        behaviour is wrong today with no user-side workaround and no on-screen signal that anything
        was discarded. Gap: 4 — the highest-value correction available in the forecasting domain,
        and it is served by one well-isolated seam (`AggregatedWhenForecast`) with no change to the
        Monte Carlo itself.

  - id: job-snow-admin-connect-servicenow
    title: Connect Lighthouse to ServiceNow with the rights I am actually granted
    persona: config-admin
    feature_context: epic-5513-servicenow-integration
    created: 2026-07-27
    note: >
      ADO #5513 "ServiceNow Integration". Lighthouse ships four work-tracking connectors today
      (AzureDevOps, Jira, Linear, Csv) behind one `IWorkTrackingConnector` port; ServiceNow is absent,
      so a SNOW shop cannot start at all. The distinguishing constraint versus the other connectors is
      RIGHTS: ServiceNow instances are administered by a central platform team, and the person
      configuring Lighthouse is typically NOT that team. Whatever role set the integration needs must
      therefore be minimal, documented, and proved sufficient with a restricted account (D11) — the
      maintainer's own limited access to the customer's on-prem instance is the proving ground, not
      an obstacle.
    job_story: >
      When my team's work lives in ServiceNow and I have only the rights my platform team will grant me,
      I want to point Lighthouse at my instance and be told plainly whether the credential actually works,
      so I can start without escalating for admin rights or guessing why a sync came back empty.
    dimensions:
      functional: >
        Select ServiceNow in the connection wizard, supply an instance base URL and one credential,
        and get a validation verdict that distinguishes an unreachable host from a bad credential from
        a reachable instance where the account simply lacks read access to the configured table.
      emotional: >
        Move from resignation ("ServiceNow is never in the list; this tool is not for us") through
        caution ("will the read-only account I was given be enough?") to confidence ("validated green
        with what I already have, and I know exactly what it can do").
      social: >
        Ask the platform team for the smallest thing that works, with a named role list — rather than
        asking for admin and being refused, or being the person who over-granted.
    forces:
      push: >
        ServiceNow shops are excluded from Lighthouse outright today. There is no workaround short of
        exporting to CSV by hand, and the CSV connector loses the live refresh that makes the product
        useful.
      pull: >
        The connector port, the encrypted connection-option storage and the schema-driven connection
        form all already exist and have been exercised four times — so a fifth system is configuration
        plus one adapter, not a new subsystem.
      anxiety: >
        That the only credential which validates requires an elevated role the platform team will
        refuse — which would make the integration technically working and practically unadoptable.
        Residual second anxiety: ServiceNow has been restricting inbound Basic Authentication in
        favour of OAuth 2.0 client credentials. This does NOT block v1 — basic auth was verified
        working on the target on-prem instance — but a prospect whose instance already restricts it
        will hit a wall, so the docs must say plainly that v1 is basic auth.
      habit: >
        Admins of other tools expect a PAT or API key pasted into a form, and ServiceNow basic auth
        matches that habit closely. The friction sits in the OTHER direction: the "more secure"
        OAuth path needs an instance-side application-registry entry made by someone the Lighthouse
        user usually is not — which is precisely why it is the successor, not the v1 choice.
    opportunity_score:
      importance: 5
      current_satisfaction: 0
      gap: 5
      rationale: >
        Importance: 5 — it is the gate. Nothing else in this epic is reachable until a connection
        validates, and no ServiceNow user can use Lighthouse at all today. Current satisfaction: 0 —
        not partially served, entirely absent; ServiceNow is not an option in the product.
        Gap: 5 — the largest available, though note the gap measures the ABSENCE, not the proven
        demand: whether this market is real is precisely what
        [[job-maintainer-learn-servicenow-viability]] exists to find out.

  - id: job-snow-flow-coach-see-flow-metrics
    title: Get the same flow metrics on ServiceNow work that every other team gets
    persona: flow-coach
    feature_context: epic-5513-servicenow-integration
    created: 2026-07-27
    note: >
      ADO #5513. Once a connection validates, a Team pointed at a ServiceNow query must produce
      throughput, cycle time and forecasts through the EXISTING metric pipeline — the connector's job
      ends at producing work items. Two ServiceNow-specific unknowns bound this job and are deferred
      to a mandatory SPIKE. D4 settled the first one: ITSM (task/incident/change_request/sc_task) is
      the DEFAULT and the optimisation target — Agile Development 2.0 (rm_epic/rm_story) is a plugin
      that is not installed by default, so optimising for it would target tables most prospects do
      not use. The table stays CONFIGURABLE so an Agile 2.0 shop is not locked out. Still open:
      whether a defensible "started" timestamp exists on `task` at all (opened_at / work_start /
      sys_created_on are candidates), without which cycle time depends on transition history and the
      slice order INVERTS. Transition history is declared UNSUPPORTED in v1 (D6) with an honest
      per-widget downgrade, following the Linear `DowngradeHistorySupport()` precedent.
    job_story: >
      When my team's work is ServiceNow records rather than Jira issues,
      I want the same cycle time, throughput, age and forecast Lighthouse gives every other team,
      so my organisation's tool choice stops deciding whether I am allowed to measure flow.
    dimensions:
      functional: >
        Point a Team at a ServiceNow table and a user-authored query, map its states to Doing/Done in
        the existing settings UI, and get Throughput, Cycle Time and the how-many/when forecasts from
        synced items — with pagination honoured so a large query is not silently truncated.
      emotional: >
        Move from exclusion ("every flow tool assumes Jira, so we go without") to inclusion ("we
        forecast from our own history, not from a guess") — and, where a capability genuinely is not
        there, from suspicion to trust because the tool says so instead of showing a blank chart.
      social: >
        Bring the same evidence to a review that the Jira teams bring, instead of a hand-built
        spreadsheet that invites arguments about the data rather than about the work.
    forces:
      push: >
        ServiceNow teams currently export to a spreadsheet or go without flow metrics entirely. The
        spreadsheet goes stale the day it is built and nobody trusts it.
      pull: >
        The metric and forecast pipeline is entirely system-agnostic — it consumes Lighthouse work
        items. Producing those items is the whole job; every chart downstream comes free.
      anxiety: >
        That the numbers will be quietly wrong rather than visibly missing — a query that silently
        truncates at a page boundary, or a cycle time computed from a "started" date that is really
        a last-updated timestamp. A wrong number is worse than an absent one, because it is acted on.
      habit: >
        Coaches are used to reading a state name and knowing what it means. ServiceNow states are
        commonly numeric choice values with separate display labels, so the mapping step needs to
        show the label the coach recognises, not the integer the API returns.
    opportunity_score:
      importance: 5
      current_satisfaction: 0
      gap: 5
      rationale: >
        Importance: 5 — this is the value the epic exists to deliver; connecting (
        [[job-snow-admin-connect-servicenow]]) is only the gate in front of it, and the epic body
        explicitly sanctions shipping team-scope alone if nothing else is reachable. Current
        satisfaction: 0 — no ServiceNow data reaches Lighthouse at all. Gap: 5, with the same caveat
        as the connect job: it measures absence, not demonstrated demand.

  - id: job-snow-coach-recognise-and-reach-the-record
    title: Recognise what a ServiceNow item is, and open the record behind it
    persona: flow-coach
    feature_context: servicenow-pre-close-bucket
    created: 2026-08-01
    note: >
      ADO #5612, the epic's pre-close bucket. Sits BEHIND [[job-snow-flow-coach-see-flow-metrics]]
      rather than refining it: that job is delivered and the numbers are right, but its output is not
      yet actionable. A ServiceNow row is the only one of five connectors whose id is inert
      (`WorkItemBase.Url` is left unset — every other connector populates it, and
      `WorkItemsDialog.tsx:142-144` already renders it as a link), and its type reads as the raw
      column value `change_request` rather than the label ServiceNow itself shows. Both fixes are free
      of extra requests: `sys_id` is already carried (#5577 needed it for the metric_instance batch)
      and `sys_class_name` already arrives as {display_value, value} on every row (5611 SPIKE).
      SETTLED AT DESIGN (ADR-128): the connector owns a hardcoded BIDIRECTIONAL class<->label map and
      applies it at its own boundary — class->label when mapping a record, label->class when building
      the query, and normalisation to the label form when a team is saved. `Type` therefore CARRIES
      THE LABEL and nothing outside the connector knows a mapping happened: no new field, no DTO
      change, no EF migration, no frontend change. An unknown class passes through unchanged in both
      directions, which keeps config and data consistent rather than merely unimproved. No runtime
      lookup: the only class->label table (`sys_db_object`) is measured unreadable below `itil` and
      5611's verdict is verbatim "Do not build on sys_db_object" — an argument for having no lookup at
      all, the same exit 5611 took for hierarchy knowledge (ADR-116 D4). `sys_class_name.display_value`
      is free and deliberately IGNORED: reading it would give an unknown class a pretty label while
      its config entry kept the class name, and `GetCreatedItemsForTeam` compares the two.
      An earlier DISCUSS draft required a separate carried field on the grounds that changing `Type`
      breaks that comparison — true only if `Type` changes while the config vocabulary does not.
    job_story: >
      When Lighthouse shows me a ServiceNow item that looks wrong,
      I want to recognise what kind of work it is and open the actual record,
      so I can find out why instead of transcribing an id into a ServiceNow search box.
    dimensions:
      functional: >
        Click an item's id in the Work Items dialog and land on the record in ServiceNow; read its
        type as "Change Request" or "Catalog Task"; and name the kinds of work a team tracks using
        those same labels rather than the underlying class names.
      emotional: >
        Move from friction ("answering this question costs more than the question is worth, so I will
        let it go") to fluency — the chart and the system of record are one surface, and the words on
        both match.
      social: >
        Bring an aging item to a stand-up and open it in front of the team, rather than reading out an
        id and waiting while somebody searches for it.
    forces:
      push: >
        An aging or blocked item raises a question Lighthouse cannot answer — only the record can. The
        round trip today is manual transcription, so the question is often abandoned instead.
      pull: >
        The affordance already exists and is proven on four connectors: the link component, the DTO
        field and the model field all ship. ServiceNow is the only one not participating.
      anxiety: >
        That making the type read nicely quietly breaks something that matches on it. Justified —
        `GetCreatedItemsForTeam` filters synced items on `item.Type.ToLowerInvariant()` against the
        team's configured work-item types, so a naive substitution returns an empty run chart with no
        error. This is why the label is a separate field and why an explicit test guards it.
      habit: >
        Coaches read type names as English ("Bug", "User Story") because every other connector supplies
        them that way. A snake_case column value reads as a leaked implementation detail, and worse,
        teaches the coach that Lighthouse expects them to speak the platform's vocabulary.
    opportunity_score:
      importance: 3
      current_satisfaction: 1
      gap: 2
      rationale: >
        Importance: 3 — nothing is wrong or missing, so this cannot block adoption the way
        [[job-snow-admin-connect-servicenow]] can. It is what separates a connector that works from
        one that feels finished, which is the stated purpose of the pre-close bucket. Current
        satisfaction: 1 rather than 0 — the data is all present and correct, it is only unreachable
        and mis-labelled. Gap: 2, the smallest in the epic, and deliberately so: this job is scheduled
        at the end because it is the least urgent, not because it is the least clear.

  - id: job-snow-delivery-lead-portfolio-over-servicenow
    title: Forecast a delivery over ServiceNow parent records, not just one team's throughput
    persona: delivery-lead-rte
    feature_context: epic-5513-servicenow-integration
    created: 2026-07-27
    note: >
      ADO #5513 — CONDITIONAL job (D7). The epic body already sanctions the fallback: "is there
      something like a hierarchy to model Portfolios? If not, we may start with team only". A
      mandatory SPIKE (Q5) decides whether this job is served or CANCELLED; if cancelled, the docs
      must state the team-only limitation prominently so a prospect learns the limit before installing
      rather than after. Recorded here rather than omitted because a cancelled job with a recorded
      reason is evidence for the viability verdict, whereas a silently dropped one is lost learning.
    job_story: >
      When my ServiceNow work rolls up to a parent record,
      I want a Lighthouse Portfolio over those parents,
      so I can forecast a delivery date and see which feature is at risk — instead of reading one
      team's throughput and doing the roll-up in my head.
    dimensions:
      functional: >
        Create a Portfolio on a ServiceNow connection with a parent query; parent records become
        Lighthouse features, children resolve to their parent, and each feature reports remaining and
        total work with a forecasted completion date from contributing teams' throughput.
      emotional: >
        Move from ambition ("can we forecast the delivery, not just the team?") to either grounded
        confidence or — equally valuable — a clearly stated, early "no", rather than a vague
        "coming soon" that quietly never arrives.
      social: >
        Answer "when will this be done?" in front of leadership with a distribution rather than a
        date pulled from a status column.
    forces:
      push: >
        Portfolio forecasting is Lighthouse's headline capability. A ServiceNow integration that stops
        at team scope reaches the flow coach but never the delivery lead, which halves the market the
        epic is testing.
      pull: >
        `GetFeaturesForProject` / `GetParentFeaturesDetails` are existing port methods with a close
        analogue in Linear's project→initiative rollup — an unfamiliar hierarchy mapped onto Lighthouse
        features has been done once already.
      anxiety: >
        That a hierarchy exists on paper but is not populated by real customers, or that resolving
        children costs one API call per feature — viable at ten features, not at two hundred. The
        SPIKE measures that cost rather than assuming it.
      habit: >
        Delivery leads think in epics and features. If ServiceNow's rollup concept is a Demand or a
        Project rather than an Epic, the vocabulary in the settings UI has to meet them where they are.
    opportunity_score:
      importance: 4
      current_satisfaction: 0
      gap: 4
      rationale: >
        Importance: 4 rather than 5 — the epic explicitly permits shipping without it, so it is not a
        gate on the epic's minimum value, but it IS the gate on Lighthouse's headline capability
        reaching this market. Current satisfaction: 0. Gap: 4, and unusually uncertain: the gap may
        turn out to be unclosable, and that finding is itself a deliverable of
        [[job-maintainer-learn-servicenow-viability]].

  - id: job-maintainer-learn-servicenow-viability
    title: Decide with evidence whether ServiceNow is a market worth building for
    persona: lighthouse-maintainer
    feature_context: epic-5513-servicenow-integration
    created: 2026-07-27
    note: >
      ADO #5513's STATED expected outcome, recorded as a maintainer job rather than dressed up as a
      user feature. The epic body: "Expected outcome: We know more about the viability of SNOW
      integration, and will get feedback from potential customers what works and what's missing (and
      if it's useful at all)." The hypothesis under test — "at least potential customers use Service
      Now; this is a huge untapped market right now" — is explicitly a hypothesis. Validation runs
      against a real customer's ON-PREM instance under a restricted account, which the maintainer does
      not administer and where building Lighthouse is cumbersome; hence the deliverable is a
      standalone, build-free validation script rather than a full deployment (D10).
    job_story: >
      When I am deciding whether ServiceNow is a market worth building for,
      I want a real integration in front of real ServiceNow users and their feedback in my hands,
      so I invest based on evidence rather than on a hypothesis about an untapped market.
    dimensions:
      functional: >
        Run a repeatable, build-free validation script against an instance I do not administer, under
        a restricted account; record pass/fail per capability and every cloud-vs-on-prem divergence;
        collect structured feedback from at least three ServiceNow users or prospects; record a
        go / narrow / stop recommendation on the work item.
      emotional: >
        Move from speculation ("that is all the market thesis is") through exposure ("it works on my
        own developer instance; the real test is one I do not control") to a decision I can defend —
        including the decision to stop.
      social: >
        Be the maintainer who narrows or stops on evidence, rather than the one who ships a connector
        nobody asked for because it was already half-built.
    forces:
      push: >
        Connector work is open-ended: each new system carries permanent maintenance cost, and there
        are always more systems. Without a verdict the epic has no natural end and quietly becomes
        a parity project.
      pull: >
        A thin, honest integration is a far cheaper instrument for measuring demand than a survey —
        prospects react to something they can connect, not to a roadmap item.
      anxiety: >
        That "it basically works" becomes the verdict by default and the epic drifts into parity work
        without anyone deciding to fund it. Mitigated by making the recommendation an acceptance
        criterion with a 30-day window, not a follow-up.
      habit: >
        The reflex after shipping a connector is to start closing capability gaps. This epic
        deliberately ends at a recommendation instead — a "narrow" or "stop" verdict is a SUCCESSFUL
        outcome, because the epic buys knowledge; only an unrecorded verdict is a failure.
    opportunity_score:
      importance: 5
      current_satisfaction: 1
      gap: 4
      rationale: >
        Importance: 5 — this is the epic's stated outcome, and it governs whether every other job here
        gets a successor. Current satisfaction: 1 rather than 0 — the maintainer has anecdotal signal
        ("at least potential customers use Service Now") plus one named on-prem customer, which is
        more than nothing but is not evidence. Gap: 4 — closed by putting a working integration in
        front of real users, which no amount of desk research substitutes for. Note the self-hosted
        telemetry gap (#5015) means adoption cannot be measured remotely; this verdict must be
        collected by hand.

  - id: job-delivery-likelihood-covers-every-feature
    title: Read a delivery's likelihood as the chance that ALL its features land
    persona: delivery-forecaster
    feature_context: delivery-joint-likelihood
    created: 2026-07-28
    note: >
      ADO #5587, child of Epic #5459. Epic 5459 fixed the FEATURE rollup (worst-team copy → product of
      the contributing teams' CDFs, ADR-110). The DELIVERY rollup still selects a single representative:
      `Delivery.CalculateMetrics` calls `GetGoverningFeature`, picks one feature, and reports that
      feature's likelihood AND its 70/85/95 percentile dates as the delivery's — treating every other
      feature as a certainty. Two features each 85% land near 72% jointly. A THIRD instance of the same
      defect sits one file over: `DeliveryWithLikelihoodDto.GetLeastLikelyFeature` no longer drives the
      likelihood (ADR-112 D8) but still drives `HasSufficientData`, so the delivery's "not enough data"
      warning is also read off one representative feature.
      The correct decomposition is over (team, feature) ROWS, not over features:
      `ForecastService.RunMonteCarloSimulation` groups trials by team, so intra-team rows share
      throughput draws and contend via the random FeatureWIP allocation (positively correlated → the
      elementwise MIN of that team's rows' CDFs is the honest proxy), while cross-team trial streams are
      independent by construction (→ product, as ADR-110 already does). Multiplying FEATURE CDFs is
      wrong and double-penalises same-team features. Read-side only; no schema change.
      Invariant: delivery ≤ every breakdown row, with EQUALITY POSSIBLE — which is why the UI copy may
      not promise "always lower".
    job_story: >
      When I read a delivery's likelihood and its per-feature breakdown before committing to a date,
      I want the headline number to be the chance that ALL of its features land by the date — not the
      chance that the single governing one does —
      so the number I commit to in front of leadership is not optimistic by construction, and so the
      difference between the header and the rows is something I can explain rather than something I
      have to explain away.
    dimensions:
      functional: >
        The delivery's likelihood and its 70/85/95 completion dates are computed from the joint
        distribution over every contributing (team, feature) row — elementwise min within a team's
        bucket, product across buckets — instead of being copied from one selected feature. The
        breakdown rows stay marginal ("this one on its own"), and the header says so for both: it
        reads "All {features} by {date}: NN%" while the breakdown column stays a plain "Likelihood".
        The "not enough data" signal becomes an AND across the
        contributing features, exempting those with no remaining work. A delivery containing a feature
        that cannot be forecast is unchanged — it still reports "cannot forecast" and names the teams
        (ADR-112 D8).
      emotional: >
        Move from a quiet inconsistency the forecaster cannot explain ("the delivery says 85% and so
        does the top feature — are the other four free?") to a number that states its own meaning
        ("it says ALL features; of course it is the lower one — and when it matches a row, I can see
        which single feature is carrying the delivery").
      social: >
        Be the forecaster who is never asked "why is your delivery number the same as your worst
        feature?" without an answer — and who is never the person who presented an 85% that was really
        a 72% because the tool treated four of five features as certainties.
    forces:
      push: >
        Delivery likelihood is the most leadership-facing number Lighthouse produces, and it is
        systematically optimistic today. The bias is invisible: nothing on screen hints that the other
        features' probabilities were discarded, so there is no workaround short of redoing the maths by
        hand from the per-team rows. The percentile chips carry the same defect and nobody has noticed,
        because the badge is what gets screenshotted.
      pull: >
        One read-side change at one seam (`Delivery.CalculateMetrics`) makes the badge AND the 70/85/95
        chips honest at once, with no schema change, no new endpoint and no client release. Nothing new
        to configure, nothing new to learn.
      anxiety: >
        The number drops and the dates move OUT at the release boundary, and the recorded
        DeliveryMetricSnapshot trend shows a one-time step that cannot be backfilled (forward-only,
        ADR-048/049). A forecaster mid-commitment may read all three as the delivery getting worse
        rather than the tool getting honest. Mitigated by relabelling both surfaces so the number states
        its own meaning, and by release notes plus a delivery-level worked example in the forecasting
        concept page — exactly as ADR-110 D5 handled Epic 5459's own step. Second anxiety: forecasting
        is the core of the product, so a grain error here is a trust-ending bug — mitigated by a single
        fixture (one shared feature plus one owned feature) that yields three DISTINCT values for the
        correct maths and the two plausible wrong ones.
      habit: >
        Forecasters read a delivery percentage as if it were one feature's, and their mental model has
        no slot for "and the others each have to land too". The new number needs no new ritual, but the
        first release will prompt "why is my delivery lower than every row?" — the relabelled chip is
        what converts that from alarm to comprehension at a glance, and the concept page is what lets
        them reproduce it by hand.
    opportunity_score:
      importance: 5
      current_satisfaction: 1
      gap: 4
      rationale: >
        Importance: 5 — the delivery badge is the single most leadership-facing forecast surface in the
        product, the defect biases it in the dangerous direction (too optimistic), and it silently
        carries the percentile dates with it. Current satisfaction: 1 — the behaviour is wrong today
        with no user-side workaround and no on-screen signal that anything was discarded; the row-vs-
        header mismatch is actively confusing. Gap: 4 — the highest-value correction left in the
        forecasting domain after Epic 5459, served by one read-side seam with no schema change, no new
        endpoint and no clients release. Kept below the "unclosable" tier only because the intra-team
        correlation is approximated (comonotonic min) rather than simulated exactly.

  - id: job-price-cutover-unattended
    title: Change the list price on a calendar date without being awake for it
    persona: lighthouse-maintainer
    feature_context: pricing-adjustment-2026-08
    job_story: >
      When our list price changes on a calendar date, I want the website and the Stripe checkout to
      switch by themselves at that exact moment, so I can ship the change the day before in daylight
      and not perform a manual cutover at midnight.
    dimensions:
      functional: >
        Move Self-Service from CHF 999 to CHF 2,000/year across nine price statements in six files plus
        one hardcoded Stripe price id, with the change deployed on 2026-07-31 and taking effect at
        2026-07-31T22:00:00Z (Swiss midnight) with no deploy at that instant.
      emotional: >
        Stop treating a price change as an event to be staffed. Ship it, verify the future by faking the
        clock, and go to bed knowing the site changes itself.
      social: >
        Be the maintainer whose price rise nobody had to coordinate — no "are we live yet?" thread, no
        window where the site and the invoice disagreed.
    forces:
      push: >
        Every price on letpeople.work is a hardcoded literal — CHF 999 appears in the tier card, the
        checkout block, the pre-launch banner, the comparison table, llms.txt and the crawler noscript
        block, and the Stripe price id is inlined in create-payment. There is no cutover mechanism at
        all: today, a price change on a date means editing all of it and deploying at the moment the
        date turns.
      pull: >
        One pinned instant in one module drives every surface and the server-side Stripe decision. Ship
        on the 31st, flip at midnight, delete the gate on the 1st. Future price changes become a
        one-constant edit.
      anxiety: >
        The instant lives in TWO places that cannot share a module — src/lib/pricing.ts and the Supabase
        edge function — so a drift silently makes the page and the checkout disagree. Mitigated by a
        test asserting the two constants are byte-identical. Second anxiety: three static surfaces
        (llms.txt, /compare/, the root noscript block) genuinely cannot auto-flip, so the "it flips
        itself" promise is partial and needs an explicit next-day cleanup slice rather than a claim
        that everything is automatic.
      habit: >
        The reflex is to edit-and-deploy at the moment of the change. The new ritual — deploy early,
        verify by faking the clock, let the constant fire — only feels safe after the first time it
        works, which is why the fake-clock run before the deploy is the sign-off, not a nicety.
    opportunity_score:
      importance: 4
      current_satisfaction: 1
      gap: 3
      rationale: >
        Importance: 4 — a price change is infrequent but it is public, dated, and already
        pre-announced on the live site, so getting the moment wrong is visible to prospects. Not 5:
        it moves no product capability. Current satisfaction: 1 — no cutover mechanism exists in any
        form. Gap: 3 — closed by one module and one server-side resolver, with the residual being three
        static files that need a human next-day pass.

  - id: job-price-shown-is-price-charged
    title: Trust that the price on the page is the price on the invoice
    persona: forecasting-prospect
    feature_context: pricing-adjustment-2026-08
    job_story: >
      When I decide to buy Lighthouse, I want the price on the pricing page to be the amount Stripe
      actually charges me, so I can put a defensible number in a budget request without fearing a
      surprise at checkout.
    dimensions:
      functional: >
        The visible tier card, the checkout block, the JSON-LD offer a search engine reads, and the
        Stripe line item all state one number at any given moment — before and after the cutover.
      emotional: >
        Not be ambushed. A price rise announced in advance is fine; a price that changes between the
        page and the payment step is not.
      social: >
        Not be the person who took CHF 999 to their finance lead and came back needing CHF 2,000.
    forces:
      push: >
        The inconsistency is LIVE today, before any of this work: the JSON-LD offers on
        src/pages/Lighthouse.tsx:534 and src/pages/Index.tsx:86 already publish "price": "2000" while
        every visible surface says CHF 999. Search engines and AI assistants may already be quoting a
        price the page contradicts, and there is no mechanism binding the two together.
      pull: >
        One resolved value feeds the visible copy, the structured data and the Stripe line item, so the
        three cannot disagree by construction.
      anxiety: >
        A visitor who loads the page minutes before the cutover and clicks buy minutes after it sees one
        number and is charged another. Accepted rather than solved — the edge function must stay
        authoritative on price, and the exposure is a few minutes on a single night.
      habit: >
        Buyers screenshot a price for a budget request and return days later. That habit is why the
        transitional "lock CHF 999 for your full term" copy must disappear cleanly at the cutover rather
        than linger as a half-true promise.
    opportunity_score:
      importance: 5
      current_satisfaction: 2
      gap: 3
      rationale: >
        Importance: 5 — this is the money path; a page/invoice mismatch is trust-ending at exactly the
        moment of purchase. Current satisfaction: 2 — the visible checkout flow is internally consistent
        today, but the structured data already contradicts it, so machine-mediated answers about price
        are already wrong. Gap: 3 — closed entirely by binding display and Stripe to one resolved
        value, with no schema, no new endpoint and no second payment path.

  - id: job-forecaster-attribute-scope-change-to-an-epic
    title: Name the epic and the day behind a delivery's scope change
    persona: delivery-forecaster
    feature_context: epic-size-and-count-over-time
    created: 2026-07-31
    note: >
      Epic 5585, reported by Chris. Extends the Epic 3993 delivery-metrics charts. The burnup already
      shows THAT the backlog stepped up (DeliveryBurnupChart.tsx Backlog series) but attributes the step
      to nothing. Load-bearing code fact: DeliveryMetricSnapshot.FeatureBreakdownJson already holds one
      entry per epic per day (ReferenceId, Name, Completion, Likelihood), so epic COUNT over time is
      already recorded and needs no new column — unlike epic SIZE, which Delivery.ToFeatureMetric
      computes and discards, and which is forward-only per the parent journey's D11.
    job_story: >
      When a delivery's backlog line steps up and leadership asks why,
      I want to see how many epics were in the delivery each day and how big each one was,
      so I can name the epic and the day instead of saying "scope grew" and being asked to prove it.
    dimensions:
      functional: >
        Read an epic-count line and a per-day stacked bar (one segment per epic, height = that epic's
        total child items regardless of state) alongside the existing burnup; isolate one or more epics
        via the legend to follow a single trajectory; see epics that left the delivery stop rather than
        vanish, so a scope cut is as visible as a scope addition.
      emotional: >
        Move from the defensiveness of an unattributable number ("scope grew, I don't know where") to
        the calm of a specific answer ("epic X doubled on the 14th") — without rebuilding it by hand.
      social: >
        Be the forecaster who answers the follow-up question in the room rather than promising to dig
        into it and come back next week.
    forces:
      push: >
        Attribution today means diffing the Work Items tab against memory, or a spreadsheet — the same
        workaround Epic 3993 set out to kill for the burnup, still alive one level down.
      pull: >
        The count line separates "an epic joined" from "an existing epic grew" at a glance, and the
        stacked bars name which one.
      anxiety: >
        A delivery with a dozen epics could render an unreadable stack. Mitigated by the legend
        click-to-filter (multi-select) and treated as the slice-04 learning hypothesis — if filtering
        still leaves it unreadable, the chart's form is wrong, not its controls.
      habit: >
        Forecasters read the burnup first and stop there. The new chart sits directly under it, in the
        same tab, so the second look costs no navigation.
    opportunity_score:
      importance: 4
      current_satisfaction: 1
      gap: 3
      rationale: >
        Importance: 4 — attribution is the immediate follow-up question to every scope step the burnup
        shows; it recurs in every leadership review. Current satisfaction: 1 — nothing in the product
        attributes a backlog change to an epic over time. Gap: 3 — the spine of Epic 5585, and the
        cheapest of the two jobs to serve because the count series is already in the database.

  - id: job-forecaster-know-how-much-of-the-size-is-guessed
    title: Know how much of a delivery's size is a default guess, and when each epic stopped being one
    persona: product-owner
    feature_context: epic-size-and-count-over-time
    created: 2026-07-31
    note: >
      Epic 5585 secondary job; the delivery-forecaster is the secondary persona on it (same chart, no
      bespoke view). Partially served today: the burnup's dashed "Estimated (not broken down)" line
      gives the AGGREGATE estimated portion from DeliveryMetricSnapshot.EstimatedItemCount, but never
      per epic — and it is invisible whenever it falls inside the filled Done area (DeliveryBurnupChart
      paints the Done series with area: true), which is exactly late in a delivery. Source of truth for
      the per-epic flag is Feature.IsUsingDefaultFeatureSize, set by
      WorkItemService.ExtrapolateNotBrokenDownFeatures.
    job_story: >
      When part of a delivery's total is the portfolio default size for epics nobody has broken down yet,
      I want to see which epics are still estimates and the day each one flipped to a real breakdown,
      so I can say how much of the number is real and chase the epics that aren't.
    dimensions:
      functional: >
        Distinguish a default-sized epic from a broken-down one at segment level (hatched fill plus a
        tooltip), locate the flip day, and read the aggregate estimated line in the burnup even when it
        sits below the done count.
      emotional: >
        Stop quoting a total that quietly contains guesses — replace the unease of an unqualified number
        with a qualified one you can defend.
      social: >
        Chase the right people for the right breakdown, with the chart rather than authority as the
        prompt.
    forces:
      push: >
        A delivery total silently mixes real breakdowns with portfolio default sizes; the only signal is
        an aggregate dashed line that disappears under the Done area exactly when the remaining guessed
        scope becomes the interesting number.
      pull: >
        Hatched segments make the guessed portion per-epic and the estimate-to-actual flip a visible
        event on a specific day.
      anxiety: >
        Hatching could read as a different epic rather than a different confidence. Mitigated by keeping
        the epic's colour and varying only the fill pattern, plus a tooltip line stating the default.
      habit: >
        POs judge breakdown status from the Work Items tab per epic; this asks them to read it off a
        trend chart instead — eased because it is the same tab they already open for the burnup.
    opportunity_score:
      importance: 4
      current_satisfaction: 2
      gap: 2
      rationale: >
        Importance: 4 — an un-qualified delivery total is how forecasts lose credibility, and default
        sizing is the common early-stage case. Current satisfaction: 2 — an aggregate estimated line
        exists but is per-delivery, not per-epic, and is invisible under the Done area. Gap: 2 — smaller
        than the attribution job because it is a refinement of a signal that partly exists, and it rides
        on the same chart the attribution job pays for.

  - id: job-snow-flow-coach-one-team-several-kinds-of-work
    title: Cover every kind of ServiceNow work my team does with one Lighthouse team
    persona: flow-coach
    feature_context: servicenow-multi-table-work-item-types
    created: 2026-07-31
    note: >
      ADO #5611, filed out of the slice-02 dogfood of Epic 5513 on 2026-07-29. Refines
      [[job-snow-flow-coach-see-flow-metrics]], which is served: a ServiceNow team does get throughput,
      cycle time and forecasts. What is not served is a team whose workload is not one table. The
      ServiceNow mental model is that the TABLE is the kind of work (Incident / Request / Change) and
      the QUERY is the sub-filter; Lighthouse models kind-of-work as Work Item Types on a team, and a
      ServiceNow team could read exactly one table, so the two models never met. The chosen model is
      to root the read at a hierarchy table (`task`, whose descendants include incident,
      change_request, problem, sc_request) and use the team's existing Work Item Types field as a
      `sys_class_name` filter — a ServiceNow class name IS a work item type rather than an analogy for
      one. That makes `isWorkItemTypesRequired` true for every ServiceNow team — conditional on the
      configured table as first designed, then made unconditional on 2026-07-31 because a hidden field
      the read still honoured was a dead end and nothing ServiceNow had shipped for the conditional to
      protect. Either way it must change in BOTH schema twins after Bug #5613.
    job_story: >
      When my team handles more than one kind of ServiceNow record — incidents and changes, the way a
      Jira team has stories and bugs,
      I want one Lighthouse team to cover all of them,
      so my flow metrics describe my team's actual workload instead of the one record type Lighthouse
      let me pick.
    dimensions:
      functional: >
        Name the record classes the team works on and get every one of them in a single team's
        throughput, cycle time, age and forecast — with each item labelled with the kind it actually
        is, and with no possibility of accidentally reading the whole task hierarchy.
      emotional: >
        Stop apologising for a number. A throughput computed from half a team's work is worse than no
        throughput, because it is quoted in reviews as if it were whole.
      social: >
        Present one team's flow the way the team is actually organised, rather than defending an
        artificial split into an "incident team" and a "change team" that exists only because the tool
        required it.
    forces:
      push: >
        A coach whose team does incidents and changes must either create two Lighthouse teams — each
        forecasting from half the work, both wrong — or measure one kind of work and ignore the rest.
      pull: >
        The team already has a Work Item Types field, already persisted and already rendered; it is
        hidden for ServiceNow rather than absent. The class filter is a use of what exists, not a new
        concept for the coach to learn.
      anxiety: >
        Rooting at `task` to reach several classes could read the entire instance if the class filter
        is empty or binds wider than intended. Mitigated by making Work Item Types REQUIRED once the
        table has descendants — the same rule the connector already applies to a missing query, where
        a team reads nothing rather than everything.
      habit: >
        ServiceNow users reach for the table to say what kind of work something is. This asks them to
        say it in a field named Work Item Types instead — eased because the value they type is the
        class name they already know.
    opportunity_score:
      importance: 4
      current_satisfaction: 1
      gap: 3
      rationale: >
        Importance: 4 — mixed-class teams are the ITSM norm rather than an edge case, and the failure
        mode is a plausible-looking wrong number rather than a visible gap. Not 5, because the epic's
        core value (any ServiceNow flow metrics at all) is already delivered. Current satisfaction: 1
        — there is a workaround (one team per class) and it produces numbers, but they are the wrong
        numbers. Gap: 3, and it is served by a field that already exists on the team.

  - id: job-snow-team-creator-author-a-query
    title: Know what to type in the ServiceNow query field
    persona: flow-coach
    feature_context: servicenow-board-picker-and-query-guidance
    created: 2026-07-31
    note: >
      ADO #5610, filed out of the slice-02 dogfood of Epic 5513 on 2026-07-29. This job sits IN FRONT
      of [[job-snow-flow-coach-see-flow-metrics]] rather than refining it: that job is delivered and
      works, and this is the gate a user has to get through before any of it happens. The dogfood was
      blunt — the connection wizard was straightforward and caught a wrong password, state mapping
      worked by typing labels, and then team creation stopped dead at the query field. Nothing in the
      product says what a ServiceNow query is, which fields exist, or where to get one, and DISTILL
      ruling R-2 makes a missing or whole-table query a BLOCKING verdict. R-2's reasoning was that a
      warning is dishonest when no warning channel renders it; it did not argue that blocking without
      guidance is acceptable. Two independent answers: in-product guidance on the field itself (reaches
      everyone, needs nothing), and a Visual Task Board picker that lifts the table and filter out of a
      board the team already maintains (needs #5611's sys_class_name model, and is gated on a SPIKE —
      this epic has twice found a table readable for the maintainer and 403 for every customer:
      sys_choice and metric_instance).
    job_story: >
      When I am pointing a Lighthouse team at ServiceNow work and the query field is blank,
      I want the product to tell me what a ServiceNow query is and where to get one — or hand me one
      from a board I already maintain,
      so I can finish creating the team instead of abandoning it.
    dimensions:
      functional: >
        Author, or acquire, a ServiceNow encoded query that expresses this team's boundary — and know
        in advance that a typo in a field NAME silently widens the read to the whole table while a bad
        VALUE silently returns nothing, because neither failure raises an error.
      emotional: >
        Stop feeling excluded by a tool that has just said it supports your system. Being blocked with
        no instruction, one step after a wizard that worked, reads as "this was not built for us"
        rather than "you are missing one field".
      social: >
        Be the person who got the team's board into the forecasting tool, rather than the person who
        raised an integration with the platform team and then could not finish configuring it.
    forces:
      push: >
        The very first real user hit the wall within minutes of a connection that validated cleanly.
        There is no in-product explanation, no example, and no ServiceNow docs page at all, and the
        save is refused rather than degraded — so the failure is total, immediate, and silent about
        its cause.
      pull: >
        ServiceNow users already think in Visual Task Boards, and a board carries exactly the two
        things Lighthouse needs: a table and a board filter. Reading one turns query authoring into a
        pick. The generic board port that Jira, Azure DevOps and Linear already use exists and is
        unimplemented for ServiceNow, so the pull is cheap to satisfy if the instance permits it.
      anxiety: >
        A picker that works for the maintainer and 403s for every customer would be the third
        occurrence of one pattern in this epic. It is also the one place where a pre-fill could
        overwrite a query the user typed with an empty one, because the shared board dialog currently
        substitutes empty board information when the read fails. Mitigated by measuring readability as
        a role matrix before building, and by refusing rather than pre-filling when a board cannot be
        read or cannot be expressed as a query.
      habit: >
        ServiceNow users build filters in ServiceNow's own condition builder and copy the encoded query
        out via the breadcrumb right-click. The guidance leans on that habit instead of replacing it;
        the picker automates it. Lighthouse deliberately does not build a second condition builder.
    opportunity_score:
      importance: 5
      current_satisfaction: 0
      gap: 5
      rationale: >
        Importance: 5 — this is not a refinement, it is the gate. Every other ServiceNow job in this
        epic is unreachable until a team can be saved, and the failure lands on first contact, which is
        where prospects are lost rather than merely inconvenienced. Current satisfaction: 0 — there is
        no in-product help, no placeholder, no ServiceNow docs page and no picker; the only path is to
        already know ServiceNow's encoded-query syntax. Gap: 5, and unusually cheap to close: half of
        it is help text on a field that already renders, and the other half is one provider
        implementation behind a port that already exists.

  - id: job-qualify-jira-native-demand
    title: Find out whether a Jira-native Lighthouse is a real buying trigger
    persona: lighthouse-maintainer
    created_in_feature: epic-5146-jira-forge-app
    job_story: >
      When a Jira-shop prospect asks "does this live in Jira?" and the honest answer is no,
      I want to show a real, installable Jira-native Lighthouse inside the call,
      so I can find out whether Jira-nativeness is an actual buying trigger before I invest in a
      marketplace-grade app.
    dimensions:
      functional: >
        Install a manually-distributed Forge app onto a Jira Cloud site and render a running
        Lighthouse instance under Jira's own Apps menu, with no change to Lighthouse itself.
      emotional: >
        Stop arguing from conviction. Replace "we could build a Jira app" — a claim that is equally
        easy to make and to doubt — with a screen the other person reacts to in front of me.
      social: >
        Answer the integration question with a demo rather than a roadmap promise, which is the
        difference between a vendor who has thought about it and one who is deflecting.
    forces:
      push: >
        Prospects ask the Jira question and the conversation moves on, so the question's weight is
        never measured. A wrong guess is expensive in both directions: building a marketplace app
        nobody wanted, or dismissing the avenue and losing Jira-resident buyers silently.
      pull: >
        A wrapper is nearly free — the Lighthouse SPA is already frameable (no X-Frame-Options
        anywhere in the codebase) and the handshake endpoint already exists and is anonymous. An
        installable app converts a hypothesis into an observable reaction across several calls.
      anxiety: >
        Two ways to be wrong. Over-sell it and a visibly-iframed app reads as a mock-up, damaging
        trust more than having no app at all. Under-scope the question and the demos produce polite
        interest that gets misread as demand. Mitigated by fixing the success criteria before the
        first demo and by recording only unprompted reactions.
      habit: >
        Demoing Lighthouse standalone in a browser tab and talking about integration in the
        abstract, which lets both sides leave the question unresolved.
    opportunity_score:
      importance: 8
      current_satisfaction: 1
      gap: 7
      rationale: >
        Importance: 8 — this decides whether an entire product direction gets funded, and the
        decision is currently made on instinct. Current satisfaction: 1 — nothing exists; the only
        available evidence is that prospects ask the question, which says nothing about how much
        the answer weighs. Gap: 7, and cheap to close because the wrapper requires zero Lighthouse
        changes. Note: importance and satisfaction here are the maintainer's judgement, not
        interview data — no customer research backs this epic, which is itself the reason it exists.

  - id: job-evaluate-lighthouse-without-leaving-jira
    title: Evaluate Lighthouse from inside the tool my team already lives in
    persona: forecasting-prospect
    created_in_feature: epic-5146-jira-forge-app
    job_story: >
      When I am sizing up Lighthouse but my team's whole working day happens inside Jira,
      I want to see its forecasts from inside Jira and against my own instance,
      so I can judge whether adopting it adds a tab to my team's day or fits into the one they
      already have.
    dimensions:
      functional: >
        Point the app at my own Lighthouse URL, confirm it connected, and reach team and portfolio
        forecasts without leaving the Jira window.
      emotional: >
        Move from "here comes another tool" to "this sits where we already are". The tab-count
        objection is the one that kills tool proposals before their merits are discussed.
      social: >
        Bring a proposal to the team that survives the first question anyone asks about new
        software, rather than one I have to defend before anyone looks at the data.
    forces:
      push: >
        Every new tool proposal dies on "another tool, another tab", and today Lighthouse genuinely
        is another tab, so the objection is correct and unanswerable.
      pull: >
        Seeing forecasts appear under Jira's own Apps menu makes the adoption story concrete in one
        screen, with no story about future integration work that may or may not arrive.
      anxiety: >
        Is this a real integration or a picture frame? An embedded view that is transparently an
        iframe — Jira chrome wrapped around Lighthouse chrome — may reduce credibility if it is
        presented as more than a preview. Also: whether it will still work once our Lighthouse has
        SSO turned on, which in the MVP it will not.
      habit: >
        Bookmarking a separate forecasting tool and opening it once a sprint, which turns forecast
        review into a ceremony rather than a glance — the habit the embedded view is trying to break.
    opportunity_score:
      importance: 6
      current_satisfaction: 2
      gap: 4
      rationale: >
        Importance: 6 — real, and the objection it answers is genuinely the first one raised, but it
        is a convenience rather than a capability: the same forecasts are already reachable in a
        browser tab. Current satisfaction: 2 — a bookmark works; it just loses every argument about
        adoption friction. Gap: 4. Ranked below the maintainer's job deliberately: this epic is
        funded to answer a business question, not to serve prospects at scale, which is why it exits
        on a written verdict rather than on an adoption number.

  - id: job-config-admin-dismiss-onboarding-guidance
    title: Close the setup guidance for good once the setup is the way I want it
    persona: config-admin
    feature_context: quiet-deliberate-choices
    created: 2026-08-03
    note: >
      NEW in quiet-deliberate-choices (reported by Benjamin on his own instance, 2026-08-03). The
      Overview's "Get Started" panel (OnboardingStepper.tsx) renders whenever onboarding is incomplete
      and there is no way to close it. It only self-hides at activeStep === 3, which requires a
      connection AND a Team AND a Portfolio. Installations that deliberately track team-level flow only
      and never create a Portfolio can therefore NEVER complete it, so the panel is a permanent banner
      rather than guidance. Fix is one close control writing
      localStorage["lighthouse-hide-onboarding-stepper"] (D1/D2), mirroring the dismissal already
      shipped in LighthouseVersion.tsx:45-84. Deliberately NOT solved by making the Portfolio step
      optional (D4): that would change what the product tells a genuinely new admin the happy path is.
      Browser-local, not per-user: a second browser shows the panel again, accepted.
    job_story: >
      When my Lighthouse is set up the way I intend it — including deliberately having no Portfolio,
      because this instance tracks team-level flow only — I want the setup guidance to go away for good,
      so I can open the Overview and see my own Teams instead of being told to finish something I
      already decided not to do.
    dimensions:
      functional: >
        A close control on the "Get Started" panel that hides it permanently for that browser. The flag
        is read in the same pass that computes the active step, so a dismissed panel never flashes
        before it disappears. Storage failure (private browsing, storage disabled by policy) degrades to
        today's behaviour rather than breaking the Overview. No server call, no per-user record, no
        change to the rbac.isSystemAdmin gate that already decides who sees the panel.
      emotional: >
        Move from "this banner is arguing with a decision I already made" to "the Overview opens on my
        data". Small, but it is the first screen of every session.
      social: >
        Show a colleague the Overview without first explaining why the tool still thinks the setup is
        unfinished.
    forces:
      push: >
        The panel occupies the top of the Overview on every single visit, and on a portfolio-less
        installation there is no action that will ever satisfy it. The only lever today is creating a
        Portfolio nobody wants, purely to silence the UI.
      pull: >
        One click and the Overview is the administrator's own data from then on.
      anxiety: >
        "If I close it, do I lose the setup guidance permanently?" — yes, in that browser, by decision
        (D3): the same steps live in the documentation, and clearing site data brings it back. The
        alternative — a restore control in Settings — is one more setting to find and forget.
      habit: >
        Administrators already dismiss things and expect them to stay dismissed; Lighthouse's own
        update notification behaves exactly this way, so the expectation is set inside the product.
    opportunity_score:
      importance: 4
      current_satisfaction: 1
      gap: 3
      rationale: >
        Importance: 4 — nothing is broken and no decision is blocked; it costs screen space and
        patience on the first screen of every session. Current satisfaction: 1 — there is no workaround
        short of creating an unwanted Portfolio. Gap: 3. Ranked low deliberately: this is a two-hour
        annoyance fix, and framing it as more would be dishonest.

  - id: job-config-admin-quiet-deliberate-state-omission
    title: Leave Canceled unmapped without being warned about it on every sync
    persona: config-admin
    feature_context: quiet-deliberate-choices
    created: 2026-08-03
    note: >
      NEW in quiet-deliberate-choices (reported by Benjamin while connecting a ServiceNow instance,
      2026-08-03). ServiceNowWorkTrackingConnector.ReportStatesTheTeamNeverMapped (:306-327) logs a
      WARNING on every team sync naming the left-out count and every unmapped label. The dominant field
      case is an administrator deliberately not mapping Canceled — which is exactly what
      docs/concepts/worktrackingsystems/servicenow.md:206 instructs: "States you do not need (for
      example Canceled) can be left out." So the log reports intended configuration as a problem,
      contradicting the shipped guidance, forever, on every sync. Decision: DELETE the message, not
      downgrade it to Debug (D5) — a Debug line surfaces precisely when someone raises the log level to
      chase a real problem. Only this one warning goes; the other four ServiceNow warnings (no query
      written, no kinds of work named, no transition history, instance unreachable) all name real
      misconfigurations and stay (D6). The drop behaviour itself is unchanged (D7). The Linear connector
      drops unmapped states without logging already, so this closes a connector parity gap.
    job_story: >
      When I have deliberately left states like Canceled out of a Team's state mapping, because that
      work never completed and should not count, I want Lighthouse to drop those records silently, so
      every WARNING left in my log is something I actually have to fix.
    dimensions:
      functional: >
        Records in unmapped states are excluded from the Team's work items exactly as they are today,
        and nothing is written about it at any log level — not Warning, not Information, not Debug, not
        Trace. No replacement surface appears in its place: no UI banner, no validation message, no API
        field. The four other ServiceNow warnings continue to fire, each still proven by its own test.
      emotional: >
        Move from "there is a WARNING on every sync that I have already decided to ignore" to "if
        there is a WARNING in here, I need to go look at it". The value is trust in the channel, not
        the absence of one line.
      social: >
        Hand the log to a colleague, or paste it into a support thread, without prefacing it with
        "ignore that one, it's expected".
    forces:
      push: >
        The warning fires on every sync, for every team with any unmapped state, and names a
        configuration the documentation told the administrator to create. Nobody reads it; worse, its
        presence teaches the reader that ServiceNow warnings are background noise, which is exactly the
        habit that makes the other four warnings useless when they matter.
      pull: >
        A log where every remaining entry is actionable.
      anxiety: >
        "If Lighthouse says nothing, how would I ever catch a state I left unmapped by MISTAKE — a typo
        against a choice list my read-only account cannot query?" Accepted cost, eyes open: the Team's
        state mapping is where an administrator looks when Throughput reads low, and it is where the
        answer is. The near-miss case is real but rare next to the deliberate one, and paying for it
        with a permanent warning trains the reader to ignore the channel. See
        docs/feature/quiet-deliberate-choices/feature-delta.md "Changed assumptions" — this supersedes
        the "DoD 5 forbids the silent no-op" reasoning written into the connector for this path only.
      habit: >
        Administrators already expect a tool to be quiet about configuration they chose; they scan logs
        for exceptions, not for confirmations. Lighthouse's Linear connector already behaves this way.
    opportunity_score:
      importance: 5
      current_satisfaction: 1
      gap: 4
      rationale: >
        Importance: 5 — no metric is wrong and no decision is blocked, but the cost compounds: a
        channel with a known-ignorable entry in it is a channel nobody reads, which degrades the four
        warnings that do matter. Current satisfaction: 1 — there is no way to silence it short of
        raising the whole log level, which hides the useful warnings too. Gap: 4, ranked above the
        onboarding job because it damages a diagnostic surface rather than costing screen space.

  - id: job-po-order-features-when-the-connector-has-no-rank
    title: Supply a priority order when the connector never had one
    persona: product-owner
    feature_context: epic-5375-manual-sorting
    created: 2026-08-06
    note: >
      NEW in epic-5375-manual-sorting (ADO Epic #5375, reported by Lorenzo 2026-06-30, tagged Premium).
      The highest-gap job in the set, and the one the epic's sketch did not name. Lighthouse's entire
      ordering signal is the single string WorkItemBase.Order (:36), and what each connector puts in it
      varies wildly: ADO writes Microsoft.VSTS.Common.StackRank, Jira writes the LexoRank, Linear writes
      SortOrder (inverted — lower means higher), the CSV connector writes an OPTIONAL order column, and
      ServiceNowWorkItemMapper (:123) writes the record NUMBER. A record number is not a rank. So on a
      ServiceNow or rank-less-CSV instance, FeatureComparer is sequencing the forecast by ticket-id text,
      and ForecastService.GetSimulationResultsOfFeatureToUpdate (:201-209) then hands each simulated day's
      throughput to whatever sits at the top of that. The dates are computed against an order nobody chose.

      WIDENED by the premise check run 2026-08-06 against the dev instance's real recorded data. There is
      a SECOND, far more common class of instance with no meaningful order: any instance wired to more
      than one tracker. FeatureComparer sorts int-parseable values ahead of everything non-int
      (FeatureComparer.cs:14-25), so every ADO Feature outranks every Jira and Linear Feature
      unconditionally, whatever anyone's priority. Measured on the dev instance: 86 int-parseable
      (ADO StackRank), 4 LexoRank strings (Jira), 4 doubles (Linear) — three bands, segregated by
      connector rather than by intent. This job is therefore not a ServiceNow/CSV niche.
    job_story: >
      When my work tracking connector gives Lighthouse no priority signal at all — a ServiceNow record
      number, or a CSV export with no order column — I want to supply the order myself, so my forecasts
      are sequenced by what we actually intend to build rather than by ticket id or import order.
    dimensions:
      functional: >
        Set and persist an explicit order over all Features, which every ordering call site and the Monte
        Carlo forecast then read, replacing the source string entirely while the instance switch is on.
      emotional: >
        Move from "I cannot explain why Lighthouse thinks this lands in November" to "these dates come
        from the sequence we agreed in planning".
      social: >
        Present a forecast in a stakeholder review and be able to defend the sequence it assumes, rather
        than discovering mid-meeting that it is alphabetical by incident number.
    forces:
      push: >
        There is no workaround inside Lighthouse. The only lever is editing records in the tracker, and on
        ServiceNow there is no rank field to edit — the connector is reading the record number because
        nothing better exists. Every forecast on such an instance is quietly mis-sequenced.
      pull: >
        An order Lighthouse owns, that survives sync, and that visibly moves the dates when changed.
      anxiety: >
        "If I take ownership, does the board jump the moment I flip the switch, and can I ever hand it
        back?" Answered by D6 (seed from today's order, so nothing moves) and D9 (the switch is
        bidirectional and manual ranks are retained).
      habit: >
        Product owners already maintain a ranked backlog somewhere — in a spreadsheet, on a wall, in the
        tracker. The change is doing it where the forecast can see it, not doing it at all.
    opportunity_score:
      importance: 5
      current_satisfaction: 0
      gap: 5
      rationale: >
        Importance: 5 — the forecast, which is the product's core output, is sequenced by a value that
        carries no priority information. Current satisfaction: 0 — not "poor", but absent: there is no
        partial workaround, because the field the connector reads does not exist in the source system.
        Gap: 5, the highest in this feature and among the highest in the file. This is the job that makes
        the epic worth its premium tag rather than a convenience.

  - id: job-po-own-the-order-the-forecast-uses
    title: Make Lighthouse forecast in the order we actually agreed
    persona: product-owner
    feature_context: epic-5375-manual-sorting
    created: 2026-08-06
    job_story: >
      When my tracker's rank does not match what the team agreed to build next — because someone else
      re-ranked the backlog, or because the rank was never maintained — I want to set the order Lighthouse
      forecasts against directly in Lighthouse, so the dates I show stakeholders come from our real
      priority instead of a stale StackRank.
    dimensions:
      functional: >
        Drag a Feature to a new position and have the change persist across every subsequent sync, with
        the forecast re-sequencing accordingly on the next run.
      emotional: >
        Move from resignation ("the tool has its own opinion about our priorities") to ownership ("the
        tool reflects the decision we made on Tuesday").
      social: >
        Answer "why is that one late?" with "because we put it fourteenth" rather than "I'm not sure how
        it decides that".
    forces:
      push: >
        The tracker's rank churns for reasons outside this team — WorkItemBase.Update (:142) re-imports it
        on every refresh, so a re-rank by anyone in ADO or Jira silently re-sequences the forecast between
        one look and the next, with no signal that anything changed.
      pull: >
        One drag, and the sequence stops being someone else's decision.
      anxiety: >
        "If Lighthouse stops following the tracker, do the two drift apart until nobody trusts either?"
        Accepted cost, eyes open: D8 rules out write-back, so the tracker and Lighthouse genuinely can
        disagree. The trade is deliberate — the alternative is generating LexoRanks and writing into
        someone else's system, which is a larger and more dangerous feature.
      habit: >
        Re-ranking in the tracker is the current behaviour and does not have to stop; it simply stops
        being the only channel, and stops being authoritative while the switch is on.
    opportunity_score:
      importance: 5
      current_satisfaction: 2
      gap: 3
      rationale: >
        Importance: 5 — same core output as the job above. Current satisfaction: 2, not 0, because a real
        workaround exists on ADO, Jira and Linear: go and re-rank the backlog at source. It costs a round
        trip, it is frequently not the product owner's call to make, and it is undone by the next person
        who drags something in the tracker. Gap: 3.

  - id: job-po-reorder-inside-my-own-portfolio
    title: Reprioritise my own Portfolio without touching anyone else's
    persona: product-owner
    feature_context: epic-5375-manual-sorting
    created: 2026-08-06
    note: >
      This job exists because Feature <-> Portfolio is MANY-TO-MANY (LighthouseAppContext.cs:217-219): a
      Feature can sit in several Portfolios at once, and there is exactly ONE global order (D3), because a
      team spans Portfolios and its simulation needs an unambiguous next Feature. So "reorder my own
      Portfolio" is not a separate list — it is a constrained edit to the shared one, which is what
      decision D4 (insert-at-target) and the RBAC rule D11 exist to define.
    job_story: >
      When I own one Portfolio on an instance several teams share, I want to reprioritise my own Features
      from the page I already work on, so I can act without an admin and without discovering later that I
      moved someone else's delivery.
    dimensions:
      functional: >
        Move actions on the Portfolio's own Feature list (Move to Top / Up / Down / Bottom, plus Move
        above a named Feature); the edit lands in the single global order via insert-at-target, and
        Features belonging to Portfolios the user cannot write are not movable.
      emotional: >
        Move from "I'd better ask before touching that" to "this is mine to change".
      social: >
        Reprioritise without having to justify it to owners of Portfolios the change does not affect.
    forces:
      push: >
        Without a scoped surface the whole feature is admin-only: the only editable view would be the
        instance-wide Features view, and reordering there is not something every Portfolio owner should
        have to reach for to change their own priorities.
      pull: >
        Reordering where the work is already being looked at, on the Portfolio detail page, using the
        Feature list that is already there.
      anxiety: >
        "Am I moving things I cannot see?" Answered honestly rather than reassuringly: a Portfolio's
        Features are generally non-contiguous in the global order, so Move to Top from a Portfolio list
        DOES cross one Feature outside the view — it lands above that Portfolio's own first Feature, not
        at global rank 1. Insert-at-target was chosen partly because it causes exactly one such crossing
        where slot permutation causes two.
      habit: >
        Reordering a backlog from a row menu is how every work tracker already works; the expectation is
        set outside Lighthouse.
    opportunity_score:
      importance: 3
      current_satisfaction: 0
      gap: 3
      rationale: >
        Importance: 3 — only bites on multi-Portfolio instances, and single-Portfolio instances get the
        same outcome from the instance-wide page. Current satisfaction: 0 — no ordering surface exists at
        all today. Gap: 3. Ranked below the two ownership jobs because it is about WHERE the capability is
        reachable rather than whether it exists, but it is not optional: without it the feature ships
        admin-only, which for most instances means it ships unused.

  - id: job-config-admin-switch-ordering-ownership
    title: Hand ordering to Lighthouse, and be able to hand it back
    persona: config-admin
    feature_context: epic-5375-manual-sorting
    created: 2026-08-06
    job_story: >
      When I decide Lighthouse should own priority rather than mirror the tracker, I want one instance
      switch that starts from today's order and can be undone, so nobody's forecast jumps the moment I
      flip it and I am not making a decision I cannot walk back.
    dimensions:
      functional: >
        One premium, SystemAdmin-guarded instance setting. Enabling seeds a rank for every Feature from
        the current order so the visible list does not move. Disabling restores the source order
        immediately and RETAINS the manual ranks, so re-enabling restores them rather than re-seeding.
      emotional: >
        Move from "this reads like a one-way door and I am not flipping it on a live instance" to "I can
        try this on Monday and undo it on Tuesday".
      social: >
        Turn it on without having to warn every team first that their dates may move.
    forces:
      push: >
        The epic's own framing — "if you enable manual sort, everything will be manually maintained" —
        reads as irreversible and all-encompassing, which is precisely the shape of change an
        administrator defers indefinitely on a system other people depend on.
      pull: >
        A switch whose first effect is visibly nothing, and whose off position is a real revert rather
        than a re-import.
      anxiety: >
        "What happens to Features that arrive while it is on, and to the ones that arrived while it was
        off?" Answered by D7: they append to the end, silently — accepted cost, stated rather than hidden,
        since it means new work forecasts last until someone sorts it.
      habit: >
        Administrators already expect instance-level settings to be reversible and to preview their effect;
        Lighthouse's other premium settings behave this way.
    opportunity_score:
      importance: 4
      current_satisfaction: 1
      gap: 3
      rationale: >
        Importance: 4 — nothing is broken while ordering stays with the tracker, but this switch is the
        gate every other job in the feature passes through, and an irreversible-feeling gate does not get
        opened. Current satisfaction: 1 — the closest current experience is other premium toggles, which
        set the expectation this one has to meet. Gap: 3.

  - id: job-po-see-the-order-that-drives-the-forecast
    title: See where a Feature sits in the queue Lighthouse simulates
    persona: product-owner
    feature_context: epic-5375-manual-sorting
    created: 2026-08-06
    note: >
      The one job in this feature that is NOT premium (D12) and needs no manual ordering at all — it makes
      an existing, already-load-bearing fact visible. ForecastService (:201-209) draws each simulated day's
      throughput from the first FeatureWIP remaining Features in order, so list position already moves the
      50/70/85/95% dates on every instance today. The list is rendered in that order
      (PortfolioFeatureList via FeatureListDataGrid, no initial sort model) but nothing says so, so it
      reads as arbitrary. It is also only ever visible one Portfolio at a time — which is why this job is
      served by a new general Features view (D17), the third top-level nav entry, that ADO Epic 4365
      "Dependencies" will later share.
    job_story: >
      When two Features have very different forecast dates, I want to see where each one sits in the queue
      Lighthouse simulates, so I can tell a priority effect from a throughput effect before I go and try
      to fix the wrong thing.
    dimensions:
      functional: >
        A position column showing each Feature's GLOBAL rank — not its index in the visible rows, so two
        Features shown consecutively inside a Portfolio may read 4 and 17 — plus one line of help text
        saying the top of the list gets the teams' throughput first.
      emotional: >
        Move from "the tool produced a date and I have to take it on faith" to "I can see the mechanism".
      social: >
        Explain a late date to a stakeholder in one sentence, pointing at a number on screen.
    forces:
      push: >
        The order is already deciding the dates and is already on screen, but unlabelled. A product owner
        chasing a bad forecast has no way to tell whether to fix the sequence or fix the flow, so the
        cheapest available diagnosis is invisible.
      pull: >
        One column that turns a rendered order into information.
      anxiety: >
        "If the number is the global position, why do the Features in my Portfolio skip numbers?" Answered
        in the help text — it is a queue across the whole instance, and the gaps are other Portfolios'
        Features.
      habit: >
        Reading a ranked list top-to-bottom is universal; the only new idea is that this particular list
        is an input rather than a presentation.
    opportunity_score:
      importance: 3
      current_satisfaction: 1
      gap: 2
      rationale: >
        Importance: 3 — no metric is wrong and no decision is blocked; a diagnosis is simply slower than it
        needs to be. Current satisfaction: 1 — the order is technically visible, in that the rows are in it,
        but nothing identifies it as meaningful. Gap: 2, ranked lowest in this feature deliberately: it
        explains a problem rather than solving one, and framing a column as more than that would be
        dishonest. It ships first anyway, because it is the cheapest way to find out whether the source
        order is meaningful enough for the rest of the epic to be aimed correctly.

  - id: job-operator-sync-without-hammering-the-tracker
    title: Refresh a decades-deep tracker without refetching the whole of it
    persona: platform-operator
    feature_context: epic-5687-faster-updates
    created: 2026-08-08
    note: >
      NEW in epic-5687 (ADO #5687 "Faster Updates"). The epic names its own worst case — an on-premise
      Jira Data Center instance with 25 years of history. Verified in code during DISCUSS:
      WorkItemService.RefreshWorkItems refetches the entire query result every cycle, and the removal
      rule (stored item absent from the fetch is deleted) is what makes a naive delta unsafe, because
      every item would become immortal. The chosen shape (D1/D2) keeps a full identity sweep every cycle
      and narrows only the payload fetch, so removal semantics are untouched. The DoneItemsCutoffDays
      window already bounds CLOSED items; it does nothing for open ones, which is why the cost does not
      fall off on its own.
    job_story: >
      When Lighthouse refreshes a team or portfolio against a work-tracking system that holds years or
      decades of history,
      I want it to download in full only the records that actually moved since the last refresh, while
      still noticing anything that was deleted or dropped out of my query,
      so I can run a short refresh interval without making Lighthouse the heaviest API consumer on my
      colleagues' Jira instance, and without waiting minutes to learn that a handful of things changed.
    dimensions:
      functional: >
        Each cycle issues the same query, but asks first only for identity plus a remote-changed
        timestamp; full payloads — fields, changelog, ADO revisions, ServiceNow state spans, Linear
        history — are fetched only for records whose timestamp differs from the stored one, compared per
        item rather than against a global watermark. The full identity set is enumerated every cycle, so
        `removed = stored - swept` keeps exactly today's meaning. The first refresh, and any refresh
        after a fetch-shaping configuration change, is still a full fetch.
      emotional: >
        Move from "I widened the interval to an hour because a refresh takes five minutes and I feel
        slightly guilty pointing it at the shared instance" to "it costs almost nothing, so the interval
        is a product decision again".
      social: >
        Stop being the integration the Jira administrator brings up in the platform meeting; be able to
        answer "what does Lighthouse cost us?" with a number off a log line.
    forces:
      push: >
        Every update refetches the world. On Jira the cost is compounded by the changelog: any issue with
        more than 30 entries triggers extra paged requests at 100 per page, so the oldest, longest-lived
        issues — exactly the ones that never change — are the most expensive to re-read. On ADO the
        dominant cost is a per-item GetRevisionsAsync round trip to rebuild transitions, paid for every
        item on every cycle.
      pull: >
        A cheap identity scan plus a handful of payload fetches; a refresh that costs seconds instead of
        minutes, and a refresh interval chosen for how fresh the data should be rather than for how much
        the fetch costs.
      anxiety: >
        "Will delta silently miss a deletion, or an item that left my query?" (No — the identity sweep
        enumerates the full result set every cycle; removal semantics are unchanged, and that is why the
        cheaper delta-query design was rejected.)
        "Will an item that stops changing stop being noticed?" (This is the real trap: staleness is
        time-driven, so the item that goes stale is precisely the item that stops being fetched. The
        staleness evaluation moves off the fetched-item loop onto the stored set.)
        "Will my metrics drift after weeks of deltas?" (An unchanged item's stored fields and transitions
        must be byte-identical across a delta cycle, asserted directly, and anything ambiguous — a failed
        sweep, a missing timestamp — resolves to a full fetch.)
      habit: >
        Operators today compensate by widening the refresh interval and accepting staler data. They must
        learn they no longer need to, which means the saving has to be visible somewhere — hence the log
        line, and hence its shipping first.
    opportunity_score:
      importance: 4
      current_satisfaction: 1
      gap: 3
      rationale: >
        Importance: 4 — the cost is paid on every cycle forever, it scales with the customer's history
        rather than with their activity, and on the largest instances it forces a worse product (a longer
        interval, staler numbers). It is also a community-reported complaint, not an internal hunch.
        Current satisfaction: 1 — there is no incremental fetch anywhere in the codebase; the only lever a
        user has today is to refresh less often. Gap: 3 — a genuinely missing capability, expressible on
        every remote connector with one contract, and bounded by a removal rule that must not change.

  - id: job-config-admin-know-which-settings-cost-a-refetch
    title: Change a setting without wondering whether it just cost a full refetch
    persona: config-admin
    feature_context: epic-5687-faster-updates
    created: 2026-08-08
    note: >
      NEW in epic-5687 (ADO #5687). The epic's own second question, quoted: "Depending on what setting was
      changed, we may need to: Get everything again / Don't even need to update (e.g. if just add wait
      states, that doesn't mean an update is needed from the source systems...)". Today the question is
      moot because every cycle refetches everything; it becomes a correctness requirement the moment delta
      exists, because a query edit that does not force a refetch would serve the old result set forever.
      Note that saving a setting does not itself trigger a fetch today — TriggerUpdate is called from the
      manual controller endpoints and the periodic loop only — so this job is about what MODE the next
      scheduled cycle runs in, not about an immediate refresh.
    job_story: >
      When I change a Team or Portfolio setting in Lighthouse,
      I want Lighthouse to work out by itself whether that change alters what has to be pulled from the
      work-tracking system — and to pull nothing at all when the change is purely local —
      so I can tune wait states, blocked rules or a staleness threshold as often as I like without
      triggering a multi-minute refetch, and still trust that widening my query really did take effect.
    dimensions:
      functional: >
        A fetch fingerprint over exactly the properties that shape the remote query — the query text,
        work item types, states, the done-items cutoff, additional field definitions, the parent-override
        field, and the connection. A mismatch makes the next cycle a full fetch and says so. Everything
        outside that set — wait states, blocked rules, staleness threshold, named cycle times, ordering
        policy, terminology — leaves the fingerprint alone and provokes no remote fetch. A guard test
        fails when a fetch-shaping property is added without being registered, because the alternative
        failure mode is stale data with a green test suite.
      emotional: >
        Move from "I batch up my settings edits because each one seems to cost something" to editing
        freely, and from hoping a query change took effect to reading that it did.
      social: >
        Be the administrator who can tune the team's definitions during a retro without apologising for
        the load it puts on the shared tracker.
    forces:
      push: >
        There is no distinction today between an edit that changes what is fetched and one that does not,
        because everything is refetched regardless. The epic author flagged this as an open question
        before any code was written, which is the clearest possible signal that the distinction is real.
      pull: >
        The system classifies the edit itself. The admin never has to know which settings are "expensive",
        and never has to be given a button that implies the automatic path is not trusted.
      anxiety: >
        "What if the fingerprint misses a field and I get stale data forever?" (The guard test enumerates
        the properties reachable from the query builder and fails on an unregistered one; the exclusion
        list is explicit and commented.)
        "What if it is too eager and every save costs a refetch anyway?" (The collections are compared
        order-insensitively, so re-saving the same states in a different order is not a change.)
        "What happens on the release that introduces this?" (No stored fingerprint means the first cycle
        is full — ambiguity always resolves to the expensive, safe answer.)
      habit: >
        Admins do not currently think about fetch cost at all, because the cost is uniform. The new idea
        is that some edits are free, and the only place they will notice it is the log line — which is
        exactly what that line is for.
    opportunity_score:
      importance: 3
      current_satisfaction: 1
      gap: 2
      rationale: >
        Importance: 3 — on its own this is a convenience, but it becomes a correctness gate the moment
        delta ships: without it, a query edit silently keeps serving the previous result set on every
        connector that has already been converted. Current satisfaction: 1 — no such classification exists
        anywhere; the concept of a fetch-shaping setting is not represented in the model. Gap: 2 — a small,
        enumerable, testable addition whose value is almost entirely defensive.

  - id: job-operator-read-an-update-log-that-says-something
    title: Read one line per update instead of a page of iteration
    persona: platform-operator
    feature_context: epic-5687-faster-updates
    created: 2026-08-08
    note: >
      NEW in epic-5687 (ADO #5687), from the user's own aside during DISCUSS: "While we are at it, we may
      clean up the logs, it's quite noisy on update right now". Counted during the wave: 38
      Information/Debug statements on the update path, 17 in WorkItemService alone; UpdateServiceBase
      logs one Information line per entity per cycle BEFORE deciding not to update it; "Updating Work
      Items for Team {X}" is emitted three times per team per update. The duration and item count are
      already recorded in RefreshLog and go unreported. This job ships FIRST in the epic because it is the
      instrument every other slice's acceptance is read off — and because a UI for the same information is
      Epic 5511's job, not this one's.
    job_story: >
      When I look at Lighthouse's logs to understand what an update just did,
      I want a single line per update telling me which entity, in which mode, how much it saw, how much it
      actually fetched and how long it took — rather than a per-entity, per-item stream I have to filter —
      so I can tell a healthy cheap cycle from a full refetch or a stuck one at a glance, and decide
      whether this instance's refresh interval is affordable.
    dimensions:
      functional: >
        One Information-level structured summary line per completed update, carrying entity, mode
        (full/delta), records scanned, records fetched, duration and success, backed by the same fields
        added to RefreshLog. Per-entity and per-item chatter demoted to Debug — nothing deleted. A cycle
        that skips an entity logs nothing at Information for it. Errors and warnings untouched.
      emotional: >
        Move from scrolling past a wall of iteration to reading the log the way you read a status line.
      social: >
        Answer "is Lighthouse healthy?" and "what does it cost us?" from a log excerpt, in a platform
        channel, without a screenshot of a dashboard that does not exist yet.
    forces:
      push: >
        The log currently narrates the loop rather than the outcome, and the two numbers an operator
        actually wants — how long, and how much — are recorded to the database and never surfaced. On an
        instance with many teams, the per-entity "checking last update" lines dominate the volume while
        carrying no decision.
      pull: >
        One legible line per update, which doubles as the evidence for every performance claim the rest of
        the epic makes.
      anxiety: >
        "Will I lose the diagnostics I use to debug a stuck update?" (Nothing is removed; the per-entity
        and per-item lines move to Debug and come back by raising the level.)
        "Is this a substitute for a real view?" (No — Epic 5511 owns the task-manager and admin-health UI,
        and the RefreshLog fields added here are what it will render.)
      habit: >
        Operators have learned to grep. They will keep grepping; the change is that the thing they grep
        for now exists.
    opportunity_score:
      importance: 3
      current_satisfaction: 1
      gap: 2
      rationale: >
        Importance: 3 — no metric is wrong and nothing is blocked, but the operator's cheapest diagnostic
        is unavailable, and without it the rest of this epic cannot be measured or falsified. Current
        satisfaction: 1 — the data exists in RefreshLog and is never surfaced, while the log emits volume
        instead of signal. Gap: 2 — small, entirely additive, and load-bearing for the epic's other two
        jobs, which is why it ships first despite ranking below them on value.

  # ---------------------------------------------------------------------------
  # epic-5775-secret-encryption-key-custody (2026-08-14, Epic #5775)
  # ---------------------------------------------------------------------------

  - id: job-operator-unique-key-without-effort
    title: Get a credential-protecting key that is mine alone, without doing anything
    persona: platform-operator
    job_story: >
      When I install Lighthouse — a downloaded exe, one docker run, or one helm install —
      I want the credentials it stores for my work tracking systems protected by a key that exists
      only on my instance,
      so I can be sure a copy of my database is worthless to whoever takes it, without having read a
      configuration page first.
    dimensions:
      functional: >
        The instance obtains a unique 32-byte key on first start — generated for itself, or supplied
        by configuration or an external secret store — and uses it for every secret it writes.
      emotional: >
        Move from an unexamined assumption ("presumably it handles that") to a settled fact, without
        ever having had to hold the worry in between.
      social: >
        Answer a colleague's or a security team's question about stored credentials without hedging or
        going to read the source.
    forces:
      push: >
        A single AES key ships in appsettings.json in a public repository and is used by every install
        that has not overridden it. Anyone who obtains the database file obtains every stored token.
        The documented override reads a configuration path no code consumes, so the operators who did
        try to fix this are still on the published key and have no way to know.
      pull: >
        Correct by default with nothing to configure — the same shape the OAuth state secret already
        uses, where first boot generates the value and every restart resolves the same one.
      anxiety: >
        "If it starts generating a key, will my existing connections stop working and will I have to
        re-enter every token?" (No — the published default is retired into the key ring on upgrade, so
        existing secrets stay readable while new writes move to the instance's own key.)
        "What happens if I lose that file?" (Every stored secret becomes unreadable. That is the
        correct security property and it has to be stated, not discovered.)
      habit: >
        Operators expect to set an environment variable and assume it took effect. That habit is
        currently punished rather than rewarded, which is what makes the silent default so damaging.
    opportunity_score:
      importance: 5
      current_satisfaction: 1
      gap: 4
      rationale: >
        Importance: 5 — this is the finding that costs evaluations, and it undermines every other
        security claim the product makes. Current satisfaction: 1 — a unique key is nominally possible
        and practically unreachable, because the documented route to it does nothing. Gap: 4 — the
        highest-leverage job in the epic: fixing it retires the whole class of criticism.

  - id: job-operator-rotate-key-without-recredentialing
    title: Move every stored secret onto a new key without asking anyone for a token
    persona: platform-operator
    job_story: >
      When my encryption key may have been exposed — a leaked backup, a departing administrator, or a
      compliance schedule that says so —
      I want to move every stored secret onto a new key from inside Lighthouse,
      so I can contain the exposure the same afternoon instead of asking every team to re-enter every
      credential.
    dimensions:
      functional: >
        Generate a new key, make it active, re-encrypt every readable stored secret under it, retire
        the old key without discarding it, and report what moved and what did not.
      emotional: >
        Move from dread — a key change today means chasing a dozen people for tokens with every sync
        down — to control, measured in a number on a report.
      social: >
        Demonstrate competent incident response to a security officer, rather than explaining why
        rotating the key is technically possible but operationally never done.
    forces:
      push: >
        The documented procedure for changing the key is to change it and then reconfigure every work
        tracking system. That is a full outage of every sync plus a credential-collection exercise, so
        the rational response to a suspected exposure is currently to postpone it indefinitely.
      pull: >
        One action, no credential re-entry, resumable if interrupted, and a report that says whether it
        worked.
      anxiety: >
        "What if rotation half-finishes and I lose secrets I cannot recover?" (Both keys stay in the
        ring, the pass is resumable, and a secret that cannot be read is left byte-for-byte untouched
        and named rather than overwritten.)
        "What if it collides with a sync that is running?" (An open question answered by a probe before
        the work is committed to, not by hoping.)
      habit: >
        Treat a key change as a disaster to be avoided. The surface has to lead with the cost that is
        NOT being paid, because that is the belief being overturned.
    opportunity_score:
      importance: 5
      current_satisfaction: 1
      gap: 4
      rationale: >
        Importance: 5 — without rotation, a key exposure has no remedy short of re-credentialing the
        whole instance, and "we can rotate" is a routine procurement question. Current satisfaction:
        1 — the only supported answer today is documented as reconfiguring every connection. Gap: 4.

  - id: job-operator-know-the-key-is-actually-in-effect
    title: Find out which key this instance uses and whether every secret can be read with it
    persona: platform-operator
    job_story: >
      When I have installed, upgraded, or changed the encryption key,
      I want Lighthouse to tell me plainly which key it is using and whether every stored secret is
      readable under it,
      so I stop finding out from a work tracking system rejecting a credential at three in the morning.
    dimensions:
      functional: >
        The key source and active key id are visible at startup and in the app; a read-only check
        reports every stored secret's state — active key, retired key, legacy plaintext, unreadable —
        with the connection and field that own it.
      emotional: >
        Move from suspicion to proof, and specifically from "I think I set that" to "I can see what is
        in effect".
      social: >
        Give an auditor a verifiable answer rather than an assurance.
    forces:
      push: >
        Decrypt currently catches its own failures and returns the ciphertext as though it were the
        secret, so a wrong key is indistinguishable from a right one until a connector fails — and
        then it looks like an expired token, sending the operator to fix the wrong thing. Nothing
        anywhere reports which key is in use.
      pull: >
        One line at startup, one panel in settings, one read-only check that writes nothing.
      anxiety: >
        "Will checking write something or lock something?" (No — the check is read-only by
        construction, which is the reason it exists separately from rotation.)
        "Will a report full of states I do not understand help?" (The four states are named for what
        the operator does about each.)
      habit: >
        Verify by triggering a sync and watching the log, which conflates key problems with credential
        problems and is the reason the two get confused.
    opportunity_score:
      importance: 4
      current_satisfaction: 1
      gap: 3
      rationale: >
        Importance: 4 — not a blocker on its own, but it is what makes the other jobs verifiable, and
        the absence of it is what kept the configuration-path defect hidden. Current satisfaction: 1 —
        silent by design. Gap: 3.

  - id: job-saas-operator-tenant-owned-encryption-key
    title: Give each tenant a key its own secret store owns
    persona: platform-operator
    job_story: >
      When I run many Lighthouse tenants on a cluster,
      I want each tenant's secrets encrypted with a key that only that tenant's instance uses and that
      an external secret store owns,
      so one compromised tenant or one leaked backup does not expose every customer's tokens.
    dimensions:
      functional: >
        The chart accepts a Secret an external store populates, or an explicit key, and refuses to render
        when given neither. It generates nothing, so there is nothing an upgrade or a sync can regenerate.
      emotional: >
        Move from shared-fate anxiety to isolation: a per-tenant blast radius the operator can describe.
      social: >
        Pass an enterprise security review of a hosted install, and answer a procurement questionnaire
        about tenant isolation with a mechanism rather than a policy.
    forces:
      push: >
        The chart provisions a database connection string and an OIDC client secret and no encryption
        key at all, so every Kubernetes install — including every tenant — runs on the published
        default, and one database dump is every tenant's credentials.
      pull: >
        Chart-native, compatible with External Secrets Operator and OpenBao, and usable by a
        self-hoster who supplies nothing at all.
      anxiety: >
        "Will an upgrade regenerate the key and orphan the tenant?" (The single most likely way to ship
        this broken; it carries a chart unit test of its own.)
        "Do I now need N rotation runbooks?" (Rotation is an in-app action, so the platform automates
        one procedure rather than authoring one per tenant.)
      habit: >
        Put secrets in a values file, where they end up in a repository. The chart has to make the
        better path the default one.
    opportunity_score:
      importance: 5
      current_satisfaction: 1
      gap: 4
      rationale: >
        Importance: 5 — multi-tenant isolation is the hosted product's core promise, and shared key
        material contradicts it directly. Current satisfaction: 1 — the chart provisions nothing.
        Gap: 4.

  - id: job-maintainer-answer-the-secret-storage-question
    title: Answer a prospect's security team about stored credentials, specifically and truthfully
    persona: lighthouse-maintainer
    job_story: >
      When a prospect's security team asks how Lighthouse protects the credentials it stores,
      I want to answer with a link to public documentation that matches what the product actually does
      by default,
      so I win the evaluation on the merits instead of losing it to an unfalsifiable doubt.
    dimensions:
      functional: >
        Documentation, compliance self-assessment and security policy describe the shipped custody
        modes, the rotation procedure, and what an operator must back up.
      emotional: >
        Move from defensive — pushing back on a claim while the docs quietly undermine the rebuttal —
        to confident.
      social: >
        Be the vendor who volunteers the limits, in a market where the competing tools are judged on
        exactly this.
    forces:
      push: >
        An evaluation was already lost to "credentials are stored in plain text". The claim names the
        wrong mechanism and lands close enough to the truth to stick, because the configuration page
        documents an override no code reads and the compliance self-assessment cites per-installation
        unique keys as evidence of secure-by-default.
      pull: >
        A page a security reviewer can complete an assessment from, with no maintainer in the loop.
      anxiety: >
        "Does publishing this detail invite scrutiny of what is still weak?" (Yes, and that is the
        point: the alternative is a reviewer inventing a worse answer.)
        "Does an advisory alarm existing users?" (It publishes when the fixed version is installable,
        so they learn about it at the moment they can act.)
      habit: >
        Answer ad hoc, per prospect, in a chat thread — which does not scale and leaves the public
        surface stale.
    opportunity_score:
      importance: 4
      current_satisfaction: 2
      gap: 2
      rationale: >
        Importance: 4 — it decides evaluations, but only after the underlying behaviour is worth
        describing. Current satisfaction: 2 — the docs describe the right intent and the wrong
        mechanism, which is better than nothing and worse than silence. Gap: 2 — small, and it gates
        the release, because an advisory is only honest once the fix is installable.

  - id: job-config-admin-paste-a-credential-with-confidence
    title: Know what happens to a token before pasting it
    persona: config-admin
    job_story: >
      When I am about to paste a personal access token into a tool I did not write,
      I want the form to tell me plainly what becomes of it,
      so I can proceed without stopping to ask my security team — and have something to send them if I
      decide to ask anyway.
    dimensions:
      functional: >
        One notice on the connection form, in plain words, saying the value is encrypted before it is
        saved, never shown again to anyone including an administrator, never transmitted off the
        instance, and revocable at the source. A link to the fuller explanation for whoever wants it.
      emotional: >
        Move from a small hesitation nobody voices — "is pasting this here a bad idea?" — to proceeding
        without having had to find out.
      social: >
        Be able to answer a colleague or a security reviewer with a link rather than a shrug, without
        having become the person who has to know how it works.
    forces:
      push: >
        The form asks for a credential and says nothing about what happens to it. The reassurance does
        exist — one line on a connector concept page — but it is nowhere near the moment of the
        decision, so it reaches nobody who is actually deciding. Doubt at this exact point is what
        turns into "we heard it stores credentials in plain text" three conversations later.
      pull: >
        A short, plain answer at the moment of pasting, and one link for the person who wants the
        detail.
      anxiety: >
        "Is this a claim or a fact?" (Every claim in it is checkable: reload the form and the field is
        blank.)
        "Am I about to get told off by security?" (The link is the thing to forward, which is the
        cheapest possible escalation.)
      habit: >
        Paste it and hope, or abandon the setup and ask someone — and the second is what loses the
        evaluation, because it never comes back.
    opportunity_score:
      importance: 4
      current_satisfaction: 1
      gap: 3
      rationale: >
        Importance: 4 — not a blocker, but it is the surface where doubt about credential handling
        actually starts, and doubt that starts here is what gets repeated second-hand as fact. Current
        satisfaction: 1 — the form is silent; the answer exists somewhere nobody is looking at the
        time. Gap: 3 — and unusually cheap: one notice, one string, no dependency on the key work,
        because every claim in it is already true.

  - id: job-forecast-honours-what-cannot-start-yet
    title: Forecast in the order work can actually happen
    persona: delivery-forecaster
    feature_context: epic-5792-dependency-aware-forecasting
    created: 2026-08-14
    note: >
      NEW in epic-4365-dependencies (ADO Epic #4365, created 2026-02-23, tagged Premium); moved to
      epic-5792-dependency-aware-forecasting when that epic was split out on 2026-08-16. The epic's
      one-line ask — "in the forecast, jump over them until the dependent Features are forecasted to be
      done" — turns out to be a statement about WHERE the mechanic lives.
      ForecastService.GetSimulationResultsOfFeatureToUpdate (:201-209) draws each simulated day's
      throughput from the first min(FeatureWIP, remaining) Features in order, so excluding a waiting
      Feature does not merely push its own dates out: it hands its capacity to the Features BELOW it,
      which finish EARLIER. The obvious cheap alternative — computing max(own date, blocker's date)
      afterwards — gets the waiting Feature roughly right and every other Feature in the Portfolio
      wrong, because the capacity is never freed. That is why this job is about the whole board's
      dates rather than one Feature's.
    job_story: >
      When one Feature cannot start until another finishes, I want the forecast to simulate that
      constraint rather than assume everything could start today, so the dates I present to
      stakeholders describe an order the work can actually happen in.
    dimensions:
      functional: >
        A waiting Feature stops consuming simulated throughput until its blockers are done within the
        same trial, and the Features behind it consume it instead.
      emotional: >
        Move from "I know this date is optimistic and I cannot say by how much" to presenting a number
        I would defend.
      social: >
        Answer "can we commit to that?" with a date that already accounts for what we are waiting on,
        rather than with a caveat delivered verbally after the number.
    forces:
      push: >
        There is no workaround inside Lighthouse and no partial one outside it. Nothing in the product
        can express "not yet", so every forecast on every instance silently assumes every Feature is
        startable today. The error is invisible and always in the optimistic direction.
      pull: >
        Dates that move when the thing you are waiting on moves, without anyone maintaining a
        spreadsheet beside the tool.
      anxiety: >
        "If dependencies start moving my dates, will I still understand where a date came from?"
        Answered by the warnings this feature ships alongside: every edge that does NOT count says so,
        which is the job job-lead-see-where-the-dependency-chain-breaks.
      habit: >
        Teams already track dependencies — in the tracker, on a wall, in a risk log. The change is
        that the forecast reads them, not that anyone starts recording them.
    opportunity_score:
      importance: 5
      current_satisfaction: 0
      gap: 5
      rationale: >
        Importance: 5 — this is the product's core output, and it is computed against an assumption
        that is known to be false whenever a dependency exists. Current satisfaction: 0, not "poor":
        there is no partial workaround, because nothing in the data model can represent the constraint
        at all. Gap: 5, the joint highest in this feature.

  - id: job-forecast-covers-dependencies-that-cross-teams
    title: Count the dependency on the other team's Feature too
    persona: delivery-forecaster
    feature_context: epic-5792-dependency-aware-forecasting
    created: 2026-08-14
    note: >
      Scored separately from job-forecast-honours-what-cannot-start-yet despite sharing its importance,
      because it is the half that costs a forecasting-engine change, and separating them is what lets
      the cheaper half ship first. RunMonteCarloSimulation (ForecastService.cs:108-131) groups
      simulationResults by team and runs each group's 10,000 trials in its own Task.Run with its own
      day counter, so inside one trial of team T no other team's Features exist and no other team's
      completion day is knowable. A dependency inside one Portfolio very often crosses teams, so this
      is not an edge case — it is most of the population. Moved to
      epic-5792-dependency-aware-forecasting on 2026-08-16: "the cheaper half ships first" became an
      epic boundary rather than a slice boundary.
    job_story: >
      When the Feature I am waiting on is being built by another team, I want the forecast to account
      for it just as it would a Feature of my own, so the most common kind of real dependency stops
      being the one the tool ignores.
    dimensions:
      functional: >
        One simulation trial covers every team against a shared day clock, so a blocker on any team
        constrains its dependent on any other.
      emotional: >
        Move from "the tool handles the easy half" to trusting it with the coordination problem that
        is actually hard.
      social: >
        Make a cross-team commitment in a planning forum with a number behind it, rather than with two
        separate forecasts compared by hand in a spreadsheet.
    forces:
      push: >
        Cross-team is where dependency pain actually lives; a same-team dependency is usually visible
        to the person doing the work anyway.
      pull: >
        One forecast that spans the teams, instead of two forecasts and a manual reconciliation.
      anxiety: >
        "Does rewriting the simulation loop change every date I have already shown people?" Answered
        by the design: with no dependency present the joint loop is distribution-preserving, because
        each team only ever consumes its own simulation rows. Asserted under a fixed seed rather than
        argued.
      habit: >
        Cross-team dependencies are already managed in planning events. The change is that the
        forecast stops disagreeing with what those events concluded.
    opportunity_score:
      importance: 5
      current_satisfaction: 0
      gap: 5
      rationale: >
        Importance: 5 — same core output, and this is the majority case. Current satisfaction: 0 for
        the same reason as the job above. Gap: 5. Kept as its own job because its cost profile is
        completely different: the other half is an eligibility rule, this half is the simulation loop.

  - id: job-po-see-what-a-feature-is-waiting-on
    title: See what a Feature is waiting on without leaving Lighthouse
    persona: product-owner
    feature_context: epic-4365-dependencies
    created: 2026-08-14
    job_story: >
      When a Feature looks stalled or late, I want to see which other Features it is waiting on and
      what state they are in, so I can tell whether the wait is nearly over without opening the work
      tracking system.
    dimensions:
      functional: >
        A count on every Feature list and a dialog listing each Feature waited on, with its state, its
