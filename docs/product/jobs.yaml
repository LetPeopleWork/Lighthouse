      emotional: >
        Move from "23 items, I suppose that's good" to "23 items, and I can see four of them
        were one-line config changes" — turning a headline into something defensible.
      social: >
        Avoid quoting a throughput number in a review and being unable to answer the first
        question anyone asks about it.
    forces:
      push: >
        The number provokes "which ones?" every single time, and these two widgets are the only
        ones that answer it with nothing — the coach has to go to the throughput chart and
        reconstruct the same set from a different surface.
      pull: >
        One click on an icon the coach already uses elsewhere, reusing a dialog they already
        know, over an item set the page has already loaded.
      anxiety: >
        None material — no new data, no new query, no new permission surface; the items are the
