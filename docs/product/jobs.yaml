    job_story: >
      When I have used Lighthouse Community for a while and have opinions about what works and what
      is missing,
      I want a low-friction, anonymous way to feed them back — and to optionally raise my hand for a
      premium trial by volunteering my email,
      so I can shape the tool without exposing personal data or being nagged, and ask for a trial on
      my own terms.
    dimensions:
      functional: >
        Answer a short survey on a standalone page; submit anonymously; optionally request a trial by
        giving an email; be reachable by a respectful in-app nudge or a shared link.
      emotional: >
        Feel heard, not surveilled — anonymous by default, not nagged, and confident a non-paying
        user's opinion is genuinely wanted.
      social: >
        Contribute to a community tool I rely on and share the survey link with peers (Slack /
        LinkedIn / email).
    forces:
      push: >
        I have opinions after weeks of use but no easy, anonymous channel; existing prompts ask for
