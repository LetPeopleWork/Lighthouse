      works unchanged on an archived Delivery, whose grid is the pinned closure record.
    job_story: >
      When I am building a status report for people who never open Lighthouse,
      I want the Delivery's headline numbers and its Feature grid as one file or one paste,
      so the slide carries the tool's numbers verbatim and nothing can be mistyped between the two.
    dimensions:
      functional: >
        Copy to Clipboard and Export to CSV on the Delivery's Feature grid, producing one artifact:
        the nine header fields as key-value rows, a blank line, then the grid's visible columns in
        their current order and sort. Terminology-aware labels. Absent values render empty, never as a
        fabricated zero. Premium-gated exactly as the existing grid export.
      emotional: >
        Move from the low-grade irritation of retyping a forecast you are about to be held to, into a
        two-click step you stop thinking about.
      social: >
        Present numbers that provably match the tool — no "let me check that against Lighthouse"
        moment in the meeting.
    forces:
      push: >
        The export exists, one dialog away, on data people ask about less. Retyping a forecast is both
        slow and the single most likely place for the number leadership sees to diverge from the number
        the tool computed.
      pull: >
        Two clicks, an existing toolbar, an existing gate — the smallest possible addition that removes
        a transcription step entirely.
      anxiety: >
        "Will it export what I am looking at, or some other version of it?" — met by exporting the
        rendered grid: the visible columns, in their current order and sort, so what is copied is
        literally what is on screen. Related worry, for a tenant that renamed things: the header labels
        follow the configured Terminology rather than shipping Lighthouse's defaults into their deck.
      habit: >
        The habit is retyping, or screenshotting a table into a slide as an image nobody can read. The
        toolbar icons are already familiar from the Work Items dialog, so there is nothing new to
        learn — only somewhere new to find them.
    opportunity_score:
      importance: 3
      current_satisfaction: 1
      gap: 2
      rationale: >
        Importance: 3 — a workflow annoyance rather than a correctness problem, but it sits on the
        highest-stakes number the product produces, and manual transcription is exactly how that number
