  - id: job-config-admin-define-blocked-rules
    title: Define what "blocked" means with a flexible rule set instead of two hardcoded lists
    persona: config-admin
    feature_context: epic-5074-blocked-items
    created: 2026-06-11
    note: >
      NEW in epic-5074-blocked-items (ADO Epic #5074, promoted out of Epic #4144). The FOUNDATION job
      and slice 1 of the Epic — the user's verbatim steer: "flexible rules like we have for rule-based
      deliveries or the filtered throughput — THAT is the main point of this epic (and should be the
      FIRST slice)". Replaces the hardcoded BlockedStates + BlockedTags lists on the settings aggregate
      with a BlockedRuleSet (the EXISTING WorkItemRuleSet, ADR-013) evaluated with Include semantics — a
      matched item is blocked (mirrors DeliveryRule Include; inverse of ForecastFilter Exclude). Reuses
      RuleEvaluator<WorkItem> / WorkItemFieldProvider and the DeliveryRuleBuilder component; no new
      engine, no new operators. Field keys include additionalField.{id}, so a Jira flag custom field is
      expressible directly as a rule condition — which is how the Epic's flagged-field cleanup (removing
      the synthetic "Flagged" label special case in IssueFactory) is solved generically. Existing
      BlockedStates/BlockedTags are AUTO-MIGRATED into equivalent OR'd conditions (State equals X /
      Tags contains Y) so no admin loses config. Settings write rides the existing team/portfolio
      settings endpoint (changed contract — version-gated for CLI/MCP clients). Lighthouse-side blocked
      definition only (README L1): the rule DEFINITION is new config, the EVALUATION cadence is
      unchanged. config-admin (team-admin / portfolio-admin) gate via IRbacAdministrationService;
      non-premium (twin of the non-premium blocked-states config). Everything else in the Epic builds on
      this definition.
    job_story: >
      When my team's notion of "blocked" isn't a bare workflow state or a single tag — it's a Jira flag
      custom field, or "our Blocked state OR anything tagged dependency", or some other combination the
      two hardcoded blocked lists simply can't express —
      I want to define what counts as blocked using the same flexible rule builder I already use for
      rule-based deliveries and the forecast filter, building conditions on state, tags, or any field
      and combining them with AND/OR,
      so "blocked" means exactly what my workflow means by it — and my existing blocked-states and
      blocked-tags come across automatically as rules so I lose nothing in the change.
    dimensions:
      functional: >
        A "Blocked" rule builder in Flow Metrics Configuration (Team and Portfolio) replacing the two
        BlockedStates/BlockedTags ItemListManager lists, built on the EXISTING WorkItemRuleSet
        (Mode and/or, up to MaxRules=20 conditions, MaxValueLength=500) and the EXISTING RuleOperators
        (equals, notequals, contains, notcontains, isempty, isnotempty). Evaluated with Include
        semantics by the EXISTING RuleEvaluator<WorkItem>: a matched item is IsBlocked. Field keys are
        the fixed WorkItem fields plus additionalField.{id} (so a custom flag field is a valid
        condition). Reuses the DeliveryRuleBuilder frontend component and WorkItemRules.ts model.
        Existing BlockedStates -> `State equals <value>` and BlockedTags -> `Tags contains <value>`,
        OR-combined, auto-migrated once and shown pre-populated. Persists as BlockedRuleSet on the
        settings aggregate via the existing settings update endpoint (no new endpoint; changed contract
        version-gated for clients). config-admin write scope via useRbac(); non-premium.
      emotional: >
        Move from "our 'blocked' is a flag field the two hardcoded lists can't express, so I hack it
        with a synthetic label" to "blocked means precisely what I defined — and my old config came
        across as rules, so I lost nothing." Confidence that the blocked signal the whole team reads is
        grounded in the real workflow definition.
      social: >
        Be the admin who set blocked up so it matches what the team actually experiences as blocked —
        the rule set is self-evidently the definition, the same shape as the delivery rules colleagues
        already trust.
    forces:
      push: >
        Today "blocked" is two hardcoded lists (BlockedStates + BlockedTags) on the settings owner;
        teams whose blocked concept is a custom field or a compound condition can't express it and
        resort to hacks — e.g. the Jira "Is Flagged" path injects a synthetic "Flagged" label so it can
        be added to BlockedTags. Inflexible and special-cased.
      pull: >
        One familiar rule builder — the exact DeliveryRuleBuilder used for rule-based deliveries and the
        forecast filter — expresses any blocked definition (state, tag, field, AND/OR) and reuses an
        engine the team already trusts. Existing config migrates automatically.
      anxiety: >
        Will I lose my existing blocked-states/blocked-tags in the change? (No — D2 auto-migration:
        each becomes an equivalent OR'd rule condition, pre-populated and editable; the learning
        hypothesis is that if ANY existing config can't be represented the model isn't expressive
        enough.)
        Will rule-based blocked behave differently from the old lists for the same config? (No — the
        migrated rule set matches exactly the items the lists matched.)
        Does "blocked" now get read from Jira/ADO history? (No — README L1: blocked stays a
        Lighthouse-side computed concept; only the definition is new config.)
      habit: >
        Admins already build rule-based deliveries and forecast filters in this exact builder; defining
        blocked the same way is the same muscle memory. The only shift is that blocked is no longer two
        special lists — it's a rule set like the others.
    opportunity_score:
      importance: 5
      current_satisfaction: 2
      gap: 3
      rationale: >
        Importance: 5 — this is the FOUNDATION of the whole Epic (the user's explicit main point) and
        every other blocked signal (duration, over-time, blocked->stale, flagged cleanup) builds on the
        rule-based definition; without it the rest is hardcoded. Current satisfaction: 2 — blocked DOES
        work today via the two lists, so it's not zero, but the lists can't express custom-field or
        compound definitions and force hacks like the synthetic Flagged label. Gap: 3 — a real
        expressiveness gap, kept tractable because the rule engine, operators, evaluator, and builder
        component all already exist (ADR-013) and only need a third Include-semantics consumer plus a
        one-time config migration.

  - id: job-flow-coach-see-how-long-blocked
    title: See how long each item has been blocked, so aged blockers stop being forgotten
    persona: flow-coach
    feature_context: epic-5074-blocked-items
    created: 2026-06-11
    note: >
      NEW in epic-5074-blocked-items (ADO Epic #5074). Pays off the foundation rule-based definition:
      once blocked is computed from the rule set, capture WHEN each item enters/leaves blocked
      (Lighthouse-side per-sync, README L1, via a new WorkItemBlockedTransition entity off the existing
      WorkItemBlocked domain event + new leave-detection) and surface "blocked <N>d" per item. Today's
      blocked indicator is a snapshot with no duration, so a quietly-blocked item rots unnoticed.
      Resolution = sync cadence (approximate, surfaced in tooltip — twin of the time-in-state badge).
      Distinct from the existing job-flow-coach-spot-stuck-items (which is time-in-CURRENT-state, not
      blocked duration). Non-premium.
    job_story: >
      When I run my team's flow review and some items are blocked, the current indicator tells me WHICH
      items are blocked but not for how long, so a long-blocked item quietly rots until someone happens
      to notice it,
      I want to see at a glance how many days each item has been blocked — and have items blocked far
      too long stand out —
      so I escalate the right blockers in standup with evidence ("this has been blocked nine days")
      instead of discovering an aged blocker weeks later in a missed forecast.
    dimensions:
      functional: >
        Per work item, a "blocked <N>d" read for the item's CURRENT blocked spell (since the captured
        enter-blocked timestamp), shown alongside the existing blocked emphasis on the team/portfolio
        views. Sourced from a new WorkItemBlockedTransition capture entity populated per-sync off the
        existing WorkItemBlocked event (enter) plus new leave-detection (IsBlocked false after
        WasBlocked true; no WorkItemUnblocked event exists today). First-observation items show "—"
        until the next sync establishes a baseline; the tooltip reads "Approximate — based on sync
        cadence". Never pulled from source-of-truth (README L1). Non-premium.
      emotional: >
        Move from "I can see it's blocked but not whether that's a day or a fortnight" to "this one's
        been blocked nine days — that's today's escalation". Confidence that aged blockers surface
        themselves rather than waiting to be stumbled on.
      social: >
        Be the coach who walks into standup naming the specific aged blockers with hard durations, not
        a vague "didn't something get stuck?".
    forces:
      push: >
        Today the blocked indicator is a duration-less snapshot; "how long has this been blocked?" means
        opening the item in Jira/ADO and reading its history — high friction, so nobody does it for every
        blocked item, and aged blockers fester.
      pull: >
        One "blocked Nd" read per item on the table the coach already scans answers the question for
        every blocked item at a glance, and makes the long ones obvious.
      anxiety: >
        Will the number disagree with the source system? (Mitigated: it's Lighthouse-side per-sync
        capture, L1, surfaced as approximate — it answers "how long in OUR view" honestly rather than
        claiming source-precision.)
        What about items already blocked when the feature ships? (First-observation shows "—" until the
        next sync sets a baseline — the same honest behaviour as the time-in-state badge.)
      habit: >
        Coaches read a blocked flag today and mentally guess its age; reading a concrete duration is the
        same glance with the answer already computed.
    opportunity_score:
      importance: 4
      current_satisfaction: 1
      gap: 3
      rationale: >
        Importance: 4 — aged blockers are a direct flow risk and "how long has this been blocked?" is a
        recurring standup/flow-review question (the persona's own listed frustration: "aged blocked
        items get forgotten because the indicator doesn't say how long"). Current satisfaction: 1 — the
        duration isn't surfaced anywhere today; blocked is a snapshot. Gap: 3 — a genuine missing
        capability, kept tractable by reusing the existing WorkItemBlocked event as the enter seam and a
        thin per-sync capture entity rather than a source-of-truth integration.

