      rather than three: an edge pointing outside the Portfolio (Feature to Portfolio is many-to-many,
      LighthouseAppContext.cs:217-219, so this means "shares no Portfolio"); a blocker ranked BELOW its
      dependent, which is the epic's own "that will cause a mess"; and a loop, which the epic names as
      the thing that must never hang the forecast.
    job_story: >
      When a dependency cannot be honoured — it points outside the Portfolio, its blocker is ranked
      below it, or it forms a loop — I want to be told plainly, so I find the broken links by scanning
