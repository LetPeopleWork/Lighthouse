schema_version: '0.1'
outcomes:
- id: OUT-1
  kind: specification
  summary: Classifies an in-flight work item's age into the pace band the aging chart
    paints behind its dot, so the chart's coloured zone and the work item dialog's
    cell can never disagree.
  feature: story-5884-work-item-age-bands
  inputs:
  - shape: an item's age in days, the state it is in, the per-state age percentiles
      a team's finished work produced, and the workflow order of its Doing states
  output:
    shape: the pace band that age falls into for that state, named in the words the
      chart's coloured zone stands for, or an explicit no-history sentinel, plus the
      colour the chart paints that band
  keywords:
  - pace-band
  - work-item-age
  - percentile
  - classification
  - carry-forward
  - aging-chart
  artifact: Lighthouse.Frontend/src/utils/charts/paceBands.ts
  related: []
  superseded_by: null
- id: OUT-2
  kind: specification
  summary: Moves a metrics time window through calendar time without changing its
    length, and never lets it end after today, so a named window and a walked-back
    window are the same window seen at two moments.
  feature: story-5914-metrics-time-horizon-presets
  inputs:
  - shape: a start and end calendar day in the viewer's own zone, a step size in days
      or a named window length, and what day today is
  output:
    shape: a start and end calendar day the same number of days apart as the input
      window, ending no later than today, expressed as local calendar days rather
      than instants
  keywords:
  - date-window
  - time-horizon
  - metrics-range
  - calendar-day
  - clamp
  artifact: Lighthouse.Frontend/src/pages/Common/MetricsView/dateWindow.ts
  related: []
  superseded_by: null
- id: OUT-3
  kind: specification
  summary: Decides which of a Feature's contributing Teams get a row of their own beneath
    its bar on the Delivery timeline, what each row spans, what it is called and coloured,
    and what the Feature's bar has to say about the Teams that get none, so the split
    can never quietly show fewer Teams than the Feature has.
  feature: epic-6033-forecasted-start-dates
  inputs:
  - shape: a Delivery's Features with their per-Team forecasts, the timeline already
      built from them, the Teams the Portfolio can name, the probability being read,
      and the words this instance uses for a Team and a Portfolio
  output:
    shape: one row per contributing Team whose own start and completion both resolve
      at that probability, each carrying the Team's name and a colour stable across
      the whole chart; one named note per contributing Team that resolves at neither;
      and whether anything on this chart splits at all
  keywords:
  - team-lanes
  - delivery-timeline
  - per-team-forecast
  - contributing-team
  - colour-map
  artifact: Lighthouse.Frontend/src/pages/Portfolios/Detail/Components/DeliveryGrid/timeline/deliveryTeamLanes.ts
  related: []
  superseded_by: null
