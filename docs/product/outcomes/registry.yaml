schema_version: '0.1'
outcomes:
- id: OUT-1
  kind: specification
  summary: Classifies an in-flight work item's age into the pace band the aging chart
    paints behind its dot, so the chart's coloured zone and the work item dialog's
    cell can never disagree.
  feature: story-5884-work-item-age-bands
  inputs:
  - shape: an item's age in days, the state it is in, the per-state age percentiles
      a team's finished work produced, and the workflow order of its Doing states
  output:
    shape: the pace band that age falls into for that state, named in the words the
      chart's coloured zone stands for, or an explicit no-history sentinel, plus the
      colour the chart paints that band
  keywords:
  - pace-band
  - work-item-age
  - percentile
  - classification
  - carry-forward
  - aging-chart
  artifact: Lighthouse.Frontend/src/utils/charts/paceBands.ts
  related: []
  superseded_by: null
- id: OUT-2
  kind: specification
  summary: Moves a metrics time window through calendar time without changing its
    length, and never lets it end after today, so a named window and a walked-back
    window are the same window seen at two moments.
  feature: story-5914-metrics-time-horizon-presets
  inputs:
  - shape: a start and end calendar day in the viewer's own zone, a step size in days
      or a named window length, and what day today is
  output:
    shape: a start and end calendar day the same number of days apart as the input
      window, ending no later than today, expressed as local calendar days rather
      than instants
  keywords:
  - date-window
  - time-horizon
  - metrics-range
  - calendar-day
  - clamp
  artifact: Lighthouse.Frontend/src/pages/Common/MetricsView/dateWindow.ts
  related: []
  superseded_by: null
- id: OUT-3
  kind: specification
  summary: Decides which of a Feature's contributing Teams get a row of their own beneath
    its bar on the Delivery timeline, what each row spans, what it is called and coloured,
    and what the Feature's bar has to say about the Teams that get none, so the split
    can never quietly show fewer Teams than the Feature has.
  feature: epic-6033-forecasted-start-dates
  inputs:
  - shape: a Delivery's Features with their per-Team forecasts, the timeline already
      built from them, the Teams the Portfolio can name, the probability being read,
      and the words this instance uses for a Team and a Portfolio
  output:
    shape: one row per contributing Team whose own start and completion both resolve
      at that probability, each carrying the Team's name and a colour that does not
      change with the probability; one named note per contributing Team that does not
      resolve at both ends, including one that resolves at exactly one of them; the
      single Team a Feature has to itself, for its own bar to wear; every Team carrying
      a colour, for the key beside the chart; and whether showing the Teams would change
      anything here at all
  keywords:
  - team-lanes
  - delivery-timeline
  - per-team-forecast
  - contributing-team
  - colour-map
  artifact: Lighthouse.Frontend/src/pages/Portfolios/Detail/Components/DeliveryGrid/timeline/deliveryTeamLanes.ts
  related: []
  superseded_by: null
- id: OUT-4
  kind: specification
  summary: Judges which of the sampling windows a Forecast Reality Check tried held
    up against what the Team then actually finished. A window holds up when its 95%
    forecast held in more than half of the checks that ran for it, and finishing more
    than forecast never counts against it. The verdict is decided in this order - not
    enough evidence when no window had a check that ran, all windows alike when every
    window held up, no window sound when none did, and otherwise some windows sound.
    Each confidence level reads as not evaluated when nothing ran, never held or always
    held only when its own rate predicted at least one check going the other way, and
    sometimes held otherwise.
  feature: epic-4172-forecast-backtest-sweep
  inputs:
  - shape: the sampling window lengths tried, every check's forecast at each confidence
      level with whether enough history existed to run it and what was actually finished,
      the Team's current window length, and whether the Team forecasts from fixed dates
  output:
    shape: the windows that held up, the windows no check could evaluate, the overall
      determination, where the Team's current window stands among them or why it was
      not tested, and per confidence level how often it held against how often it should
      have, with its reading
  keywords:
  - reality-check
  - back-test
  - sampling-window
  - forecast-verdict
  - confidence-level
  artifact: Lighthouse.Backend/Lighthouse.Backend/Services/Implementation/Forecast/RealityCheckVerdictPolicy.cs
  related: []
  superseded_by: null
- id: OUT-5
  kind: operation
  summary: 'Judges a CI test-timings file against a fixed per-stack time budget: frontend
    tests are summed per file, backend tests per class (the full name before the last
    dot once the argument list is removed). A unit on the allowlist is held to its
    own ceiling instead, and every allowlist entry must carry a reason and a ceiling.
    A unit over its limit, or an allowlist entry whose file is gone from the run (frontend)
    or whose class is gone from the test source (backend), fails the check; with warn-only
    a unit over its limit becomes a warning and the check passes, a stale entry still fails. A missing, empty or malformed
    timing file or allowlist fails closed in every mode.'
  feature: story-6302-ci-test-time
  inputs:
  - shape: the stack (frontend or backend), a test-timings CSV with the converters'
      columns, a budget-and-allowlist JSON with one section per stack (budget seconds;
      entries of unit, reason, ceiling seconds), for the backend the test source tree,
      and whether breaches only warn
  output:
    shape: 'exit 0 when every unit is within its limit (or warn-only), 1 when a unit
      is over its budget or ceiling or an allowlist entry is stale, 2 when an input
      cannot be read or trusted; one GitHub annotation line per finding (::error::
      or ::warning::) naming the unit, its seconds, the limit and the allowlist file'
  keywords:
  - test-time-budget
  - ci-gate
  - allowlist
  - timing-csv
  - fail-closed
  artifact: Scripts/test-timings/check_budget.py
  related: []
  superseded_by: null
