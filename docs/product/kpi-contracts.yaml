      Slice-04 introduced EXACTLY ONE new survivor and it is now killed. Every other survivor is
      byte-identical to the slice-03b baseline: the DemoPercentilesBackfillHandler cluster, two DTO
      ToString mutants, and five NoCoverage entries - TWO of which are a Stryker INSTRUMENTATION
