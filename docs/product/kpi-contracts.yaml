      `series ?? []` in render paths that only run when the chart is not rendered.
      Slice-04 MEASURED 2026-07-26: BE 90.14% (Stryker.NET - 192 killed / 16 survived / 0 timeout) +
      FE 94.08% (Stryker - 159 killed / 10 survived). Both well above the 80% gate and both the epic's
