      sibling `!Enum.IsDefined(type)` negation on the same guard is KILLED, which is only possible if
      both branches are exercised. Recorded so a future reader does not "close" a coverage gap that is
      not there.
      THE ONE NEW SURVIVOR, and why it was a real contract rather than an equivalent mutant: removing the
      `return` from the `Status != BaselineStatus.Ready` guard in RecordMetricType survived, because every
      not-ready path in production ALSO zeroes the triple (BaseMetricsService stamps
      Average = UNPL = LNPL = 0 alongside BaselineInvalid), so the ready-but-zero gate added in 04-01
