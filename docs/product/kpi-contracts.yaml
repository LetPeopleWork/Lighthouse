      encode different claims: Status is authoritative regardless of the numbers, so a chart reporting
      "not ready" while carrying a live band must still write nothing, or a future chart builder that
      stamps a not-ready status beside computed values would silently start recording limits the owner
      was told were not ready. Killed by TeamDataRefreshed_NotReadyChartCarryingALiveBand_WritesNoRow
