  # --- epic-5427-percentiles-over-time (DEVOPS wave, appended 2026-07-23) ---

  - id: OUT-5427-recording-idempotency
    feature: epic-5427-percentiles-over-time
    title: Exactly one snapshot row per (owner, metric, horizon, calendar day)
    target: "Under repeated same-day refresh, row count per natural key == 1 (no duplicates, latest-write-wins)"
    measurement_scope: vendor_demo_only   # backend integration test in CI is the observable population
    measured_by: >
      Backend integration test (NUnit + EF InMemory) asserting that N same-day refreshes leave exactly one
      PercentilesOverTimeSnapshot / ProcessBehaviorSnapshot row per (OwnerId, OwnerType, MetricType, Horizon?, RecordedAt).
    measurement_window: every CI run (ci_verifysqlite + ci_verifypostgres)
    rationale: "US-02 AC2 / DDD-5. Idempotency is structural (upsert on the unique natural-key index) — the test guards the invariant, incl. the Postgres provider's real unique constraint."
    instrumentation_status: >
      Slice-01 (CT) MEASURED 2026-07-24: VERIFIED green. The Slice01 integration + recording-handler unit
      tests assert exactly one PercentilesOverTimeSnapshot row per (OwnerId, OwnerType, MetricType=CycleTime,
      Horizon, RecordedAt) under same-day double-refresh (EF InMemory) + the real Postgres-container migration
      test exercises the unique constraint.
      Slice-02 (WIA) MEASURED 2026-07-25: VERIFIED green - the invariant now holds for BOTH families.
      Correction to the slice-01 forward note: WIA does NOT persist Horizon=NULL. It persists the sentinel
      PercentilesOverTimeSnapshot.NoHorizon = 0, because SQL NULLs are distinct (a NULL horizon defeats the
      unique index, so WIA would accrue a duplicate row per refresh) and EF translates `Horizon == param` to
      `Horizon = @p`, which never matches NULL (the upsert would silently INSERT instead of UPDATE). With the
      sentinel the same unique index and the same single upsert predicate serve CT and WIA identically - no
      IS NULL branch, no schema change, no migration. Pinned by Slice02WorkItemAgePercentiles* specs +
      PercentilesOverTimeRecordingHandlerTests (same-day double-refresh leaves exactly one WIA row).
      Slice-03 (Throughput PBC) SHIPPED 2026-07-26 (ADO #5548, 2d6c73690..3377c038b): ProcessBehaviorSnapshot
      joins this invariant. Second table, second repository, second recording handler, and a REAL additive
      EF migration on both providers - the pipeline SHAPE is reused (same two refresh events, same
      upsert-per-day natural key, same per-family failure containment) but the code is new because the
      Unpl/Average/Lnpl triple is a different row shape from the four-percentile row (ADR-106). Its
      natural key drops the Horizon dimension: (OwnerId, OwnerType, MetricType, RecordedAt).
      NOTE ON EVIDENCE (recorded 2026-07-26 during slice-03b close-out, because slice-03's own finalize
      never ran): slice-03 step 03-06 included a mutant-killing pass, but no score was written down at
      the time. What IS on record: the slice-03b Stryker run (2026-07-26) mutates the whole epic-5427
      surface, so it covered ProcessBehaviorSnapshot, its repository, ProcessBehaviorSeriesQuery,
      ProcessBehaviorRecordingHandler and ProcessBehaviorSnapshotDto at 89.86% overall with a single
      survivor across those files (the DTO's ToString string mutation). Slice-03 did NOT receive an
      adversarial review - the slice-03b review covered only 093a31bce..HEAD.
      Slice-04 (remaining five PBC families) MEASURED 2026-07-26 (ADO #5549, e61d0b47a..1cfe48ad0):
      VERIFIED green, and the invariant now holds for ALL SIX process-behaviour families. The natural key
      already carried the family dimension, so no key or index change was needed - six families upsert
      independently and a same-day re-refresh still leaves exactly one row per (owner, family, day),
      pinned in ProcessBehaviorRecordingHandlerTests. NO EF migration: the five new families are VALUES
      in the existing ordinal column, not schema. What had to be handled instead is the enum-ordinal
      hazard - members appended at the end, and every one of the six ordinals is now pinned
      member-by-member (the slice-03 one-member guard was retired BY DESIGN, its invariant absorbed).
      STRENGTHENED by a new precondition: the ready-but-zero honesty gate. XmRCalculator returns a fully
      collapsed band (Average = UNPL = LNPL = 0) for an empty or all-zero baseline while every chart
      builder still stamps Status = Ready, so without a gate the recorder would persist a fake triple
      that a chart would plot as three flat zero lines. The recorder now refuses
      `Average == 0 && UpperNaturalProcessLimit == 0`. LowerNaturalProcessLimit is DELIBERATELY excluded:
      the calculator clamps a negative LNPL to zero for zero-bounded data, so a real busy process
      routinely reports Lnpl == 0. The chart builders were NOT changed (that would alter six shipped
      point-in-time widgets app-wide) - maintainer decision 2026-07-26.
    alerting:
      - condition: "same-day double-refresh test asserts row count != 1"
        action: "CI fails (red)"

  - id: OUT-5427-recording-failure-isolation
    feature: epic-5427-percentiles-over-time
    title: Recording failure never breaks the metrics refresh path and is observable
    target: "A forced recording-handler exception leaves refresh green AND emits a structured recording-failed log event"
    measurement_scope: per_instance   # structured Serilog event in the operator's own logs
    measured_by: >
      Backend AT forcing a handler exception, asserting: (a) the refresh completes green, (b) a structured
      Serilog recording-failed event is emitted. Per_instance: operators see the event in their own logs.
    measurement_window: every CI run + per_instance (operator logs)
    rationale: "US-02 AC4 / DDD-6. The Epic 5121 dispatcher SWALLOWS handler errors, so the handler owns its own observability — it must not rely on the dispatcher surfacing the failure."
    instrumentation_status: >
      Slice-01 (CT) MEASURED 2026-07-24: VERIFIED green. PercentilesOverTimeRecordingHandler unit test forces
      a handler exception and asserts (a) the refresh path completes green, (b) a structured Serilog
      recording-failed Error event (OwnerId, OwnerType, MetricFamily=Percentiles, Exception) is emitted from
      the handler's own try/catch.
      Slice-02 (WIA) MEASURED 2026-07-25: VERIFIED green and STRENGTHENED. Failure containment is now
      per metric family - each family's loop runs in its own inner try/catch inside the outer per-owner one,
      so a throwing WIA read no longer unwinds the CT rows already staged for the shared Save(). Both the
      success and the exception path are now test-pinned to still run the `finally { invalidateReadCache() }`
      guard. MetricFamily stays the FAMILY literal "Percentiles" for both CT and WIA (a first pass logged
      metricType.ToString(); adversarial review raised it as the slice's single BLOCKER because per-type
      values fragment one operator alert into several - fixed in 724099f32). Canonical shipped template:
      "Percentile snapshot recording failed for {OwnerType} {OwnerId} ({MetricFamily})" - the DESIGN-wave
      draft said "Percentile/PBC ..."; the two-handler decision means the PBC recorder emits its own message,
      so the shipped string is canonical (ADR-107 Amendment slice-02).
      Slice-03 (Throughput PBC) SHIPPED 2026-07-26: ProcessBehaviorRecordingHandler carries its OWN
      failure-isolation contract rather than sharing the percentiles one - it emits its own message with
      MetricFamily=ProcessBehavior, so an operator alert on the percentile family and one on the
      process-behaviour family stay separable (the same reasoning that made MetricFamily a family literal
      rather than a per-metric-type value in slice-02). Two handlers on the same two refresh events means
      one family throwing cannot discard the other's staged rows.
      Slice-03b (2026-07-26) added NO failure mode here: it is read-path only, and a bad date window is a
      400 to the caller, not a swallowed background failure. Recording is untouched.
      Slice-04 MEASURED 2026-07-26: VERIFIED green with FIVE more families inside the containment.
      The per-type inner try/catch slice-03 built ahead of time ("so that a later type failing cannot
      discard the rows an earlier type already staged") now has six families passing through it and is
      exercised with them. MetricFamily stays the family literal "ProcessBehavior" for all six - it is
      deliberately NOT the metric type, so an operator alert on process-behaviour recording stays ONE
      alert rather than fragmenting into six (same reasoning as slice-02 on the percentiles side).
      One structural note: the reader arrays differ by scope (TeamReaders = 5 families,
      PortfolioReaders = 6; Feature Size is a portfolio concept, D8, and there is no team-side read
      method to call). Dropping a line from either array is a silent capability loss that no exception
      would ever surface, so the handler tests assert the exact family SET each scope produces, not
      merely that the set contains a given family.
      STILL OPEN - the [Forge med] OPERATOR MONITORING PROCEDURE. The structured recording-failed event
      schema is canonical in the ADR-107 slice-02 amendment, but the log-scan guidance and alert rule
      were never written into an ops/runbook page. Deferred at slice-02 to "epic completion"; the epic
      completed at slice-04 and this is still open. It is now the epic's single outstanding DEVOPS
      action item and the one gap between "the event is emitted" and "an operator will notice it".
    alerting:
      - condition: "recording-failure AT shows refresh broken OR no structured event emitted"
        action: "CI fails (red)"

  - id: OUT-5427-empty-state-honesty
    feature: epic-5427-percentiles-over-time
    title: An empty over-time series always says WHY it is empty, and never renders a broken axis
    target: >
      0 over-time charts render a broken/empty axis on a fresh (zero-snapshot) team or portfolio, AND
      0 charts claim "no snapshots recorded yet" when the only reason the series is empty is that the
      selected date range ends before recording began (slice-03b, D10/DDD-13)
    measurement_scope: vendor_demo_only   # E2E on a zero-snapshot owner is the observable population
    measured_by: >
      Playwright E2E on a zero-snapshot owner asserting the D6 empty-state copy ("builds forward from
      today — no snapshots recorded yet") for both widgets, never a broken chart; plus, from slice-03b,
      a Playwright E2E on a POPULATED owner narrowed to a window that ends before today asserting the
      in-range copy ("no data recorded in the selected range") instead.
    measurement_window: every ci_e2e run
    rationale: "US-01 AC4 / D6, extended by US-06 AC5/AC6 / DDD-13. Forward-only recording means fresh owners have no history; a range-scoped chart means an empty series has two different honest explanations and must give the right one."
    instrumentation_status: >
      Slice-01 (CT) MEASURED 2026-07-24: VERIFIED green for the "Percentiles Over Time" widget. A zero-snapshot
      owner's percentiles-over-time GET returns an empty array and the widget renders the D6 honest empty-state
      copy, never a broken axis (walking-skeleton E2E + FE widget test).
      Slice-02 (WIA) MEASURED 2026-07-25: VERIFIED green for the Age tab too. New @edge Playwright scenario
      drives a fresh NON-demo team (the demo backfill deliberately populates every demo owner, so an honest-
      empty assertion on demo data would be structurally impossible) and asserts the copy verbatim via the
      exported PERCENTILES_OVER_TIME_EMPTY_COPY constant, so a copy change fails loudly. Backend counterpart:
      Slice02WorkItemAgePercentilesSpecifications.ThenTheSeriesIsEmpty asserts 200 + empty array, never an
      error or a zero-padded series.
      Slice-03 (Throughput PBC) MEASURED 2026-07-26: the first clause now CLOSES for both widgets. The
      "PBC Over Time" widget shipped with the same honest-empty contract, driven by an @edge Playwright
      scenario on a fresh NON-demo team (the demo backfill populates every demo owner, so an honest-empty
      assertion on demo data is structurally impossible) asserting the copy verbatim via the exported
      PBC_OVER_TIME_EMPTY_COPY constant, plus zero chart lines and no legend - never a broken axis.
      Slice-03b (date range) MEASURED 2026-07-26: VERIFIED green for the second clause, with ONE stated
      exception (below). The discriminator is the selected range's END, not "narrowed vs default" - the
      dashboard has no unfiltered state, its default IS a 30-day (team, per the team's dateRange setting)
      / 90-day (portfolio) window, so every request the UI makes is a narrowed one. Range ends
      today-or-later + empty => the unchanged forward-only copy (the path the two shipped E2Es drive, and
      they still pass verbatim); range ends before today + empty => the in-range copy. Pinned by a new
      @edge Playwright scenario per widget that narrows a POPULATED demo owner to [today-60, today-45] -
      entirely before the backfill's [today-14, today-1] - plus widget tests for both variants and
      overTimeEmptyState.test.ts for the ends-today boundary (00:00 and 23:59 both keep the forward-only
      copy, so the comparison is by calendar day and not by instant). Deliberately NOT solved with a
      response envelope or a second unfiltered request - ADR-108 rejects envelopes (see its slice-03b
      amendment).
      EXCEPTION, not verified: on a RELOADED / bookmarked / shared link outside UTC the widget can pick
      the WRONG sentence. BaseMetricsView writes the startDate/endDate URL params via toISOString (UTC)
      and reads them via new Date("YYYY-MM-DD") (also UTC), while the request is built from local date
      parts - a round-trip loses one day in either direction and only offset 0 survives. An empty series
      then reads the in-range copy where this KPI requires the forward-only one. Root cause predates
      epic-5427 and shifts the window for every date-ranged widget; left out of slice-03b by maintainer
      decision (2026-07-26) and to be filed as its own bug. CI runners are UTC, so the gate does not
      catch it.
      KNOWN DEFECT against this KPI's second clause (was previously written up here as an accepted
      edge - that was wrong): an owner whose snapshots ALL predate a window that still ends today reads
      the forward-only copy, i.e. claims "no snapshots recorded yet" for an owner with months of
      history. Reachable in an ordinary way - a team whose work-tracking connection broke more than
      defaultDateRange days ago stops recording but keeps every snapshot - so the earlier reasoning
      ("a refreshing instance cannot do that") only covered instances still refreshing THAT owner.
      Closing it needs a has-any-history signal on the response or a second request, both of which D10
      and ADR-108 rejected; tracked as follow-up.
      Slice-04 MEASURED 2026-07-26: VERIFIED green PER FAMILY, and the KPI gained a new way to fail that
      is now closed. The @edge fresh NON-demo team scenario selects a SECOND family (WorkItemAge) and
      re-asserts PBC_OVER_TIME_EMPTY_COPY verbatim plus zero chart lines and no legend - that team is the
      only deterministic fixture for this, because on the demo team today's refresh records a row for
      every family. The new failure mode: a family whose baseline is empty or all-zero. XmRCalculator
      returns Average = UNPL = LNPL = 0 for it and the chart builder still stamps Status = Ready, so
      before slice-04 the recorder would have persisted that triple and the widget would have plotted
      three flat zero lines - a chart asserting a process where there is none, which is exactly the
      dishonesty this KPI exists to prevent, in a shape neither of the two empty-state sentences covers.
      The recorder's ready-but-zero gate refuses it, so the widget falls through to the honest empty copy
      instead. The toggle-switch E2E additionally rejects a THIRD state explicitly: it polls for
      "plotted" (three lines) or "honestly empty" (the copy) and fails on anything else, so a chart
      region with fewer than three lines AND no empty copy cannot pass unnoticed.
      DEMO-DATA LIMITATION, deliberate (maintainer decision 2026-07-26, ADR-109 slice-04 amendment):
      DemoPercentilesBackfillHandler still backdates Throughput ONLY, so on demo data the five newer
      families render the honest forward-only copy until a day accrues. That is correct under D6 and not
      a broken chart, but it does mean milestone-4's "three dated lines are plotted" cannot be asserted
      through the browser for any non-Throughput family; that assertion lives at the read port
      (Slice04ProcessBehaviorMetricTypesScenarios.cs) and PbcOverTime.spec.ts carries an explicit comment
      at the point the UI assertion is NOT made. Users are told: docs/metrics/predictability.md now
      states the demo backfill covers Throughput only.
      The two open items above (the UTC round-trip EXCEPTION and the all-history-predates-window KNOWN
      DEFECT) are UNCHANGED by slice-04 and remain open at epic close.
    alerting:
      - condition: "zero-snapshot E2E finds a rendered-but-empty/broken axis instead of the empty-state copy"
        action: "CI fails (red)"
      - condition: "narrowed-past-window E2E finds the forward-only copy instead of the in-range copy (or vice versa on the default window)"
        action: "CI fails (red)"

