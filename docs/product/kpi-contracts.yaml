      Slice-03b MEASURED 2026-07-26: BE 89.86% (Stryker.NET) + FE 92.76% (Stryker), both >= 80%. PASSED.
      First pass was BE 88.41%; three survivors were real gaps in the inverted-window guard (an EQUAL bound
