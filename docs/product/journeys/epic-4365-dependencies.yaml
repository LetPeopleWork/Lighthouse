schema_version: 1
feature_id: epic-4365-dependencies
updated: 2026-08-16
note: >
  ADO Epic #4365 "Show Feature Dependencies", created 2026-02-23, tagged Documentation / Release
  Notes. SPLIT 2026-08-16: the forecasting half became ADO Epic #5792 "Dependency-Aware Forecasting"
  (docs/product/journeys/epic-5792-dependency-aware-forecasting.yaml, premium). This epic is the
  community half and ships first — read dependencies from the tracker, show them, warn about the ones
  Lighthouse cannot act on, and let a Portfolio name the field they live in. Nothing here moves a
  forecast date, and that is asserted rather than assumed.

  D2, D3, D8's drop-half and D9's premium behaviour moved with the split; the decisions below are the
  ones this epic still owns. Epic #5792 inherits D1, D5, D6, D7, D10, D12, D13 and D14 from here
  unchanged.
  The description was a sketch; this journey is the result of the DISCUSS dive-in on 2026-08-14 and is
  grounded in a pre-DISCUSS code reality check (ForecastService.cs, Feature.cs, WorkItemBase.cs,
  FeatureOrdering.cs, FeatureComparer.cs, ManualRankComparer.cs, FeatureRepository.cs, FeatureDto.cs,
  FeaturesController.cs, IWorkTrackingConnector.cs, AzureDevOpsWorkTrackingConnector.cs +
  WorkItemExtensions.cs, JiraWorkTrackingConnector.cs, LinearWorkTrackingConnector.cs,
  WorkTrackingSystemOptionsOwner.cs, FeaturesView.tsx, FeatureListDataGrid/columns.tsx,
  WarningsIndicator.tsx, useLicenseRestrictions.ts, TerminologyKeys.ts).

  Four load-bearing finds the sketch did not carry. Two others — that "jump over" is not a date shift,
  and that the per-team independent simulation loop makes cross-team dependencies unreachable — moved
  to Epic #5792, which is where the code they describe is changed.

  (1) TERMINATION is the binding constraint on the epic as a whole. A cycle, or a blocker whose team
  has no throughput, means the dependent is never eligible and while (GetRemainingItems() > 0) never
  ends. D7 and D8 exist to prevent a hang, not to be tidy. Detection and the warning land HERE, one
  epic before anything consumes them, which is the cheapest place to get the vocabulary wrong.

  (2) The surface already exists and was built for this. Epic #5375's D17 says in as many words that
  the general Features view is "the surface that will later host ADO Epic #4365 'Dependencies'". The
  warnings column the epic asks for is WarningsIndicator.tsx. This epic writes a column and a dialog.

  (3) "Blocked" is already taken. Epic #5074 shipped WorkItem.IsBlocked / BlockedSince, and
  TerminologyKeys.ts:18 makes `blocked` renameable. The UI word here is "depends on" (D10).

  (4) Only three connectors have a standard field, and they return three different shapes. ADO already
  requests WorkItemExpand.Relations on the parent path (:1043) but its relation URL carries an id and
  no title; Jira sends an explicit fields= list that must gain issuelinks, and returns the summary
  inline; Linear returns titles inline via GraphQL. ServiceNow and CSV have no such field at all.

journeys:

  - name: see-what-a-feature-is-waiting-on
    goal: >
      A product owner reading a Feature list can tell, without opening the work tracking system, what
      each Feature waits on and which of those links Lighthouse will not be able to act on — and a
      configuration admin whose teams keep dependencies in a custom field can point Lighthouse at it
      once, for the whole Portfolio.
    persona: "product-owner (primary: reads the column and the dialog while planning); delivery-lead-rte
      (scans a Portfolio for the edges Lighthouse cannot act on); config-admin (names the field that
      carries dependencies, once per Portfolio)"
    jobs:
      - job-po-see-what-a-feature-is-waiting-on
      - job-lead-see-where-the-dependency-chain-breaks
      - job-config-admin-point-at-the-field-that-carries-dependencies

    emotional_arc:
      start: >
        Blind — "nothing in Lighthouse knows that this Feature cannot start until the platform team
        finishes theirs. The fact exists, in the tracker, one context switch away that nobody makes
        while reading a forecast. I find out in the stakeholder review."
      middle: >
        Oriented — "the column says it waits on two. One of them is done, the other is in progress on
        another team. And the warning tells me the third link points outside this Portfolio, so it is
        not something the forecast will ever act on."
      end: >
        In control — "I can see every dependency my teams recorded, wherever they recorded it, and
        every one Lighthouse cannot act on says so and says why. Whether the dates account for them is
        the next epic's question, and it is now a question I can ask."

    design_decisions_resolved:
      - id: D1
        question: What grain carries a dependency?
        decision: >
          Features only, as a directed "cannot start until" edge. Straight from the epic. Work-item
          dependencies have no consumer, because the simulation sequences Features — the same argument
          epic-5375 used to keep manual ordering at Feature grain.
      - id: D2
        question: How does the forecast honour a dependency?
        decision: >
          MOVED to epic-5792-dependency-aware-forecasting on 2026-08-16. Recorded here only because it
          is why nothing in this epic touches ForecastService: the mechanic is one predicate at one
          call site, and putting half of it here would spread one decision over two epics.
      - id: D3
        question: How are dependencies that cross teams handled?
        decision: >
          MOVED to epic-5792-dependency-aware-forecasting on 2026-08-16 — one joint simulation replaces
          the per-team independent runs. It is the change that carries essentially all of the original
          epic's technical risk, and separating it is what lets this half ship without it.
      - id: D4
        question: Where does a dependency come from?
        decision: >
          The work tracking system, always. Lighthouse never authors one (user, 2026-08-14). The
          default source is the standard link per connector; a Portfolio may override WHICH FIELD
          carries them, in the exact shape of ParentOverrideAdditionalFieldDefinitionId
          (IWorkItemQueryOwner:27) — once per Portfolio. When the override is set the connector skips
          the relation fetch entirely, copying the early return at
          AzureDevOpsWorkTrackingConnector.cs:1014-1018.

          A per-Feature declaration made inside Lighthouse was considered and rejected: it would make
          Lighthouse an author of dependency data, which is a different posture from the one it takes
          everywhere else, and it would need a precedence rule against the tracker that this one does
          not. To change a dependency, change it in the tracker.
      - id: D15
        question: How does one field express a LIST of dependencies, and what is in it?
        decision: >
          Split on comma or semicolon, trim, resolve each entry, skip entries that resolve to nothing
          while keeping the rest. This is the only genuine difference from the parent override, which
          is 0..1 and can return a single string (GetParentReference, :1095-1106).

          An entry is a reference in the connector's OWN form (user, 2026-08-14) - Jira keys on Jira,
          work item ids on ADO, identifiers on Linear. That is exactly ReferenceId space, so no
          per-tracker normalisation layer is owed; the only transformation left is Linear's
          lower-casing (D14).

          Skipping rather than failing matters because a hand-maintained text field will contain
          typos, and one typo must not discard the three good references beside it. Separator fixed,
          not configurable.

          REPLACE, NOT UNION (user, 2026-08-14): a Portfolio that names a field declares it
          authoritative, and native links are not read for that Portfolio while it is set. Owner is
          the PORTFOLIO only, not the Team, even though IWorkItemQueryOwner is implemented by both -
          Features are fetched per Portfolio, so a Team-level setting would have no consumer.
      - id: D5
        question: Where is the dependency stored?
        decision: >
          A Feature stores the LIST OF REFERENCES it waits on, resolved when read — not a resolved
          Feature-to-Feature foreign key (user, 2026-08-14, correcting the wave's first draft). The
          stored form is strings in the same space as ReferenceId, exactly as
          WorkItemBase.ParentReferenceId already works.

          The reason is sync order: if Feature B references A and A has not been imported yet, a
          resolved foreign key cannot be written at all and the link silently does not exist until a
          later sync happens to fix it. A stored reference heals on its own. The graph the simulation
          and the cycle detector want is derived at read time.

          Its own persisted collection, never a synced scalar — WorkItemBase.Update overwrites every
          synced field on every refresh, which is exactly why Feature.ManualRank sits outside it. One
          writer: the sync's reconcile, replacing a Feature's references wholesale with whatever the
          current source — link or override field — now says.
      - id: D6
        question: How far does a dependency reach?
        decision: >
          The forecast honours it only when both Features share at least one Portfolio (Feature to
          Portfolio is many-to-many). An edge pointing outside is detected, stored, shown and warned —
          never silently dropped, never forecast. The epic's own reasoning: a Portfolio's forecast
          should not depend on Features its viewers may not be able to read. Everything in that
          sentence except the forecast consequence is delivered here; the consequence itself is
          epic-5792's, and is a no-op until that epic ships.
      - id: D7
        question: What happens to a dependency loop?
        decision: >
          The edge that closes the loop is excluded from the honoured set and every member is warned,
          naming the others. DESIGN refined WHERE this runs: inside the one honour policy rather than
          at ingestion, because a stored cycle flag would be a second source of truth for half of a
          verdict that also depends on the licence and the ordering (F-5).

          Under D2 this is a termination guarantee: a cycle means no member is ever eligible, so the
          simulation's while loop never ends. It lands in THIS epic, one epic before anything consumes
          it, which is the cheapest place to get it wrong, and it keeps the trial loop free of any
          cycle logic at all.
      - id: D8
        question: What happens when the blocker can never complete in this run?
        decision: >
          The edge is dropped for that run and the dependent is warned. Three cases, one rule: a
          blocker already finished has no SimulationResult row and costs nothing; a blocker whose team
          has no throughput is excluded from the run entirely; a blocker outside the run's Feature set
          likewise never completes. The last two would otherwise make the dependent wait forever.

          Split 2026-08-16: this epic ships the VERDICT and the WARNING, computed from the existing
          Feature.CanBeForecast / TeamsWithoutForecast. Epic #5792 ships the DROP, which is the half
          that keeps the loop terminating. Stating the verdict early is what settles the warning
          vocabulary before any simulation depends on it.
      - id: D9
        question: What does the premium licence gate?
        decision: >
          The forecast effect, and nothing else. After the 2026-08-16 split this is an epic boundary
          rather than a licence branch: EVERYTHING in epic-4365 is free, with no licence check anywhere
          in it, and everything premium is in epic-5792. Detection, the count, the dialog, the warnings
          and the Portfolio's dependency-field setting are all free — the field setting because it is
          what makes detection work at all on an instance whose tracker does not use standard links,
          and gating it would gate the free half behind a licence.

          The "not taken into account in the forecast" hint travels with epic-5792, because a hint
          naming a capability nobody can buy yet is worse than no hint. Same posture as epic-5375:
          show the truth, gate the mechanism.
      - id: D10
        question: What is this called in the UI?
        decision: >
          "Depends on", never "blocked". TERMINOLOGY_KEYS.BLOCKED and WorkItem.IsBlocked already name
          epic-5074's shipped concept, and `blocked` is renameable per instance — two meanings of one
          renameable word on the same row is a defect in waiting. Feature / Features / Portfolios /
          Work Items resolve through getTerm as everywhere else. ADO's "Predecessor" and Jira's "is
          blocked by" are read, not shown.
      - id: D11
        question: Where does the UI live?
        decision: >
          Two EXISTING surfaces: the instance-wide Features view built by epic-5375's D17 for exactly
          this, and the existing Portfolio detail Feature list — both through the shared
          FeatureListDataGrid and its columns factory, so the column is written once. The "which items
          do we depend on" list is a dialog off the row. No new page.
      - id: D12
        question: What if the blocker is ranked BELOW its dependent?
        decision: >
          A warning, never an auto-reorder. The epic's "ordered lower will cause a mess". The forecast
          still honours the edge and still terminates — the dependent is skipped, capacity flows past
          it, the blocker eventually completes. So the situation is counter-intuitive rather than
          broken, and the warning is what explains why the board disagrees with the stated priority.
          Ordering stays the user's decision, which is epic-5375's whole premise.
      - id: D13
        question: Which connectors?
        decision: >
          ADO first, then Jira and Linear. ServiceNow and CSV are OUT - no standard dependency field
          exists in either.

          They are ALSO not rescued by D4's field override, which is the obvious counter-argument and
          was checked during this wave: every connector supports additional fields, so the mechanism
          looks available to them, but ServiceNowWorkTrackingConnector.GetFeaturesForProject throws
          NotSupportedException (:751-757). ServiceNow has no Features, so it has nothing for a
          dependency to be BETWEEN - a dependency is Feature-to-Feature (D1) and Features live in
          Portfolios (D6). The override changes where a reference is read from; it does not create the
          objects the reference points at. Written down so the argument is not re-made.
      - id: D14
        question: Which direction is fetched, and what exactly is stored?
        decision: >
          Only "waiting on", extracted into ReferenceId space (D5) per connector:
          ADO reads relation System.LinkTypes.Dependency-Reverse and takes the trailing segment of the
          relation URL, because ReferenceId is $"{workItem.Id}" (:870).
          Jira reads issuelinks where type.inward = "is blocked by" AND an inwardIssue is present, and
          takes inwardIssue.key verbatim, because ReferenceId is issue.Key (:1348).
          Linear reads the dependencies connection and takes identifier LOWER-CASED, because
          ReferenceId is issue.Identifier?.ToLowerInvariant() (:343).

          The Linear lower-casing is the trap in this feature: the connection returns identifiers
          upper case and the connector stores them folded, so without the fold every Linear reference
          resolves to nothing — silently, because D15 skips unresolvable entries by design. It fails
          as "Linear simply has no dependencies", indistinguishable from the truth, so it carries its
          own acceptance criterion.

          The reverse direction is derived by inverting stored references rather than fetched, which
          would double the request cost to learn something already held.

    shared_artifacts:
      - name: dependency edge
        source_of_truth: >
          The new persisted relation (D5), with exactly ONE writer: the sync's reconcile. There is no
          second writer anywhere in the product, because Lighthouse never authors an edge (D4). Never
          written by WorkItemBase.Update.
      - name: honour-ability verdict
        source_of_truth: >
          One decision point (D6, D7, D8 combined), WRITTEN here and consulted by the warnings. Once
          epic-5792 ships, its simulation's eligibility rule reads the same one. Two independent
          implementations — one for display, one for the forecast — is the failure mode the "exactly
          one place decides" KPI exists to catch, because it would show a warning that does not match
          what the dates actually did. The split makes that KPI span two epics.
      - name: Feature order
        source_of_truth: >
          IFeatureOrdering, owned by epic-5375. Read here for the ranked-below warning. Never written
          by this feature.

    error_paths:
      - trigger: A dependency points at a Feature in no shared Portfolio
        recovery: >
          Stored and shown with a warning naming the other Feature and stating it is not included in
          the forecast. No date changes.
      - trigger: Dependencies form a loop
        recovery: >
          The closing edge is excluded from the honoured set and every member is warned, naming the
          others. Loops are only ever discovered in data — there is no in-Lighthouse declaration to
          refuse, because Lighthouse never authors an edge (D4).
      - trigger: The blocker's team has no throughput, or the blocker is absent from a forecast run
        recovery: >
          The dependency is shown with a warning saying the Feature it waits on cannot be forecast.
          Dropping the edge inside the run is epic-5792's half; until it ships there is no run for the
          edge to be dropped from.
      - trigger: A relation points at a work item that is not a Feature Lighthouse stores
        recovery: >
          Skipped silently, excluded from the count. The ADO relation URL carries an id and not a
          type, so this is the normal case rather than an exception.
      - trigger: A link is removed in the tracker
        recovery: >
          The next sync reconciles a Feature's edges against what the tracker now says, so the count
          drops. There is nothing to preserve across the reconcile, because every edge comes from the
          tracker (D4).
      - trigger: The Portfolio's dependency override names a field, and an entry in it is a typo
        recovery: >
          That entry is skipped and the rest of the list still yields edges (D15). Shown in the dialog
          as unresolved rather than dropped in silence.
      - trigger: The user cannot read a Feature that one of their Features waits on
        recovery: >
          Rendered as a redacted row naming the reason, never omitted. A hidden blocker is worse than
          an unnamed one.
      - trigger: The instance has no premium licence
        recovery: >
          Nothing changes. Detection, count, dialog and warnings all render on every instance, because
          nothing in this epic is licence-gated. The hint naming what is withheld belongs to
          epic-5792, which is where something is withheld.
