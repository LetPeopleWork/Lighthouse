schema_version: 1
feature_id: epic-5874-relicense-source-available
updated: 2026-09-11
note: >
  ADO Epic #5874, executing a founder decision taken 2026-08-31 in the business decision record
  2026-08-01-do-we-stay-open-source-or-not. Lighthouse moves off MIT to a named source-available
  licence. The source stays public and inspectable on GitHub; OSI-approved status is explicitly not
  a goal; every version shipped before the change date stays MIT in perpetuity. Four facts shape
  every journey below. One: off-the-shelf ELv2 — the BDR's standing leaning — prohibits hosted
  resale and licence-key circumvention but permits deriving a substitute from the source outright,
  so it covers only half of what this epic set out to prevent, and the instrument becomes a named
  Lighthouse licence that adds a no-competing-use clause (borrowed from FSL 1.1, without FSL's
  two-year conversion clock) and an explicitly drafted AI sentence. Two: no mainstream software
  licence carries an AI clause, so that sentence has no precedent to copy and its job is to state
  the position publicly — the protection comes from the outcome clause underneath it, because an
  agent-assisted derivative is an ordinary derivative work and copyright does not care who typed it.
  Three: the word "open source" appears across three repositories including a schema.org FAQ answer
  that ranks for "open-source alternative to ActionableAgile", and the same word appears truthfully
  about the LetPeopleWorkShop and LetPeopleGrow plugins, which must not be swept. Four: GitHub
  cannot disable forks or pull requests on a public repository, so closing contributions is a
  workflow, not a setting. One pre-slice SPIKE and four slices; see
  docs/feature/epic-5874-relicense-source-available/.

journeys:

  - name: know-what-i-may-do-with-this-source
    goal: >
      Someone evaluating Lighthouse, whose security or legal colleague has asked what the company is
      allowed to do with a self-hosted tool's source, reads the answer off the repository and the
      documentation without opening a vendor conversation — and finds the running product and the
      marketing site saying the same thing.
    persona: "forecasting-prospect (secondary: config-admin, who inherits the answer when they deploy)"

    emotional_arc:
      start: Guarded — "self-hosted and free usually means either a licence that permits everything,
        which my legal team distrusts, or a licence nobody will explain."
      middle: Oriented — "five numbered prohibitions. I can read all of them in a minute, and one of
        them names AI-assisted derivation, which is exactly the thing my team was about to ask about."
      end: Settled — "the app footer, the docs and the website all say the same thing, and the FAQ
        tells me what changed and when. Nothing here contradicts anything else, so I can quote it."

    steps:
      - step: Find the terms
        action: Open github.com/LetPeopleWork/Lighthouse and look at the sidebar, or click LICENSE
        output: A named licence — Lighthouse Source Available License — listing ELv2's three
          prohibitions plus a no-competing-use clause plus the AI sentence, each separately numbered.
      - step: Work out whether it applies to versions already in use
        action: Read the NOTICE, or the corresponding section of LICENSE
        output: A dated statement that every version released before the change date remains MIT in
          perpetuity, so an existing deployment is not retroactively re-licensed.
      - step: Check the product says the same
        action: Open the running instance, Settings → System Info, and read the footer line
        output: >
          The footer reads "© 2026 LetPeopleWork GmbH. Source available — see LICENSE." — the same
          claim as the repo, not a leftover MIT line.
      - step: Ask the follow-up question
        action: Open docs.lighthouse.letpeople.work/licensing/licensing.html
        output: A short FAQ entry — what changed, when, what it means for an existing self-hosted
          instance, and that prior versions stay MIT.
      - step: Arrive from a search instead, and check the claim
        action: Land on letpeople.work/lighthouse or /compare from an organic search, read the hero
          and the comparison row, then click through to the repo
        output: The site says source available and self-hosted; the repo agrees. The claim survives
          the check the reader was always going to run.

    error_paths:
      - situation: The reader lands on the website before the copy sweep has shipped
        recovery: The site still says "open source" while the repo says otherwise. This is the window
          slices 02 and 03 exist to close, and it is why the licence lands first and the copy follows
          immediately — the inconsistency reads as the marketing site lagging, which is ordinary. The
          reverse order would read as the licence being unsettled, which is not.
      - situation: GitHub does not recognise the licence file and shows no name in the sidebar
        recovery: Expected, not a failure — a bespoke text will not match GitHub's corpus. The file
          carries its own name as a heading, and the SPDX identifier is a LicenseRef string used
          identically in LICENSE, README and the docs so that a reader or a tool sees one string.
      - situation: A reader concludes the source has been closed
        recovery: The licence's first line and the docs FAQ both state that the source stays public
          and inspectable and that this is not a move to closed source. This is the single most
          likely misreading and it is answered before it is asked.
      - situation: An organisation wants to modify Lighthouse for its own internal use
        recovery: Permitted. The no-competing-use clause bars making a substitute available to
          others; it does not bar a customer changing their own instance. If the drafted wording
          cannot be bounded that tightly, the SPIKE escalates rather than shipping a licence that
          quietly forbids self-hosting modifications.
      - situation: A partner wants to host Lighthouse for their client
        recovery: Unresolved as of this wave, and blocking the SPIKE's conclusion rather than this
          journey. ELv2 clause 1 forbids providing the software as a hosted service; whether that
          restricts our own partner motion is a business-model call the BDR has carried unanswered
          since 2026-08-01 and that must be settled before the wording closes.

  - name: close-the-door-the-old-licence-left-open
    goal: >
      A maintainer stops answering code contributions by hand: someone opening a pull request is told
      immediately that code is not accepted and where to send the thing instead, and the docs say the
      same in prose.
    persona: lighthouse-maintainer

    emotional_arc:
      start: Exposed — "the licence now says one thing and contributions.md still opens by inviting
        people to contribute code. Someone will notice."
      middle: Braced — "GitHub has no switch for this. Issues, Discussions and the wiki are already
        off; pull requests and forks cannot be turned off at all on a public repo."
      end: Done with it — "a fork PR closes itself with a comment naming where to send feedback, my
        own branch PRs are untouched, and the docs answer the fork question so nobody asks it again."

    steps:
      - step: Say it in prose
        action: Rewrite docs/contributions/contributions.md
        output: Code pull requests are not accepted; bug reports, feedback, docs corrections and word
          of mouth still are. Existing contributors keep their thanks. The fork question is answered
          in the same page so it is not re-asked.
      - step: Say it at the moment of writing
        action: Add .github/PULL_REQUEST_TEMPLATE.md
        output: A contributor reads the position before pressing the button, not after.
      - step: Enforce it without a human
        action: Add a pull_request_target workflow comparing head repo to base repo
        output: A PR from a fork is closed with a comment; a PR from an in-repo branch is untouched.

    error_paths:
      - situation: The workflow uses the pull_request event instead of pull_request_target
        recovery: It silently no-ops — a fork-triggered pull_request run gets a read-only token and
          cannot close anything. The failure looks like nothing happening, which is why the slice
          acceptance requires a real fork PR observed closing, not a green workflow run.
      - situation: The workflow closes the maintainers' own PRs
        recovery: Breaks the team's normal flow. Acceptance requires an in-repo-branch PR observed
          surviving, tested at the same time as the fork case and not inferred from it.
      - situation: Someone forks the repository anyway
        recovery: Nothing happens, and nothing should. Forks cannot be disabled on a public
          repository. The four that exist are inert snapshots under a perpetual MIT grant, and the
          licence governs what a fork may do rather than whether it may exist.
      - situation: The workflow checks out the contributor's code
        recovery: Must never happen. pull_request_target runs in the base repo's context with a
          writable token; checking out untrusted head code there hands it that token. The workflow
          reads event metadata, comments, closes, and does nothing else.
