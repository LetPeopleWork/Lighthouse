schema_version: 1
feature_id: epic-5878-baseline
updated: 2026-10-17
ado: "#5878 Baseline (ValueFlow, Community)"
note: >
  Seeded in DISCOVER (2026-10-02) as two hypothesis journeys; refined in DISCUSS (2026-10-02) to the converged
  DIVERGE direction; revised 2026-10-03 after the maintainer's answers (D37-D44): a Reports tab on Teams and
  Portfolios, the "Then & Now" report type, a frozen Then window and a saved-length rolling Now, one panel per metric
  showing Then, Now, the change and % change (Now's points beyond Then's frozen limits were dropped on 2026-10-14,
  D49; a summary header names each side's window and closed count, D52). No verdicts, no generated
  text, no charts - people interpret. No Lighthouse user has walked these journeys yet. Terms in braces ({team},
  {portfolio}, {feature}, {work items}, {cycle time}, {throughput}, {wip}, {work item age}) render as the instance's
  configured words. No user-facing "Baseline" (it names the PBC setting). Decisions D17-D52 and slices 01-11 (09 and 11
  dropped) live in docs/feature/epic-5878-baseline/feature-delta.md.

journeys:

  - name: show-what-changed-since-the-engagement-started
    goal: >
      A flow coach freezes the {team}'s or {portfolio}'s "Then" (for example the 90 days up to an engagement start
      or a change of working agreement) and, weeks later, shows the sponsor today's flow beside it - one panel per
      metric chosen before looking, with the change coloured by whether it is better or worse.
    persona: "flow-coach (consulting or internal; Team/Portfolio Admin); reader: delivery-lead-rte (Viewer)"
    jobs:
      - job-flow-coach-show-whether-flow-changed
    emotional_arc:
      start: Exposed - "They are paying me; I need to show it worked, not just say it."
      middle: Anchored - "Then is frozen; nobody can move it after the fact."
      end: Informed - "{cycle time} 85th 21 -> 12 days, green; {work item age} up 44%, red - now we talk about it."
    steps:
      - id: 1
        name: Freeze Then
        action: "{team} or {portfolio} -> Reports -> Create Report -> Then & Now -> Then end date and length -> Now length -> metrics (all four ticked) -> name -> Create"
        emotional_state: {entry: Exposed, exit: Anchored}
        shared_artifacts: [then_window, then_values, now_length, report_count]
        failure_modes:
          - Then reaches past DoneItemsCutoffDays - refused, naming the earliest allowed start, never silently partial
          - Then shorter than 14 days - refused with the minimum
          - Then end date in the future - cannot be picked
          - Community owner already holds 2 reports (any type) - Create Report disabled with the reason
          - Reader without Write - no Create Report; empty state says an Admin can create one
        integration_checkpoint: Then values on the report equal the Metrics tab for the same dates at creation
        gherkin: |
          Scenario: A coach freezes a Then that ended at the engagement start
            Given Team Lightspeed's engagement started on 1 Aug 2026
            When Elena creates a Then & Now report with a Then of 90 days ending 31 Jul 2026
            Then the report's summary header shows Then's 90 days ending 31 Jul 2026 and how many {work items} closed in them
      - id: 2
        name: Read Then and Now
        action: "Open the report; read the summary header (each side's window and closed count), then each metric's panel - Then left, Now right, change, % change"
        emotional_state: {entry: Hopeful, exit: Informed}
        shared_artifacts: [then_window, then_values, now_window, now_values, direction_of_good]
        failure_modes:
          - Now overlaps Then - shown as is; the header shows both windows
          - Thin data - the summary header shows each side's length and closed count (D52); "—" with a reason only when truly empty, never a zero (D45)
          - Nothing in progress in a window - {wip} and total {work item age} read 0, a real 0, never a dash (D50, D51)
          - Settings changed since creation - no notice (D46); Now uses today's settings, Then stays frozen
          - Owner's PBC Baseline changed later - Then's values do not move; nothing comes from the PBC Baseline
          - Report cannot be loaded - "This report couldn't be loaded. Reload to try again." with Retry, no stale numbers (DT6)
          - Report no longer exists - "This report no longer exists." with Back to Reports (DT6)
        integration_checkpoint: The Now window in the summary header is the window every panel's Now side uses
        gherkin: |
          Scenario: A fall in Cycle Time shows as a change for the better
            Given Elena's report froze a Then 85th percentile of 21 days
            And the Now 85th percentile is 12 days
            When Elena opens the report
            Then the Cycle Time panel shows "−9 days" and "−43%" marked as an improvement
      - id: 3
        name: Show the sponsor
        action: "The sponsor (Viewer) opens the same report in Lighthouse and reads the panels"
        emotional_state: {entry: Sceptical, exit: Oriented in one look}
        shared_artifacts: [then_window, now_window, now_values, direction_of_good]
        failure_modes:
          - Sponsor reads a red panel without context - no narrative by design; the coach explains (author note later)
          - Sponsor wants a different Now - fixed for readers; an editor changes it for everyone or creates another report
          - Sponsor needs it outside Lighthouse - out of scope in v1; PDF continues in epic-6298-report-pdf-export.yaml, email/schedule in Epic 5882
        integration_checkpoint: A Viewer sees exactly what the coach sees, without write actions
        gherkin: |
          Scenario: A reader sees reports but cannot create one
            Given Martin is a Viewer on Team Lightspeed
            When Martin opens the Reports tab
            Then he sees the report and no Create Report button
      - id: 4
        name: Adjust the report
        action: "Editor -> Edit report (the Create wizard in edit mode, DT4; Type and Then locked) -> Now length, shown metrics, name -> Save; Then stays as frozen"
        emotional_state: {entry: Responsive, exit: Confident}
        shared_artifacts: [now_length, then_values]
        failure_modes:
          - Metric added to the catalog after creation - "Not captured for this report", cannot be ticked
          - Attempt to change Then - not offered; Then is read-only
          - Someone else saved the report meanwhile - the save is refused; "This report was changed by someone else. Reload to see their changes." (DT4)
        integration_checkpoint: Every reader sees the edited name, Now length and metrics on their next view
        gherkin: |
          Scenario: A changed Now length is stored for everyone
            Given Elena's report has a Now of 90 days
            When Elena sets Now to 30 days
            Then Martin's next view shows "Now: last 30 days"

  - name: hand-over-a-starting-point-at-the-end-of-an-assessment
    goal: >
      A consultant ending a short (about 4-week) assessment freezes a Then that ends today, saves a Now length that
      suits the client, and hands the report over; the client later reads the rolling Now beside it. Covered by the
      same feature (D14), not a separate one.
    persona: "flow-coach (consulting, short assessment); later reader: the client's Team or delivery-lead-rte"
    jobs:
      - job-flow-coach-show-whether-flow-changed
    emotional_arc:
      start: Rushed - "Four weeks; no time for a real after."
      middle: Grounded - "Here is where you are, frozen."
      end: Handed over - "Measure yourselves against this from now on."
    steps:
      - id: 1
        name: Freeze Then at hand-over
        action: "Create Report -> Then & Now -> Then ends today -> Now length (e.g. 30 days)"
        emotional_state: {entry: Rushed, exit: Grounded}
        shared_artifacts: [then_window, then_values, now_length]
        failure_modes:
          - Report frozen today - Now covers the same days as Then (or part of them) and shows little or no change; the header shows both windows
        integration_checkpoint: The header shows both windows, so a same-day report plainly compares Then with itself
      - id: 2
        name: The client reads Now later
        action: "Weeks later the client opens the report; Now is the saved length ending today"
        emotional_state: {entry: Curious, exit: Informed}
        shared_artifacts: [now_window, now_values, direction_of_good]
        failure_modes:
          - Then ages past DoneItemsCutoffDays - irrelevant, Then is frozen; deleting warns it can no longer be rebuilt
          - Client changed settings after the hand-over - Now uses today's settings, Then stays as frozen; no notice (D46)

shared_artifacts:
  then_window: {source: "the stored report (end date + length, picked at creation, never editable)", consumers: [summary header, default name, delete warning, "days since Then ended (stays on the wire as daysSinceThenEnded; shown only once the maintainer approves its sketch at slice 07, D52)"]}
  then_values: {source: "frozen at creation for every applicable metric - the values its panel shows", consumers: [Then side of every panel, change, "% change"]}
  now_length: {source: "the stored report (set at creation, changed only through Edit report)", consumers: [header, now_window, scheduled sending later (Epic 5882)]}
  now_window: {source: "derived - now_length days ending today, never clipped", consumers: [header, Now side of every panel]}
  now_values: {source: "existing metrics services over now_window, today's settings", consumers: [Now side of every panel, change, "% change", "closed count in the summary header"]}
  direction_of_good: {source: "fixed per metric in its frontend panel; stored nowhere", consumers: [colour of change]}
  report_count: {source: "stored reports of the owner, all templates", consumers: [Create Report enablement, Community cap message, owner delete confirmation]}

changelog:
  - date: 2026-10-02
    feature: epic-5878-baseline
    change: Seeded in DISCOVER with two hypothesis journeys (long engagement before/after; short-assessment snapshot).
  - date: 2026-10-02
    feature: epic-5878-baseline
    change: >
      DISCUSS - both journeys re-pointed to job-flow-coach-show-whether-flow-changed; intervention date replaced by
      the Then end date; steps aligned with the Reports tab, Then & Now template, claims and verdicts; reader step
      added; short assessment re-shaped as a hand-over (D14); shared artifacts rewritten.
  - date: 2026-10-03
    feature: epic-5878-baseline
    change: >
      DISCUSS revision after the maintainer's answers (D37-D44) - claims, verdicts, Now clipping and charts removed;
      one panel per metric with change, % change and points beyond Then's frozen limits; Then picked by end date and
      length (custom allowed); Now length saved on the report; Edit report step added; shared artifacts then_limits,
      now_length and direction_of_good added, then_series dropped.
  - date: 2026-10-03
    feature: epic-5878-baseline
    change: >
      After DESIGN (D45-D48) - every value shows its sample size, "—" only when truly empty; settings-changed notice
      and settings_snapshot dropped (slice 09 dropped); {throughput} as total and per-day average; average {work item
      age} as window average and last day.
  - date: 2026-10-13
    feature: epic-5878-baseline
    change: >
      Aligned with the maintainer's UI-sketch decisions DT1-DT7 - users read "Type", never "Template"; Edit report is
      the Create wizard in edit mode; could-not-load and no-longer-exists looks on the report; a stale edit is refused
      with a reload message.
  - date: 2026-10-14
    feature: epic-5878-baseline
    change: >
      D49-D52 (maintainer, after the DISTILL sketch review) - no points beyond Then's limits on any panel and no
      frozen limits: shared artifact then_limits removed, the lower-limit-zero and PBC-Baseline-moves-the-counts
      failure modes replaced; {wip} and total {work item age} read Average, Median, Min and Max of the daily values
      (a window with nothing in progress reads 0, never a dash); a summary header names each side's window and how
      many {work items} closed.
  - date: 2026-10-14
    feature: epic-5878-baseline
    change: >
      DESIGN peer-review pass - D52 replaces D35's header sentence: the summary header no longer says "frozen" or
      "days since Then ended" (that line waits for slice 07's sketch); the sample size shows in the header, not on
      every value; the closed count is {throughput}'s total once captured, else the {cycle time} sample size.
  - date: 2026-10-17
    feature: epic-6298-report-pdf-export
    change: >
      Step 3's "Sponsor needs it outside Lighthouse" failure mode now points to epic-6298-report-pdf-export.yaml for
      the PDF; email and scheduled sending stay with Epic 5882.
