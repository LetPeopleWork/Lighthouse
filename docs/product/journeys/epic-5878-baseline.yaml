schema_version: 1
feature_id: epic-5878-baseline
updated: 2026-10-02
ado: "#5878 Baseline (ValueFlow, Community)"
note: >
  Seeded in DISCOVER (2026-10-02) as two hypothesis journeys; refined in DISCUSS (2026-10-02) to the converged
  DIVERGE direction (Option 3, "Claims checklist"): a Reports tab on Teams and Portfolios, the "Then & Now" template,
  a frozen Then window and a rolling Now judged by claims. No Lighthouse user has walked them yet. Terms in braces
  ({team}, {portfolio}, {feature}, {work items}, {cycle time}, {throughput}, {wip}, {work item age}, {sle}) render
  as the instance's configured words. No user-facing "Baseline" (it names the PBC setting). Decisions D17-D35 and
  slices 01-11 live in docs/feature/epic-5878-baseline/feature-delta.md.

journeys:

  - name: show-what-changed-since-the-engagement-started
    goal: >
      A flow coach freezes the {team}'s or {portfolio}'s "Then" (for example the 90 days up to an engagement start
      or a change of working agreement) and, weeks later, shows the sponsor today's flow against it as claims that
      hold or do not hold, judged by rules fixed before looking.
    persona: "flow-coach (consulting or internal; Team/Portfolio Admin); reader: delivery-lead-rte (Viewer)"
    jobs:
      - job-flow-coach-show-whether-flow-changed
    emotional_arc:
      start: Exposed - "They are paying me; I need to show it worked, not just say it."
      middle: Anchored - "Then is frozen; nobody can move it after the fact."
      end: Vindicated or honestly informed - "{cycle time} is trending down; {wip} held; {throughput} no change yet."
    steps:
      - id: 1
        name: Freeze Then
        action: "{team} or {portfolio} -> Reports -> Create Report -> Then & Now -> Then length and end date -> claims (C1-C4 preselected) -> Create"
        emotional_state: {entry: Exposed, exit: Anchored}
        shared_artifacts: [then_window, then_series, settings_snapshot, report_count]
        failure_modes:
          - Then reaches past DoneItemsCutoffDays - refused, naming the earliest allowed start, never silently partial
          - Then end date in the future - cannot be picked
          - Community owner already holds 2 reports (any template) - Create Report disabled with the reason
          - Reader without Write - no Create Report; empty state says an Admin can create one
        integration_checkpoint: Then values on the report equal the Metrics tab for the same dates at creation
        gherkin: |
          Scenario: A coach freezes a Then that ended at the engagement start
            Given Team Lightspeed's engagement started on 1 Aug 2026
            When Elena creates a Then & Now report with a Then of 90 days ending 31 Jul 2026
            Then the report shows "Then: 90 days to 31 Jul 2026 - frozen"
      - id: 2
        name: Read Then and Now
        action: "Open the report; pick the Now length; read the claims with Then -> Now values"
        emotional_state: {entry: Hopeful, exit: Confident or honestly informed}
        shared_artifacts: [then_window, then_series, now_window, now_values, settings_snapshot]
        failure_modes:
          - Now still overlaps Then - Now is clipped to start after Then; with nothing left every trend claim reads No change yet
          - Routine variation presented as change - verdicts use limits from the frozen Then series; a lone point is not a trend
          - Too few finished {work items} - Not enough data with the reason, never a zero
          - Settings changed since creation - one header notice; Then stays frozen
          - Lower limit at zero - the downward claim says a fall shows mainly as a run below the Then average
        integration_checkpoint: The Now window in the header is the window the verdicts were judged on
        gherkin: |
          Scenario: A sustained fall in Cycle Time holds
            Given Team Lightspeed's Then average Cycle Time is 9 days
            And the last 8 Work Items finished in Now all took less than 9 days
            When Elena opens the report
            Then "Cycle Time is trending down" reads Holds
      - id: 3
        name: Show the sponsor
        action: "The sponsor (Viewer) opens the same report in Lighthouse; optionally expands a claim to see its chart"
        emotional_state: {entry: Sceptical, exit: Oriented in one look}
        shared_artifacts: [then_window, now_values]
        failure_modes:
          - Sponsor reads "No change yet" as evasion (R-A) - values stay on the row; C6 offers the familiar percentage
          - Sponsor needs it outside Lighthouse - out of scope in v1 (PDF/email later, D13)
        integration_checkpoint: A Viewer sees exactly what the coach sees, without write actions
        gherkin: |
          Scenario: A reader sees reports but cannot create one
            Given Martin is a Viewer on Team Lightspeed
            When Martin opens the Reports tab
            Then he sees the report and no Create Report button

  - name: hand-over-a-starting-point-at-the-end-of-an-assessment
    goal: >
      A consultant ending a short (about 4-week) assessment freezes a Then that ends today and hands the report to
      the client, who later reads a rolling Now against it. Covered by the same feature (D14), not a separate one.
    persona: "flow-coach (consulting, short assessment); later reader: the client's Team or delivery-lead-rte"
    jobs:
      - job-flow-coach-show-whether-flow-changed
    emotional_arc:
      start: Rushed - "Four weeks; no time for a real after."
      middle: Grounded - "Here is where you are, frozen."
      end: Handed over - "Measure yourselves against this from now on."
    steps:
      - id: 1
        name: Freeze Then at hand-over
        action: "Create Report -> Then & Now -> Then ends today"
        emotional_state: {entry: Rushed, exit: Grounded}
        shared_artifacts: [then_window, then_series, settings_snapshot]
        failure_modes:
          - Nothing of Now lies after Then yet - every trend claim reads No change yet with "Now begins after <date>"
        integration_checkpoint: The report states plainly that Now has not begun
      - id: 2
        name: The client reads Now later
        action: "Weeks later the client opens the report and picks a Now length"
        emotional_state: {entry: Curious, exit: Informed}
        shared_artifacts: [now_window, now_values, settings_snapshot]
        failure_modes:
          - Then ages past DoneItemsCutoffDays - irrelevant, Then is frozen; deleting warns it can no longer be rebuilt
          - Client changed settings after the hand-over - header notice

shared_artifacts:
  then_window: {source: "the stored report (length + end date, picked at creation)", consumers: [header, default name, days since Then ended, Now clipping, delete warning]}
  then_series: {source: "frozen at creation for every applicable claim, with the values shown on the row and Then's signal state", consumers: [claim rows, verdict limits, claim chart]}
  now_window: {source: "page address (per view), clipped to start after then_window", consumers: [header, verdicts, row values]}
  now_values: {source: "existing metrics services over now_window, today's settings", consumers: [claim rows, verdicts]}
  settings_snapshot: {source: "frozen at creation ({work item} types, state mapping, query, blackout days)", consumers: [settings-changed notice]}
  report_count: {source: "stored reports of the owner, all templates", consumers: [Create Report enablement, Community cap message]}

changelog:
  - date: 2026-10-02
    feature: epic-5878-baseline
    change: Seeded in DISCOVER with two hypothesis journeys (long engagement before/after; short-assessment snapshot).
  - date: 2026-10-02
    feature: epic-5878-baseline
    change: >
      DISCUSS - both journeys re-pointed to job-flow-coach-show-whether-flow-changed; intervention date replaced by
