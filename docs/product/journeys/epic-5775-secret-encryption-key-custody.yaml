schema_version: 1
feature_id: epic-5775-secret-encryption-key-custody
created: 2026-08-14
research_depth: comprehensive
note: >
  Journeys for Epic #5775 — making each Lighthouse instance's encryption key its own, making a key
  change a supported operation that costs no credentials, and making the whole story true in public.

  The "user" here is the OPERATOR and the ADMINISTRATOR, not a flow-metrics end-user. The "screen" is
  a startup log, a Settings panel, a `helm install`, and a documentation page. No forecast, chart or
  work item appears in any of these journeys.

  STARTING STATE, read from code on 2026-08-14 and inherited by every journey below: one AES key,
  published in appsettings.json in a public repository, used by every install that has not overridden
  it; a documented override (`Encryption__Key`) that no code reads; a decrypt that returns the
  ciphertext when it fails, so a wrong key is indistinguishable from a right one until a work tracking
  system rejects the credential; bare AES-CBC with no authentication tag and no key identifier; and a
  Helm chart that provisions no key at all.

  HARD CONSTRAINTS inherited by every journey: the STANDALONE product must keep working with no vault,
  no cluster and no configuration — every custody mode beyond the generated one is additive; no key
  material in any log, report, ConfigMap, rendered value or telemetry; expand-only migrations; no
  vendor telemetry, so every signal below is one a customer reads on their own instance.

  Walking skeleton: none built. Brownfield, extending the first-boot secret provisioning that already
  works for the OAuth state secret.

journeys:

  - name: first-boot-gets-its-own-key
    goal: >
      A self-hoster who downloaded an exe or ran one `docker run` ends up with their credentials
      protected by a key generated for their instance alone, without having read a configuration page,
      set a variable, or made a decision.
    persona: "platform-operator (self-hoster flavour)"
    jobs: [job-operator-unique-key-without-effort, job-operator-know-the-key-is-actually-in-effect]
    stories: ["US-02"]
    slices: ["slice-02"]
    emotional_arc:
      start: >
        Unexamined - the operator has not thought about the encryption key at all, which is exactly
        the state the design has to be correct in. The ones who DID think about it read the docs, set
        `Encryption__Key`, and are in a worse position: confident and wrong.
      middle: >
        Noticing - one startup line says "generated for this instance". The operator did not ask for
        it and does not have to do anything about it, but now knows a question exists and that it has
        already been answered.
      end: >
        Settled - able to say, to a colleague or a security questionnaire, that this instance's stored
        credentials are protected by a key that exists only here.
    mental_model: >
      Operators do not think in key rings. They think "the app has a password for my Jira token
      somewhere". The signal has to answer "is that password mine or everyone's?" in one line, in the
      place they already look, without teaching them a vocabulary first.
    happy_path:
      - step: start the instance for the first time
        output: "startup log: Encryption key: generated for this instance (k-…)"
      - step: configure a Connection and save a token
        output: the secret is stored under this instance's key id
      - step: restart
        output: same key resolved; every Connection still works; restarting is not a rotation
      - step: open Settings → System
        output: key source and active key id, never the key material
    error_paths:
      - condition: a key store exists but cannot be read
        behaviour: >
          startup stops and names the key store. It does NOT generate a replacement — a fresh key on
          an existing database looks like a successful boot and silently orphans every stored secret.
      - condition: an operator supplies a key that is not 32 bytes of base64
        behaviour: startup stops and says what is wrong with the value
      - condition: upgrading from a build that used the published default key
        behaviour: >
          the default enters the ring as a retired entry; every existing secret stays readable; new
          writes move to the instance's own key; no credential is re-entered

  - name: rotate-the-key-without-recredentialing
    goal: >
      An administrator who suspects the key is exposed — a leaked backup, a departing admin, a
      compliance schedule — moves every stored secret onto a new key from inside Lighthouse, and asks
      nobody for a token.
    persona: config-admin
    jobs: [job-operator-rotate-key-without-recredentialing, job-operator-know-the-key-is-actually-in-effect]
    stories: ["US-03", "US-04"]
    slices: ["slice-03", "slice-04"]
    emotional_arc:
      start: >
        Dread - today's documented procedure is to change the key and then reconfigure every work
        tracking system. That means chasing every team for a PAT while every sync is down, so the
        rational response to a suspected exposure is currently to postpone it.
      middle: >
        Cautious - a read-only check first, naming exactly what is readable and what is not, so the
        write pass is entered with a number rather than a hope.
      end: >
        In control - a report saying how many secrets moved and how many did not, and every Connection
        still syncing. Containment measured in minutes, not in meetings.
    mental_model: >
      Administrators expect a key change to be a disaster, because in this product it has been one.
      The surface has to lead with the cost that is NOT being paid — no credential re-entry — because
      that is the belief being overturned.

      Rotation is TWO jobs and only one of them is always the application's. MINTING a key means
      creating and persisting it; RE-ENCRYPTING means walking every stored secret onto the active key.
      Re-encryption is always in-app. Minting belongs to whoever owns custody: the application where
      it owns the key store (standalone, Docker), the operator where a Kubernetes Secret holds it.
      So the panel is custody-aware — it offers "Rotate key" in the first case and "Re-encrypt onto
      the active key" in the second, and never offers to mint a key it cannot persist. Conflating the
      two would require Lighthouse to write to its own Secret: a cluster permission that should not be
      granted, and one an external secret store would overwrite on its next sync.
    happy_path:
      - step: Settings → Encryption → Check secrets
        output: "47 secrets · 45 on the active key · 2 on a retired key · 0 unreadable"
      - step: >
          Rotate key (where the application owns it) — or, where an operator owns it, add the new key
          to the Secret alongside the old, roll the pod, then Re-encrypt onto the active key
        output: "Rotated 47 secrets onto key k-2026-08-14-01. 0 unreadable. Previous key retired."
      - step: Check secrets again
        output: every readable secret on the active key
      - step: trigger a sync on any Connection
        output: works, with nothing re-entered
    error_paths:
      - condition: a stored secret cannot be read under any key in the ring
        behaviour: >
          left byte-for-byte untouched and named with its Connection and field. Rotation never
          overwrites what it could not verify.
      - condition: rotation is interrupted part-way
        behaviour: >
          the instance keeps working — both keys are in the ring — and running rotation again finishes
          the remainder
      - condition: an OAuth token refresh writes a credential row mid-rotation
        behaviour: >
          neither the refreshed token is lost nor the row left unreadable. OPEN QUESTION OQ-1 —
          whether optimistic concurrency suffices or the pass must hold off the sync pipeline is
          answered by a timeboxed probe before slice 03 is dispatched.

  - name: hand-key-custody-to-the-cluster
    goal: >
      An operator installing with Helm — for one organisation or as one tenant among many — gets a
      unique key without supplying one, or points the install at a Secret their own external store
      owns, and an upgrade never takes it away.
    persona: "platform-operator (self-hoster and LPW SaaS-operator flavours)"
    jobs: [job-saas-operator-tenant-owned-encryption-key, job-operator-unique-key-without-effort]
    stories: ["US-05"]
    slices: ["slice-05"]
    emotional_arc:
      start: >
        Shared-fate anxiety - the chart provisions a database connection string and an OIDC secret and
        no encryption key, so every Kubernetes install, including every tenant, runs on the published
        default and one leaked backup is everyone's problem.
      middle: >
        Deliberate - choosing between "let the chart make one", "let External Secrets or OpenBao own
        it", and "here is mine", with the pod log stating which one took effect.
      end: >
        Isolated - each tenant's secrets are readable only with that tenant's key, and a security
        review of a Kubernetes install has an answer.
    mental_model: >
      Cluster operators expect secrets to come from a Secret and to survive upgrades. The dangerous
      assumption they will NOT make out loud is that a chart-generated value is stable — Helm
      re-renders templates on every upgrade, and a regenerated key orphans the tenant's whole
      credential set.
    happy_path:
      - step: "helm install with no encryption values"
        output: a unique key generated into the release's Secret; pod log states the source
      - step: save a Connection in the tenant
        output: the secret is stored under that tenant's key
      - step: "helm upgrade with unchanged values, three times"
        output: the key is unchanged; every stored secret still readable
      - step: switch to encryption.existingSecret owned by External Secrets or OpenBao
        output: "pod log: Encryption key: supplied by external secret"
      - step: >
          rotate: add a second key to the Secret alongside the first, roll the pod, then trigger
          Re-encrypt onto the active key, then drop the old key from the Secret
        output: every secret on the new key; nothing re-entered; Lighthouse never wrote to the Secret
    error_paths:
      - condition: "`helm upgrade` regenerates a generated key"
        behaviour: >
          must be impossible. This is the failure that orphans a tenant's entire credential set and it
          carries a chart unit test of its own.
      - condition: the external Secret is rotated underneath a running pod
        behaviour: >
          The supported flow, not an accident: the operator adds the new key to the Secret alongside
          the old, the ring carries both, and re-encryption follows from the Settings panel. Only the
          degenerate case remains open — an old key removed before re-encryption ran must surface the
          affected secrets as unreadable rather than loop on work-tracking-system rejections.
      - condition: a key is supplied through a ConfigMap or a values file left in a repository
        behaviour: the chart never renders the key anywhere but the Secret

  - name: answer-the-security-question
    goal: >
      A maintainer facing a prospect's security team answers how stored credentials are protected with
      a link to public documentation that matches what the product actually does by default.
    persona: lighthouse-maintainer
    jobs: [job-maintainer-answer-the-secret-storage-question]
    stories: ["US-06"]
    slices: ["slice-06"]
    emotional_arc:
      start: >
        Defensive - an evaluation was already lost to "credentials are stored in plain text". The
        claim names the wrong mechanism, and the honest rebuttal is undermined by the configuration
        page documenting an override that no code reads.
      middle: >
        Exposed then repaired - writing the three custody modes end to end is what surfaces every
        remaining gap between what the docs assert and what the build does.
      end: >
        Confident - a security reviewer completes their assessment from the documentation, with no
        maintainer in the loop.
    mental_model: >
      A security reviewer is looking for specifics they can verify and for a vendor who volunteers the
      limits. "Encrypted at rest" is not an answer; "generated per install, here is how you confirm
      which key you are on, here is how you rotate, here is what you lose if you lose the key" is.
    happy_path:
      - step: open Installation → Configuration → Encryption Key
        output: three custody modes, first-boot behaviour, and the signal that says which is in effect
      - step: read the rotation section
        output: rotation costs no credential re-entry; the four secret states are explained
      - step: read what must be backed up
        output: losing the key loses every stored secret — stated, not discovered
      - step: read the advisory
        output: what was wrong, which version fixes it, published once that version is installable
    error_paths:
      - condition: the advisory publishes before the fixed version is installable
        behaviour: >
          must not happen. Affected operators learn about the exposure at the same moment they can act
          on it.
      - condition: the compliance self-assessment still cites evidence that does not match the build
        behaviour: the slice is not done

shared_artifacts:
  - name: "${encryption_key_ring}"
    source: >
      SINGLE SOURCE — the key ring resolved once at application bootstrap. Exactly one active key for
      writes, N retired keys readable. Populated from configuration, a generated Data-Protection-wrapped
      store, or an external Secret, in that precedence.
    consumers: [envelope writer, envelope reader, rotation, readability check, System Info]
  - name: "${active_key_id}"
    source: "SINGLE SOURCE — the ring's one active entry. Written into every envelope."
    consumers: [envelope writer, rotation report, readability check, System Info, startup log]
  - name: "${secret_envelope}"
    source: >
      SINGLE SOURCE — the envelope writer. Format version, key id, nonce, ciphertext, authentication
      tag. Every stored secret is either an envelope, a legacy AES-CBC blob, or legacy plaintext, and
      those three are distinguished by inspection, never by catching an exception.
    consumers: [DbContext save path, connections controller, every auth strategy, OAuth service, rotation, readability check]
  - name: "${key_source_label}"
    source: >
      SINGLE SOURCE — bootstrap key resolution. One of: generated for this instance, supplied by
      configuration, supplied by external secret. Never accompanied by key material.
    consumers: [startup log, System Info, pod log, documentation, Settings encryption panel]
    note: >
      Also the custody discriminator. "generated for this instance" and "supplied by configuration"
      mean the application owns the key and may mint one; "supplied by external secret" means an
      operator does, and the panel offers re-encryption only.
  - name: "${secret_readability_report}"
    source: >
      SINGLE SOURCE — the traversal shared by rotation and the read-only check. Per secret: owning
      Connection, field, key id, and one of four states — active key, retired key, legacy plaintext,
      unreadable.
    consumers: [rotation result, readability check, Settings → Encryption panel]
