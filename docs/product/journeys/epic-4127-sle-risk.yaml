schema_version: 1
feature_id: epic-4127-sle-risk
created: 2026-09-16
research_depth: lightweight
ado: Epic #4127 "Show SLE Probability for In Progress Items" (tags Community; Productboard)

amended: 2026-09-19
amendment_note: >
  Round 2 (docs/feature/epic-4127-sle-risk-corrections/) corrects what round 1 shipped, before any
  of it was released. The decisions are kept below, marked, rather than deleted — a journey that
  quietly loses the reasoning it once held cannot be read against the code that was written from it.
  Round 2's own decisions are D18 onward and live in that workspace's feature-delta.md.

  All four slices are now shipped, and between them they reversed five things this journey asserted:

  1. Slice 01 (#6034) — D12 and D13 superseded. The aging chart's SLE Risk background mode is gone
     and the control returns to Off / Pace percentiles. step-read-the-gradient is marked removed.
  2. Slice 02 (#6037) — D6 and D9 superseded. "Beyond history" no longer exists: every in-flight
     item carries a number, and there is no minimum-sample guard. The risk does NOT follow the range
     picker — it is read over the team's configured history and is always as of today, which is what
     lets the same number reach the screens and the tracker.
  3. Slice 03 (#6035) — the dialog opens wide enough to show the column and remembers an enlarged
     size; the column is reachable from a bubble click, which it had never been; and each risk cell
     discloses how much finished work it rests on.
  4. Slice 04 (#6036) — the card chip is replaced by a widget with a status of its own, and "at
     risk" means 70% or more rather than 50%.

note: >
  One persona acts (flow-coach) across four surfaces, so this journey is a single narrative with
  four reading moments rather than four journeys. The Epic arrived as a high-level description with
  three open questions and a proposed formula; DISCUSS answered all three from the data model and
  replaced the formula. Full reasoning and the worked comparison live in
  docs/feature/epic-4127-sle-risk/feature-delta.md.

  Distinguish this from its two neighbours, which look adjacent and answer different questions:
  aging-pace-percentiles and story-5884-work-item-age-bands both ask "how unusual is this item for
  the state it is in" — a per-state comparison with no commitment involved. This journey asks "is a
  commitment we published about to be broken" — end-to-end, and only meaningful when an SLE exists.
  An item can be a wild per-state outlier and still finish comfortably inside the SLE.

journeys:

  - name: act-before-the-sle-breaks
    goal: >
      Flow coach opens the team page during a standup, sees at a glance whether anything in flight is
      more likely than not to break the SLE the team published, opens the list to find out which items
      those are, and spends the standup on them — while there is still time to change the outcome.
    persona: flow-coach
    job_id: job-flow-coach-act-before-sle-breach

    emotional_arc:
      start: Blind — "I can see the SLE line on the chart, but it only tells me who has already
        missed. By then the conversation is an explanation, not an intervention."
      middle: >-
        Oriented — "three items are past fifty-fifty, and the number says why: of everything
        that was still open on day nine, six in seven went on to miss."
      end: In time — "we talked about the right two items this morning, and it was still possible to
        do something about them."

    design_decisions_resolved:
      - id: D1
        question: Which formula computes the per-item risk?
        decision: >
          The empirical conditional — count(T > R AND T >= a) / count(T >= a) over the window's
          closed cycle times, where a is the item's age and R the SLE range in days. Read as: of every
          item still open at this age, what fraction went on to exceed the target. The formula in the
          Epic description, (100 - p) / (100 - percentile(a)), is the same identity but takes its
          numerator from the DECLARED SLE probability and its denominator from the EMPIRICAL
          distribution; those agree only when the team is hitting its target exactly, and it needs a
          clamp above 100%, a divide-by-zero guard and a hard-coded "age >= range means 100%" rule.
          The empirical form needs none of the three and produces that last case as arithmetic.
          User-decided 2026-09-16 against a worked 20-item comparison.
      - id: D2
        question: Is the SLE's probability half used per item?
        decision: >
          No — only the day range. The probability is a property of the population, not of one item,
          and ragRules.ts already reports it there ("Only 70.0% within the SLE target (80% @ 10
          days)"). Consequence: no "enable SLE" toggle is needed, because range > 0 IS the
          enablement. This answers the Epic's own question about a settings switch by removing the
          need for one.
      - id: D3
        question: What happens when no SLE is set?
        decision: >
          Nothing is computed and nothing is rendered. No derived default, no 85th-percentile
          fallback. A self-derived SLE makes the breach rate (100 - p) true by construction, which
          collapses the metric into a restatement of the item's own percentile — that is
          story-5884-work-item-age-bands with a percent sign. An owner without an SLE is an expected
          and acceptable silent state; the feature is deliberately for teams that have made a promise.
      - id: D4
        question: What about an item in multiple teams or portfolios?
        decision: >
          Half the question is closed by the data model and needs no warning: WorkItem.TeamId is a
          single non-nullable int, so a work item belongs to exactly one team and team-level ambiguity
          cannot occur. Feature.Portfolios is genuinely many-to-many, each portfolio carrying its own
          SLE and its own history, so one feature would have N risks and write-back has one field to
          put them in. Portfolios are therefore OUT of scope for this Epic; portfolio surfaces take
          the same code path as "no SLE set" and render exactly as today.
      - id: D5
        question: Where is the number computed — frontend or backend?
        decision: >
          Once, in the backend domain, consumed by every surface including write-back. The frontend
          could compute it (cycleTimeData and inProgressItems are both already in useMetricsData), but
          write-back must compute it server-side regardless, and two implementations of one rule
          drift. This drift would be worse than the one story-5884 D8 guards against: the disagreement
          would be between Lighthouse and the user's own tracker, across systems, with no way to see
          both at once.
      - id: D6
        question: Which history window, given the Epic asks "how far back should we look"?
        decision: >
          Whatever window the caller already uses — no new setting. Display surfaces pass the metrics
          view's startDate/endDate, so the number follows the range picker like every other value on
          the page; write-back has no picker and uses the team's configured history. One domain
          function, two callers, two windows. A second SLE-specific window would let two numbers on
          the same page disagree.
      - id: D8
        question: Where do the boundaries fall?
        decision: >
          Denominator T >= a, numerator T > R AND T >= a. An item at age a may still close today with
          cycle time a, so it belongs in the survivor set; an item that took exactly R days MET the
          SLE and is not a breach. Both WorkItemAge and CycleTime count inclusive whole days through
          GetDateDifference, so no conversion is needed. story-5884 D8 records that boundary
          conventions are exactly where two surfaces silently start disagreeing.
      - id: D9
        question: What shows when no closed item ever ran this long?
        decision: >
          The sentinel "Beyond history", muted and unpainted, sorting off-scale — deliberately not
          100% and not blank, mirroring story-5884 D7's "No history". An absence of evidence must not
          read as certainty. It IS counted as at-risk for the card chip, because an item older than
          everything ever completed is not a safe item.
      - id: D12
        status: "superseded 2026-09-19 by round 2 (ADO #6034)"
        superseded_because: >
          The premise underneath it did not hold: a risk ladder has no legible geometry on a real
          history. Its lowest band is emitted at risk >= 25, so the whole calm region below that is
          never painted — and an unpainted area already means "too little finished work ever ran this
          long to say" on the same chart. The calm and the unknowable were drawn identically. On a
          thin history nothing was drawn at all. The mutual-exclusivity reasoning below was correct
          and is unaffected; the control simply has two modes again. The storage key keeps its string
          values rather than reverting to a boolean.
        question: How does the aging chart show this without becoming unreadable?
        decision: >
          As a THIRD MODE of the existing background control (Off / Pace percentiles / SLE Risk), not
          a second independent toggle. Both paint the same background channel so they are mutually
          exclusive by construction — the stance work-item-age-percentiles took for cycle-time versus
          age percentile lines on one chart. Crucially the two have different geometry: pace bands are
          per-state-column because age-in-state is per-column, while risk is end-to-end and therefore
          depends only on a dot's height, making it full-width horizontal zones. The existing boolean
          localStorage key migrates to tri-state so no user's chart changes on upgrade.
      - id: D13
        status: "moot 2026-09-19 by round 2 (ADO #6034)"
        superseded_because: >
          With the zones gone the SLE reference line is once again the only deadline the chart
          asserts, which is the outcome this decision existed to protect. The line itself is
          untouched.
        question: Do the risk zones duplicate the SLE reference line already on the chart?
        decision: >
          No — the line IS the top zone's labelled lower edge. The 100% zone begins exactly at R days,
          which is where the sleVisible reference line already sits (WorkItemAgingChart.tsx:662).
          Keeping both is not saying one thing twice; the line supplies the label the boundary would
          otherwise need. If the zone and the line ever disagree, the chart is asserting two different
          deadlines — which is the central correctness check of that slice.
      - id: D16
        question: How noisy may write-back be, given the value moves on every refresh?
        decision: >
          Raw integer percent, every update, for all in-flight items — the shape the Epic asked for.
          Threshold-crossing writes were offered in DISCUSS and declined: write-back is opt-in per
          mapping, so the choice belongs to the user who enabled it. The cost is recorded rather than
          mitigated: per quiet-jira-writeback D1, Jira can suppress watcher EMAIL only — issue
          history, the Updated timestamp, webhooks, listeners and automation rules fire on every
          deployment regardless. A future noise report is this decision surfacing, not a new defect.

    steps:

      - id: step-land-on-the-team-page
        amended: "2026-09-19 by round 2 (ADO #6036) — a widget, not a chip, and the line is 70"
        action: >
          Flow coach opens /teams/{teamId} at the start of a standup on a team that has published an
          SLE.
        expected_output: >
          An "At Risk" widget on Flow Overview counts the in-flight items at 70% risk or higher,
          coloured by the worst of them, beside the In Progress count it used to be a subtitle of.
          It carries a status of its own: Act once the share at risk reaches what the team's own SLE
          percentile allows (85% allows 15%), Observe while anything is at risk below that, Sustain
          otherwise. A team with no SLE sees a dash and is told to publish one — not a zero, which
          would read as good news. Teams only; a portfolio has no target to be at risk against.
        superseded_text: >
          ROUND 1: The Items In Progress card shows, on each row, a chip counting that row's items at
          50% risk or higher — "3 at risk" — coloured by severity. No chip when the count is zero,
          and no chip at all when no SLE is set. Replaced because one card cannot carry two meanings
          and a subtitle cannot have a status.
        emotional_state: Alerted — "there is something to talk about this morning, and I know that
          before I have opened anything"
        shared_artifacts:
          - ServiceLevelExpectationRange (existing, team settings, editable via SleQuickSetting)
          - ServiceLevelExpectationProbability (existing — round 2 derives the allowance from it
            rather than asking for a second number)
          - per-item risk (computed once in the backend domain per D5, never recomputed per surface)

      - id: step-open-the-list
        amended: "2026-09-19 by round 2 (ADO #6037, #6035) — no sentinel, no range dependence, and the
          column is now reachable and readable"
        action: >
          Flow coach opens the work item dialog — from the widget's View Data or by clicking a bubble
          on the aging chart — and sorts by the risk column.
        expected_output: >
          The dialog opens wide enough that the "SLE Risk" column is on screen without scrolling
          sideways, and offers an Enlarge control for the columns that still do not fit, remembering
          that choice. It lists in-flight items with an integer percentage per row, beside the "Work
          Item Age Band" column story-5884 added. Every listed item has a number: there is no
          off-scale sentinel to rank, because there is no case the arithmetic refuses. Sorting is
          numeric, not lexical, and a row the answer set never mentions sorts last in both
          directions. Hovering a cell says how much finished work the number rests on. The widget's
          count and the number of rows at or above 70% always agree — they read the same computed
          value.
        superseded_text: >
          ROUND 1: "Beyond history" ranks off-scale and lands last in the worst-first direction, and
          the chip's count agrees with the rows at or above 50% for the same range. Both halves are
          gone — the sentinel with slice 02, the range dependence with it, the chip with slice 04.
        emotional_state: Focused — "these three, in this order"
        shared_artifacts:
          - the team's configured throughput history and today's date — NOT the range picker. Round 1
            had the risk follow the picker like every other value on the page (D6); round 2 reversed
            it, because a risk that moved when a reader widened a range would be reporting on a
            control rather than on the work, and because the tracker has no range at all

      - id: step-understand-why
        action: >
          Flow coach reads the column's tooltip, or explains the number to someone in the standup who
          asks where it comes from.
        expected_output: >
          The explanation is one sentence with no statistics in it: of every item that was still open
          at this age, this fraction went on to take longer than the target. A coach can say it out
          loud in a standup without preparing.
        emotional_state: Credible — "I can defend this number to the person whose item it is"
        shared_artifacts: []

      - id: step-read-the-gradient
        status: "removed 2026-09-19 by round 2 (ADO #6034) — see D12"
        action: >
          Flow coach switches the aging chart's background control from "Pace percentiles" to
          "SLE Risk".
        expected_output: >
          The per-state coloured columns are replaced by full-width horizontal zones at the ages where
          risk crosses 25, 50, 75 and 100 percent. The 100% zone begins exactly at the SLE reference
          line the chart already draws. Dot colouring is untouched — blocked state and group still own
          the dot colour.
        emotional_state: Oriented — "the dots just under the 75% edge are the ones still worth
          saving; that is not something the deadline line alone could tell me"
        shared_artifacts:
          - PACE_BAND_COLORS_LOW_TO_HIGH (WorkItemAgingChart.tsx:60 — one palette across the chart
            background, the dialog column and the card chip, so a colour means one thing)
          - background mode (localStorage, migrated from the boolean workItemAgingPaceBandsEnabled)

      - id: step-put-it-where-the-work-is
        action: >
          Config admin configures a write-back mapping with value source "SLE Risk" on the team's Jira
          or Azure DevOps connection.
        expected_output: >
          After the next team update, the mapped field on each in-flight issue carries the integer
          percentage, so the team's own board filters and dashboards can sort and alert on breach risk
          without anyone opening Lighthouse. Items with no computable risk produce no write at all.
        emotional_state: Extended — "the signal reaches the people working the board, not just the
          people watching the dashboard"
        shared_artifacts:
          - WriteBackValueSource.SleRisk (new; team-scoped only per D4)
          - the team's configured history window and clock.Today (not the UI range). Round 1 named D6
            here while D6 said the opposite for the screens; round 2 made the screens match, so the
            write-back and the display now read the same window because there is only one

    error_paths_summary:
      - >-
        No SLE set on the owner: nothing is computed and nothing is rendered anywhere — no column, no
        chip, no chart mode, no write. Expected and common; this is deliberately an advanced feature
        for teams that have made a promise (D3).
      - >-
        Portfolio scope: identical to the no-SLE case. The dialog, card and chart are shared
        components that render on portfolio pages, and they must there behave exactly as today (D4).
      - >-
        Item older than every closed item in the window — SUPERSEDED 2026-09-19 by round 2 (#6037).
        Round 1 rendered "Beyond history" rather than a fabricated 100% and counted it as at-risk
        (D9). There is now no sentinel: an item still inside its target whose history holds nothing
        that ran as long reads 0, and the cell discloses that nothing the team finished ever ran this
        long. The cost is honest and written down — a thin history reads as a cliff, zero up to the
        target and a hundred the day after, with nothing in between to grade it.
      - >-
        Item already past the SLE range: reads 100% as the arithmetic result, not as a special case —
        every item in the denominator set necessarily exceeds R (D8). This is the Epic's scenario 3,
        subsumed.
      - >-
        Item at an age exactly equal to a closed item's cycle time: counted in the denominator. An
        item that took exactly R days met the SLE and is NOT counted as a breach. The single most
        likely place for an off-by-one to hide (D8).
      - >-
        Thin history: the denominator shrinks fast as the age grows, so one closed item entering or
        leaving the window can move a displayed risk sharply. This is the feature's load-bearing risk,
        not an edge case — it is slice 01's learning hypothesis and OUT-4127-risk-stability gates
        slices 02, 03 and 04 on it.
      - >-
        Chart zone boundaries collapsing onto one another on a thin history — REMOVED 2026-09-19
        with the zones themselves (D12). It was not an edge case in the end: on a thin history the
        chart drew no bands at all, in a mode the user had explicitly selected, with nothing saying
        why.
      - >-
        Upgrade with an existing pace-band preference: "true" resolves to Pace percentiles and "false"
        to Off, so no user's chart changes appearance (D12). STILL HOLDS after round 2 — that
        translation is the one migration the removal must not break. A preference of "risk", which
        only dev and dogfood browsers can be holding, resolves to Off.

    success_signal:
      - A flow coach intervenes on an item that had not yet breached, on the strength of the number —
        the whole point, and the thing OUT-4127-early-warning measures retrospectively.
      - The displayed risk is stable enough on real teams that it is read as fact rather than noise
        (OUT-4127-risk-stability). This gates everything built on top of it.
      - >-
        Zero reports of the At Risk widget disagreeing with the dialog column, or of a written-back
        tracker value disagreeing with the Lighthouse display for the same team and day
        (OUT-4127-no-support-contradiction) — the cross-system agreement D5 exists to guarantee.
        Round 2 found this had already failed once: a dialog read 27% against a board field reading
        18 for the same item on the same day, because the two callers derived their own windows. One
        window and one anchor, derived in one place, is slice 02's fix.
