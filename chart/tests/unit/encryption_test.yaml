suite: encryption key custody (slice-05)
# Greens milestone-28-an-install-that-names-no-key-is-refused.feature.
#
# helm-unittest renders with no cluster connection by construction — it is `helm template`, not
# `helm install`. So a failedTemplate here is not a stand-in by analogy for what ArgoCD does; it is
# literally the same render path, which is what makes it the right place to prove that no install can
# reach a shipped default key.
#
# Note this suite deliberately carries NO suite-level encryption fixture: supplying nothing is the
# case under test.
set:
  postgresql.auth.password: testpass
tests:
  # No template is pinned on the refusal cases. Helm stops the whole render at the first refusal, so
  # which template the failure is attributed to is an accident of render order rather than something
  # this chart decides - and an install is refused as a whole either way.
  - it: an install naming no key at all is refused, and told both ways forward
    asserts:
      - failedTemplate:
          errorPattern: "encryption.key or encryption.existingSecret is required"
      - failedTemplate:
          errorPattern: "--set encryption.key=\\$\\(openssl rand -base64 32\\)"
      - failedTemplate:
          errorPattern: "--set encryption.existingSecret="

  - it: naming both a key and a Secret that holds one is refused rather than resolved
    set:
      encryption.key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      encryption.existingSecret: lighthouse-encryption
    asserts:
      - failedTemplate:
          errorPattern: "only one of them can own the key"

  # The guard belongs to the install, not to the Secret the chart may or may not be rendering. A tenant
  # whose database and sign-in credentials are both owned by an external store renders no chart Secret
  # at all, and must still be refused.
  - it: an install whose other credentials are externally owned is still refused
    set:
      postgresql.auth.existingSecret: tenant-db
      oidc.enabled: true
      oidc.existingSecret: tenant-oidc
    asserts:
      - failedTemplate:
          errorPattern: "encryption.key or encryption.existingSecret is required"

  # The two guards that were already there keep saying exactly what they said. A new guard that fired
  # ahead of them would answer a question about scaling, or about a frontend mode, with a sentence
  # about encryption - so the guard is ordered behind both and this is what holds it there.
  - it: the frontend-mode refusal is unchanged by the new guard
    set:
      encryption.key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      frontend.mode: split
    template: templates/deployment-api.yaml
    asserts:
      - failedTemplate:
          errorMessage: "frontend.mode=split is not implemented in this chart version; use frontend.mode=embedded (ADR-081)"

  - it: the scaling refusal is unchanged by the new guard
    set:
      encryption.key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      replicaCount: 2
    template: templates/deployment-api.yaml
    asserts:
      - failedTemplate:
          errorPattern: "replicaCount>1 requires redis.connectionString"

  # --- Custody: where the key comes from, and how it reaches the container ---

  - it: a key supplied directly is carried in the release's own Secret
    set:
      encryption.key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
    template: templates/secret.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-lighthouse-encryption
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData.keys
          value: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

  - it: a Secret an external store owns leaves the chart rendering no key of its own
    set:
      encryption.existingSecret: tenant-encryption
    template: templates/secret.yaml
    asserts:
      # Only the database Secret is left: no encryption Secret is rendered at all, which is the whole
      # point of naming one an external store populates.
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-lighthouse-db

  - it: the volume points at the release's own Secret when the key was supplied
    set:
      encryption.key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
    template: templates/deployment-api.yaml
    asserts:
      - equal:
          path: spec.template.spec.volumes[?(@.name=='encryption-keys')].secret.secretName
          value: RELEASE-NAME-lighthouse-encryption

  - it: the volume points at the operator's Secret when they named one
    set:
      encryption.existingSecret: tenant-encryption
    template: templates/deployment-api.yaml
    asserts:
      - equal:
          path: spec.template.spec.volumes[?(@.name=='encryption-keys')].secret.secretName
          value: tenant-encryption

  # 0444 rather than 0400 on purpose: the runtime image ends on a non-root user, the chart sets no pod
  # security context, and a projected Secret file is owned by root. At owner-only the application
  # cannot open its own keys and the pod crash-loops. The trust boundary is a pod running one process.
  - it: the keys are mounted read-only, and readable by the non-root user the application runs as
    set:
      encryption.existingSecret: tenant-encryption
    template: templates/deployment-api.yaml
    asserts:
      - equal:
          path: spec.template.spec.volumes[?(@.name=='encryption-keys')].secret.defaultMode
          value: 292
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name=='encryption-keys')].mountPath
          value: /etc/lighthouse/encryption
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name=='encryption-keys')].readOnly
          value: true

  # A missing Secret must leave the pod unschedulable and visible in `kubectl describe`, not boot an
  # instance with no keys at all.
  - it: the projection is not optional
    set:
      encryption.existingSecret: tenant-encryption
    template: templates/deployment-api.yaml
    asserts:
      - notExists:
          path: spec.template.spec.volumes[?(@.name=='encryption-keys')].secret.optional

  - it: the container is told where to read the keys, and told it in the open
    set:
      encryption.existingSecret: tenant-encryption
    template: templates/configmap.yaml
    asserts:
      - equal:
          path: data.Encryption__KeysFile
          value: /etc/lighthouse/encryption/keys
      # Left unsaid unless an operator says otherwise, so the application's own default is the one
      # answer rather than a number the chart repeats and can then disagree with.
      - notExists:
          path: data.Encryption__KeysReloadSeconds

  - it: an operator whose secret store is slow can widen the interval
    set:
      encryption.existingSecret: tenant-encryption
      encryption.keysReloadSeconds: 120
    template: templates/configmap.yaml
    asserts:
      - equal:
          path: data.Encryption__KeysReloadSeconds
          value: "120"

  # The path is not key material, so it belongs with the rest of the non-secret configuration. What
  # must never appear anywhere is the key itself, in a ConfigMap or in the container's environment,
  # where a process dump would carry it.
  - it: no environment variable on the container is the key
    set:
      encryption.key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
    template: templates/deployment-api.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: Encryption__Key
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: Encryption__Keys
          any: true

  # The ring is a mounted file precisely so that a key an operator adds is noticed without the pod
  # being restarted. Watching that Secret for changes would roll the pod on every rotation and trade
  # away the property the mount was chosen for.
  - it: a tenant whose only managed credential is the encryption Secret is never rolled for it
    set:
      encryption.existingSecret: tenant-encryption
    template: templates/deployment-api.yaml
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["secret.reloader.stakater.com/reload"]
      - notExists:
          path: spec.template.metadata.annotations["checksum/config"]

  - it: the database and sign-in credentials still travel exactly as they did
    set:
      encryption.existingSecret: tenant-encryption
      oidc.enabled: true
      oidc.issuer: https://idp.example
      oidc.clientId: lighthouse
      oidc.clientSecret: sso-secret
      ingress.host: lh.example
    template: templates/deployment-api.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=='Database__ConnectionString')].valueFrom.secretKeyRef.key
          value: Database__ConnectionString
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=='Authentication__ClientSecret')].valueFrom.secretKeyRef.key
          value: Authentication__ClientSecret
