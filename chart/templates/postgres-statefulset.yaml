{{- if .Values.postgresql.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "lighthouse.postgres.host" . }}
  labels:
    {{- include "lighthouse.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "lighthouse.postgres.host" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "lighthouse.postgres.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lighthouse.postgres.selectorLabels" . | nindent 8 }}
    spec:
      # A new Postgres major cannot open the previous major's data. These two steps run before every
      # start: the first hands over the previous major's programs, the second picks the data directory
      # and, when the data is one major behind, upgrades a copy of it beside the original.
      initContainers:
        - name: pg-old-binaries
          image: {{ include "lighthouse.postgres.upgradeImage" . | quote }}
          command: ["gosu", "postgres", "bash", "/lighthouse-postgres/copy-old-binaries.sh"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: upgrade-scripts
              mountPath: /lighthouse-postgres
            - name: old-binaries
              mountPath: /old-binaries
        - name: pg-upgrade
          image: {{ .Values.postgresql.image | quote }}
          command: ["bash", "/lighthouse-postgres/upgrade.sh"]
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: upgrade-scripts
              mountPath: /lighthouse-postgres
            - name: old-binaries
              mountPath: /old-binaries
            - name: upgrade-decision
              mountPath: /decision
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image | quote }}
          command: ["bash", "/lighthouse-postgres/start.sh"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "lighthouse.db.secretName" . }}
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: upgrade-scripts
              mountPath: /lighthouse-postgres
            - name: upgrade-decision
              mountPath: /decision
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}, "-d", {{ .Values.postgresql.auth.database | quote }}]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}, "-d", {{ .Values.postgresql.auth.database | quote }}]
            periodSeconds: 10
      volumes:
        - name: upgrade-scripts
          configMap:
            name: {{ include "lighthouse.postgres.upgradeScripts" . }}
        - name: old-binaries
          emptyDir: {}
        - name: upgrade-decision
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
{{- end }}
