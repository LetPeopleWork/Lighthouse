name: Helm Chart

# epic-5306 slice-04 — chart lifecycle (ADR-083). Standalone workflow for the new "chart" concern,
# matching the repo's split-by-concern workflows. `validate` runs on every chart change. `publish`
# packages + indexes into docs/charts/ and commits, so the existing pages.yml serves it (one Pages
# source per repo). Publishing is gated on the `Release` GitHub environment — the SAME approval gate
# as the server release (ci_release.yml) and analogous to the lighthouse-clients publish flow: a push
# to main that carries a NOT-yet-published Chart.yaml version auto-requests publish and waits for a
# maintainer to approve the gate (no separate manual run). `detect-publish` suppresses the gate for
# chart edits that don't bump the version (docs/template tweaks). A `workflow_dispatch` with
# publish=true forces a (still version-guarded) republish for backfills.

on:
  push:
    branches: [main]
    paths:
      - "chart/**"
      - ".github/workflows/ci_chart.yml"
  pull_request:
    paths:
      - "chart/**"
      - ".github/workflows/ci_chart.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Package + index + commit the chart to docs/charts/ (publish)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3

      - name: helm lint (default + enterprise values)
        run: |
          helm lint ./chart
          helm lint ./chart -f ./chart/values-enterprise.yaml \
            --set postgresql.auth.password=ci --set oidc.clientSecret=ci

      - name: Install helm-unittest plugin
        # v1.0.3 is the last release whose plugin.yaml predates the helm-v4-only `platformHooks`
        # field, so it loads + registers the `unittest` command on helm v3 (v1.1.x does not).
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.0.3 || helm plugin list

      - name: helm unittest (incl. standalone-gate render guard)
        run: helm unittest -f 'tests/unit/*.yaml' ./chart

      - name: Standalone gate — default values render exactly one API workload, postgres provider
        env:
          # Any 32 bytes will do here: the chart never looks at the value, only at whether one of the
          # two ways to own the key was named. A render without it is refused, which is the point.
          CI_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        run: |
          set -euo pipefail
          render="$(helm template l8e ./chart --set postgresql.auth.password=ci --set encryption.key="$CI_ENCRYPTION_KEY")"
          deploys="$(printf '%s\n' "$render" | grep -c '^kind: Deployment' || true)"
          [ "$deploys" = "1" ] || { echo "standalone gate: expected 1 Deployment, got $deploys"; exit 1; }
          printf '%s\n' "$render" | grep -qE 'Database__Provider' || { echo "standalone gate: Database__Provider missing"; exit 1; }
          # The provider value must be postgres and never sqlite (Postgres-only chart, ADR-080).
          printf '%s\n' "$render" | grep -iE '[:=]\s*"?sqlite' && { echo "standalone gate: chart must never set provider sqlite"; exit 1; }
          printf '%s\n' "$render" | grep -A1 'Database__Provider' | grep -qi 'postgres' || { echo "standalone gate: provider is not postgres"; exit 1; }
          echo "standalone gate OK"

      - name: No template can invent an encryption key
        # The chart refuses to render without a key rather than generating one, because the only
        # mechanism for generate-once asks the cluster what already exists and comes back empty on
        # every render with no cluster to ask - which is every ArgoCD sync. A generator smuggled back
        # in would mint a fresh key per sync and orphan a tenant's whole credential set. Rendering
        # twice cannot catch that: a lookup-guarded generator renders the same empty answer every time
        # and still mints on a real install. So the templates are read directly.
        run: |
          set -euo pipefail
          # Matched inside a template action rather than anywhere in the file, so that prose naming
          # these functions - including the comment next to the guard explaining why none of them is
          # used - is not mistaken for a call to one.
          if grep -nE '\{\{[^}]*\b(randAlphaNum|randBytes|randAscii|uuidv4|genPrivateKey|derivePassword|lookup)\b' chart/templates/*.yaml chart/templates/*.tpl; then
            echo "a template can invent a value; the encryption key must be supplied, never generated"
            exit 1
          fi
          echo "no-generation gate OK"

      - name: The same values render the same manifests
        # Upgrade safety is structural rather than defended: nothing is minted, so nothing can be
        # regenerated. This is what holds that property - two renders of identical values, compared
        # byte for byte.
        env:
          CI_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        run: |
          set -euo pipefail
          args=(l8e ./chart --set postgresql.auth.password=ci --set encryption.key="$CI_ENCRYPTION_KEY")
          helm template "${args[@]}" > /tmp/render-1.yaml
          helm template "${args[@]}" > /tmp/render-2.yaml
          diff -u /tmp/render-1.yaml /tmp/render-2.yaml \
            || { echo "two renders of identical values differ; something in the chart is not deterministic"; exit 1; }
          echo "render determinism gate OK"

      - name: config-ref drift gate (helm-docs is regenerated; README must already match)
        # ADR-084 — the chart/README.md Values table is generated from values.yaml `# --` comments.
        # Regenerate with the pinned helm-docs and fail if it differs from the committed file, so a
        # renamed/added/removed values key without a regen is caught before publish (zero phantom keys).
        env:
          HELM_DOCS_VERSION: 1.14.2
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C /tmp helm-docs
          /tmp/helm-docs --chart-search-root chart --skip-version-footer -s file --ignore-non-descriptions
          git diff --exit-code -- chart/README.md \
            || { echo "config-ref drift: chart/README.md is stale — run helm-docs and commit (see chart/README.md.gotmpl)"; exit 1; }
          echo "config-ref drift gate OK"

  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: lighthouse-chart-smoke

      - name: helm install (bundled Postgres, embedded SPA, no ingress) into kind
        env:
          CI_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        run: |
          helm install l8e ./chart \
            --set ingress.enabled=false \
            --set postgresql.auth.password=ci \
            --set encryption.key="$CI_ENCRYPTION_KEY" \
            --wait --timeout 5m
          kubectl get pods -o wide

      - name: Assert all workloads Ready
        run: |
          kubectl rollout status deploy -l app.kubernetes.io/instance=l8e --timeout=300s
          kubectl rollout status statefulset -l app.kubernetes.io/instance=l8e --timeout=300s

      - name: Assert API serves /health/ready and the SPA
        run: |
          set -euo pipefail
          kubectl port-forward svc/l8e-lighthouse-api 8080:80 >/tmp/pf.log 2>&1 &
          pf=$!; sleep 5
          curl -fsS http://127.0.0.1:8080/health/ready
          curl -fsS http://127.0.0.1:8080/ | grep -q '<title>Lighthouse</title>'
          kill $pf || true

      # The path every tenant on the platform actually uses, and the only one where a real kubelet
      # decides two things no render can: whether a projected Secret file is readable by the non-root
      # user the application runs as, and whether the volume resolves to the Secret an operator made
      # rather than to one the chart owns. Installed into the same cluster, so it costs a Secret and
      # an install rather than a second kind.
      - name: helm install, with the key owned by a Secret the operator made
        env:
          CI_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        run: |
          set -euo pipefail
          kubectl create namespace tenant
          kubectl -n tenant create secret generic tenant-encryption \
            --from-literal=keys="k-ci-01:$CI_ENCRYPTION_KEY"
          helm install tenant ./chart \
            --namespace tenant \
            --set ingress.enabled=false \
            --set postgresql.auth.password=ci \
            --set encryption.existingSecret=tenant-encryption \
            --wait --timeout 5m
          kubectl -n tenant rollout status deploy -l app.kubernetes.io/instance=tenant --timeout=300s

      - name: The operator's key reaches the container, and the user it runs as can read it
        # This asserts the projection, not what the application makes of it. The chart pins appVersion
        # to the last RELEASED image, so a chart job installs an application that predates whatever is
        # unreleased on main - it cannot be asked whether it reports the right custody. What a real
        # kubelet does decide here, and nothing else can, is whether a Secret projected at 0444 into a
        # container whose user is not root is readable at all. At 0400 it is not, and the pod
        # crash-loops. Whether the instance then reports the right custody is a dogfood question,
        # answered on Tenant Zero against an image built from main.
        run: |
          set -euo pipefail
          kubectl -n tenant exec deploy/tenant-lighthouse-api -c api -- id | grep -qv 'uid=0(' \
            || { echo "the runtime user is root, so this proves nothing about a non-root read"; exit 1; }
          kubectl -n tenant exec deploy/tenant-lighthouse-api -c api -- \
            sh -c 'cat "$Encryption__KeysFile" > /dev/null' \
            || { echo "the projected key file is not readable by the user the application runs as"; exit 1; }
          kubectl -n tenant exec deploy/tenant-lighthouse-api -c api -- \
            sh -c 'grep -q "^k-ci-01:" "$Encryption__KeysFile"' \
            || { echo "the mounted file is not the key the operator's Secret carries"; exit 1; }
          echo "external-secret projection OK"

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl describe pods -l app.kubernetes.io/instance=l8e || true
          kubectl logs -l app.kubernetes.io/instance=l8e --tail=200 --all-containers || true
          kubectl -n tenant describe pods -l app.kubernetes.io/instance=tenant || true
          kubectl -n tenant logs -l app.kubernetes.io/instance=tenant --tail=200 --all-containers || true

  # Decide whether there is a new chart version to publish, so the Release gate only appears when
  # there is actually something to ship. On a push to main: "Chart.yaml version not yet in
  # docs/charts/index.yaml". On workflow_dispatch: honour the publish input (the version-guard in
  # publish.sh still blocks a real overwrite, so forcing it is safe). Never on pull_request.
  detect-publish:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.decide.outputs.should_publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3

      - name: Decide whether a new chart version needs publishing
        id: decide
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "workflow_dispatch: publish input = ${{ inputs.publish }}"
            echo "should_publish=${{ inputs.publish }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(helm show chart ./chart | awk '/^version:/ {print $2; exit}' | tr -d '"')"
          if grep -qE "version:[[:space:]]*${version//./\\.}([^0-9]|$)" docs/charts/index.yaml 2>/dev/null; then
            echo "chart $version is already published — no publish needed, no gate"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "chart $version is not yet published — requesting Release-gated publish"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: [validate, install-smoke, detect-publish]
    if: needs.detect-publish.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    # Reuse the server release gate: publishing the chart waits for the same maintainer approval
    # as ci_release.yml. Configure required reviewers on the `Release` environment in repo settings.
    environment:
      name: Release
    permissions:
      contents: write
    steps:
      # Check out with a maintainer PAT (same secret ci_release.yml uses for the GitHub Release).
      # The publish step pushes a commit to main, and main's ruleset requires 7 status checks;
      # only Admin/Maintain roles bypass it. The default GITHUB_TOKEN (GitHub Actions) is NOT a
      # ruleset bypass actor and cannot be added as one (422: "integration must be part of the
      # ruleset source or owner organization"), so the push must authenticate as an admin user.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ secrets.RELEASE_CREATION_TOKEN }}

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3

      - name: Guard + package + index into docs/charts/
        # version-guard refuses to overwrite an already-published version and asserts
        # Chart.yaml == README == NOTES.txt == values-enterprise image.tag (appVersion).
        run: ./chart/scripts/publish.sh

      - name: Commit the published chart (pages.yml serves docs/charts/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          version="$(helm show chart ./chart | awk '/^version:/ {print $2; exit}')"
          git add docs/charts
          git commit -m "chore(chart): publish lighthouse-${version} to docs/charts (ADR-083)"
          git push origin HEAD:main
