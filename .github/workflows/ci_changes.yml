name: Check for changes
on:
  workflow_call:
    outputs:
      backend:
        value: ${{ jobs.changes.outputs.backend }}
      frontend:
        value: ${{ jobs.changes.outputs.frontend }}
      e2e:
        value: ${{ jobs.changes.outputs.e2e }}
      jira_connector:
        value: ${{ jobs.changes.outputs.jira_connector }}
      ado_connector:
        value: ${{ jobs.changes.outputs.ado_connector }}
      linear_connector:
        value: ${{ jobs.changes.outputs.linear_connector }}
      servicenow_connector:
        value: ${{ jobs.changes.outputs.servicenow_connector }}
      github_connector:
        value: ${{ jobs.changes.outputs.github_connector }}
      connector_shared:
        value: ${{ jobs.changes.outputs.connector_shared }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
      e2e: ${{ steps.check.outputs.e2e }}
      jira_connector: ${{ steps.check.outputs.jira_connector }}
      ado_connector: ${{ steps.check.outputs.ado_connector }}
      linear_connector: ${{ steps.check.outputs.linear_connector }}
      servicenow_connector: ${{ steps.check.outputs.servicenow_connector }}
      github_connector: ${{ steps.check.outputs.github_connector }}
      connector_shared: ${{ steps.check.outputs.connector_shared }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
    
      - name: Find last successful workflow run
        id: last_success
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v9
        with:
          script: |
            const workflow_id = 'ci.yml';
            const branch = 'main';

            let page = 1;
            const per_page = 100;
            let foundCommit = null;

            // This listing has been observed serving a view missing the most recent ten days of
            // runs. The walk below then finds its first match weeks back, the diff widens to over a
            // thousand commits, and every change looks like it touched a shared connector path - so
            // one vendor being down reddens an unrelated push. The current run is itself a run of
            // this workflow on this branch, so a listing that does not reach it is provably stale
            // and worth asking again for.
            async function listRunsPage(p) {
              for (let attempt = 1; attempt <= 3; attempt++) {
                const res = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflow_id,
                  branch: branch,
                  per_page: per_page,
                  page: p
                });
                if (p > 1 || res.data.workflow_runs.length === 0) return res;
                const reachesNow = res.data.workflow_runs.some(r => r.id === context.runId);
                if (reachesNow) return res;
                console.log(`Run listing did not include this run (attempt ${attempt}/3) - stale read, retrying`);
                await new Promise(r => setTimeout(r, 5000 * attempt));
              }
              console.log('WARNING: run listing never included this run; the base ref may be far older than it should be');
              return await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow_id,
                branch: branch,
                per_page: per_page,
                page: p
              });
            }

            // Paginate through workflow runs
            while (!foundCommit) {
              // Get workflow runs for this workflow on main branch (no status filter to include in-progress runs)
              const runs = await listRunsPage(page);

              // If no more runs, break
              if (runs.data.workflow_runs.length === 0) {
                console.log('No more workflow runs to check');
                break;
              }
              
              // Find the last run where both verify stages succeeded
              for (const run of runs.data.workflow_runs) {
                // Skip the current run
                if (run.id === context.runId) continue;
                
                // Get jobs for this run
                const jobs = await github.rest.actions.listJobsForWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
                
                // Check if both verify stages succeeded (even if the overall workflow is still in progress)
                const sqliteVerify = jobs.data.jobs.find(j => j.name.includes('sqlite'));
                const postgresVerify = jobs.data.jobs.find(j => j.name.includes('postgres'));
              
                
                if (sqliteVerify?.conclusion === 'success' && postgresVerify?.conclusion === 'success') {
                  console.log(`Found last successful run: ${run.id} (status: ${run.status}) at commit ${run.head_sha}`);
                  foundCommit = run.head_sha;
                  break;
                }
              }
              
              // If we found a commit, break out of pagination loop
              if (foundCommit) break;
              
              // Move to next page
              page++;
              
              // Safety limit to prevent infinite loops (adjust as needed)
              if (page > 10) {
                console.log('Reached page limit (1000 runs checked), stopping search');
                break;
              }
            }
            
            if (foundCommit) {
              core.setOutput('commit_sha', foundCommit);
            } else {
              // Fallback to the previous commit if no successful run found
              console.log('No previous successful run found, using HEAD^');
              core.setOutput('commit_sha', '');
            }
            
            return foundCommit || '';
      
      - name: Check for changes
        id: check
        run: |
          base_ref=${{ github.base_ref }}
          
          if [ -z "$base_ref" ]; then
            if [ "${{ github.ref }}" == "refs/heads/main" ]; then
              # On main branch, use the last successful workflow commit
              last_success_sha="${{ steps.last_success.outputs.commit_sha }}"
              if [ -n "$last_success_sha" ]; then
                # Check if the commit actually exists (handles force push scenarios)
                if git cat-file -e "$last_success_sha" 2>/dev/null; then
                  base_ref="$last_success_sha"
                  echo "Comparing against last successful workflow run at: $base_ref"
                  # A window this wide always spans a shared connector path, which force-fulls every
                  # live connector suite for a change that touched none of them. Say so here, where
                  # whoever is reading a red Linear job on a Jira change will see it.
                  span=$(git rev-list --count "$base_ref..HEAD" 2>/dev/null || echo 0)
                  echo "Base is $span commit(s) behind HEAD (base dated $(git log -1 --format=%cs "$base_ref" 2>/dev/null))"
                  if [ "$span" -gt 200 ]; then
                    echo "::warning::Change-detection base is $span commits behind. Every connector suite will run regardless of what this change touched; a stale run listing is the usual cause."
                  fi
                else
                  echo "Warning: Last successful commit $last_success_sha not found in repository"
                  echo "This can happen after a force push that rewrote history"
                  echo "Falling back to previous commit"
                  base_ref=$(git rev-parse HEAD^)
                fi
              else
                # Fallback to previous commit if no successful run found
                base_ref=$(git rev-parse HEAD^)
                echo "No previous successful run found, comparing against: $base_ref"
              fi
            else
              # Default to checking against the previous commit on other branches
              base_ref=$(git rev-parse HEAD^)
            fi
          else
            git fetch origin $base_ref
            base_ref="origin/$base_ref"
          fi
          
          # Print all changed files
          echo "Changed files:"
          git diff --name-only $base_ref HEAD
          
          github_changes=$(git diff --name-only $base_ref HEAD | grep -q ^.github/workflows/ci.*\.yml && echo 'true' || echo 'false')
          backend=$(git diff --name-only $base_ref HEAD | grep -Eq '^Lighthouse.Backend(/|.Tests/)' || [ "$github_changes" == "true" ] && echo 'true' || echo 'false')
          frontend=$(git diff --name-only $base_ref HEAD | grep -Eq '^(Lighthouse.Frontend/|\.nvmrc$)' || [ "$github_changes" == "true" ] && echo 'true' || echo 'false')
          e2e=$(git diff --name-only $base_ref HEAD | grep -Eq '^(Lighthouse.EndToEndTests/|\.nvmrc$)' || [ "$github_changes" == "true" ] && echo 'true' || echo 'false')

          # Per-connector path detection (slice-03b / CS-H). Workflow file changes
          # propagate to every output so a ci.*.yml edit reruns everything.
          . Scripts/test-selection/path-classifier.sh
          diff_list=$(git diff --name-only $base_ref HEAD)
          jira_connector=$(classify_jira "$diff_list")
          ado_connector=$(classify_ado "$diff_list")
          linear_connector=$(classify_linear "$diff_list")
          servicenow_connector=$(classify_servicenow "$diff_list")
          github_connector=$(classify_github "$diff_list")
          connector_shared=$(classify_shared "$diff_list")
          if [ "$github_changes" == "true" ]; then
            jira_connector="true"
            ado_connector="true"
            linear_connector="true"
            servicenow_connector="true"
            github_connector="true"
            connector_shared="true"
          fi

          echo "backend=$backend"
          echo "frontend=$frontend"
          echo "e2e=$e2e"
          echo "jira_connector=$jira_connector"
          echo "ado_connector=$ado_connector"
          echo "linear_connector=$linear_connector"
          echo "servicenow_connector=$servicenow_connector"
          echo "github_connector=$github_connector"
          echo "connector_shared=$connector_shared"

          echo "backend=$backend" >> $GITHUB_OUTPUT
          echo "frontend=$frontend" >> $GITHUB_OUTPUT
          echo "jira_connector=$jira_connector" >> $GITHUB_OUTPUT
          echo "ado_connector=$ado_connector" >> $GITHUB_OUTPUT
          echo "linear_connector=$linear_connector" >> $GITHUB_OUTPUT
          echo "servicenow_connector=$servicenow_connector" >> $GITHUB_OUTPUT
          echo "github_connector=$github_connector" >> $GITHUB_OUTPUT
          echo "connector_shared=$connector_shared" >> $GITHUB_OUTPUT
          echo "e2e=$e2e" >> $GITHUB_OUTPUT