name: Verify Workflow Scripts

on:
  workflow_call:

jobs:
  workflow-scripts:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      # Node 24 cannot take a directory here — it tries to load the path as a
      # module and dies with MODULE_NOT_FOUND. Naming the files survives that.
      - name: Run workflow script tests
        run: node --test .github/scripts/*.test.mjs
