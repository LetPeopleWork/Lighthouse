name: Verify Frontend

on:
  workflow_call:
    inputs:
      frontend:
        required: true
        type: string

jobs:
  frontend:
    if: inputs.frontend == 'true'
    runs-on: ubuntu-latest
    env:
      # What a single test that runs over its time limit does: LIGHTHOUSE_TIME_BUDGET unset fails the
      # test, "warn" reports it, "off" skips the check. Set the repository variable to switch.
      # The per-file budget below has its own switch, LIGHTHOUSE_BUDGET_WARN_ONLY.
      LIGHTHOUSE_TIME_BUDGET: ${{ vars.LIGHTHOUSE_TIME_BUDGET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'
      
      - name: Build Frontend (composite)
        uses: ./.github/actions/build-frontend
        with:
          run-tests: 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Extract frontend per-test timings
        if: always()
        run: |
          VITEST_JSON=./Lighthouse.Frontend/test-results.json
          if [ ! -f "$VITEST_JSON" ]; then
            echo "Vitest JSON reporter output not found at $VITEST_JSON; skipping."
            exit 0
          fi
          python3 Scripts/test-timings/vitest_to_csv.py \
            --input "$VITEST_JSON" \
            --source-root "$(pwd)/Lighthouse.Frontend" \
            --output test-timings-frontend.csv
          echo "--- top 20 slowest frontend tests ---"
          python3 Scripts/test-timings/summarise.py --top 20 "$VITEST_JSON"

      - name: Upload frontend per-test timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-timings-frontend
          path: test-timings-frontend.csv
          if-no-files-found: warn

      - name: Upload Sonar report metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-report-frontend
          path: ./Lighthouse.Frontend/.scannerwork/report-task.txt

      # A test file over its time budget fails the build. The limits were measured on runs that collected
      # coverage, which are slower, so they are looser on today's plain run until they are measured again.
      # To report it as a warning instead, set the repository variable LIGHTHOUSE_BUDGET_WARN_ONLY
      # to true; empty, unset or false enforces. Any other value fails this step.
      - name: Check test-time budget
        env:
          BUDGET_WARN_ONLY: ${{ vars.LIGHTHOUSE_BUDGET_WARN_ONLY }}
        run: |
          python3 --version
          python3 -m unittest discover -s Scripts/test-timings/tests
          case "$BUDGET_WARN_ONLY" in
            true)
              python3 Scripts/test-timings/check_budget.py --stack frontend --csv test-timings-frontend.csv --warn-only
              ;;
            ""|false)
              python3 Scripts/test-timings/check_budget.py --stack frontend --csv test-timings-frontend.csv
              ;;
            *)
              echo "::error::LIGHTHOUSE_BUDGET_WARN_ONLY must be empty, true or false (got '$BUDGET_WARN_ONLY')"
              exit 1
              ;;
          esac
