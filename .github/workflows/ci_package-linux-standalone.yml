name: Package Linux Standalone (Tauri AppImage)

on:
  workflow_call:
    inputs:
      fileversion:
        required: true
        type: string
      version:
        required: true
        type: string

jobs:
  package-linux-standalone:
    runs-on: ubuntu-latest
    container: ubuntu:24.04@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: write

    environment:
      name: "Package and Sign"

    steps:
      - name: Install build packages
        run: |
          apt-get update
          apt-get install -y \
            ca-certificates \
            curl \
            wget \
            file \
            git \
            jq \
            binutils \
            build-essential \
            pkg-config \
            libssl-dev \
            libxdo-dev \
            xz-utils \
            xdg-utils \
            libwebkit2gtk-4.1-0 \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-0 \
            libjavascriptcoregtk-4.1-dev \
            gir1.2-javascriptcoregtk-4.1 \
            gir1.2-webkit2-4.1 \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
          dpkg-query -W libwebkit2gtk-4.1-0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: Lighthouse.Frontend/package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: './Lighthouse.Frontend/pnpm-lock.yaml'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: ./Lighthouse.Frontend

      - name: Download SBOM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Lighthouse-SBOM-${{ inputs.version }}
          path: ./sbom-download

      - name: Copy SBOM files to frontend public directory
        run: |
          mkdir -p ./Lighthouse.Frontend/public/sbom
          cp ./sbom-download/lighthouse-backend-sbom.cdx.json ./Lighthouse.Frontend/public/sbom/backend.cdx.json
          cp ./sbom-download/lighthouse-frontend-sbom.cdx.json ./Lighthouse.Frontend/public/sbom/frontend.cdx.json

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Lighthouse-linux-x64-${{ inputs.version }}
          path: ./Lighthouse/linux-x64

      - name: Place sidecar binary and resources for Tauri
        run: |
            TARGET_TRIPLE="x86_64-unknown-linux-gnu"
            SIDECAR_DIR="./Lighthouse.Frontend/src-tauri/binaries"
            RESOURCES_DIR="./Lighthouse.Frontend/src-tauri/resources"
            
            mkdir -p "${SIDECAR_DIR}"
            mkdir -p "${RESOURCES_DIR}"

            # The licence travels with the app, not only with the repository.
            cp LICENSE NOTICE "${RESOURCES_DIR}/"
            
            # Sidecar binary
            cp ./Lighthouse/linux-x64/Lighthouse "${SIDECAR_DIR}/Lighthouse.Backend-${TARGET_TRIPLE}"
            chmod +x "${SIDECAR_DIR}/Lighthouse.Backend-${TARGET_TRIPLE}"
            
            # Everything else as resources
            cp -r ./Lighthouse/linux-x64/. "${RESOURCES_DIR}/"
            rm "${RESOURCES_DIR}/Lighthouse"  # remove the binary itself, it's already the sidecar

      - name: Update Tauri Version
        shell: bash
        run: |
            TARGET_FILE="Lighthouse.Frontend/src-tauri/tauri.conf.json"
            if [ -f "$TARGET_FILE" ]; then
            FULL_VERSION="${{ inputs.fileversion }}"
            SEMVER=$(echo "$FULL_VERSION" | awk -F'.' '{print $1"."$2"."$3$4}')
            jq --arg v "$SEMVER" '.version = $v' "$TARGET_FILE" > tmp.json && mv tmp.json "$TARGET_FILE"
            echo "Successfully updated version to $SEMVER in $TARGET_FILE"
            else
            echo "Error: $TARGET_FILE not found!"
            exit 1
            fi

      - name: Build Tauri AppImage
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          projectPath: ./Lighthouse.Frontend

      - name: Find and rename AppImage
        id: find-appimage
        run: |
          APPIMAGE=$(find ./Lighthouse.Frontend/src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "ERROR: No AppImage found in Tauri build output"
            ls -la ./Lighthouse.Frontend/src-tauri/target/release/bundle/ || true
            exit 1
          fi
          echo "Found AppImage: ${APPIMAGE}"
          cp "${APPIMAGE}" ./Lighthouse-standalone.AppImage
          echo "appimage_path=./Lighthouse-standalone.AppImage" >> "$GITHUB_OUTPUT"

          APPIMAGE_SIG=$(find ./Lighthouse.Frontend/src-tauri/target/release/bundle/appimage -name "*.AppImage.sig" ! -name "*.tar.gz.sig" | head -1)
          if [ -n "$APPIMAGE_SIG" ]; then
            cp "$APPIMAGE_SIG" ./Lighthouse-standalone.AppImage.sig
            echo "Copied updater signature: $(basename "$APPIMAGE_SIG")"
          else
            echo "WARN: No AppImage updater sig found"
          fi

      - name: Run Tauri shell unit tests
        run: cargo test --manifest-path Lighthouse.Frontend/src-tauri/Cargo.toml --lib

      - name: Reject an AppImage that bundles libssl
        shell: bash
        env:
          APPIMAGE: ${{ steps.find-appimage.outputs.appimage_path }}
        run: |
          APPIMAGE_PATH="$(realpath "$APPIMAGE")"
          chmod +x "$APPIMAGE_PATH"
          cd "$RUNNER_TEMP"
          "$APPIMAGE_PATH" --appimage-extract > /dev/null
          EXTRACTED="$RUNNER_TEMP/squashfs-root"

          # The backend's RUNPATH points into the AppImage's lib directory, so a bundled
          # libssl would replace the host's OpenSSL. A bundled libcrypto alone cannot reach it.
          find "$EXTRACTED" -name 'libcrypto.so*' | while read -r LIB; do
            echo "::notice::AppImage bundles ${LIB#"$EXTRACTED"/}"
          done
          LIBSSL=$(find "$EXTRACTED" -name 'libssl.so*')
          if [ -n "$LIBSSL" ]; then
            echo "::error::AppImage bundles libssl, which the backend would load in place of the host's OpenSSL: ${LIBSSL//"$EXTRACTED"\//}"
            exit 1
          fi
          echo "No libssl bundled in the AppImage"

      - name: Reject an AppImage that needs a newer glibc than the floor
        shell: bash
        run: bash tools/linux-appimage/check-glibc-floor.sh "$RUNNER_TEMP/squashfs-root"

      - name: Upload Linux standalone artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Lighthouse-linux-standalone-${{ inputs.version }}
          path: |
            ./Lighthouse-standalone.AppImage
            ./Lighthouse-standalone.AppImage.sig

  verify-appimage-loads:
    runs-on: ubuntu-latest
    needs: package-linux-standalone
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5
          - debian:13@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Lighthouse-linux-standalone-${{ inputs.version }}
          path: ./appimage

      - name: Check the AppImage resolves its libraries on ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
        run: bash tools/linux-appimage/check-loads-on.sh "$IMAGE" ./appimage/Lighthouse-standalone.AppImage
