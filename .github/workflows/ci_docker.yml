name: Docker

on:
  workflow_call:
    inputs:
      fileversion:
        required: true
        type: string
      version:
        required: true
        type: string

jobs:
  docker:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    permissions:
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Download SBOM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Lighthouse-SBOM-${{ inputs.version }}
          path: ./sbom-download

      - name: Copy SBOM files to frontend public directory
        run: |
          mkdir -p ./Lighthouse.Frontend/public/sbom
          cp ./sbom-download/lighthouse-backend-sbom.cdx.json ./Lighthouse.Frontend/public/sbom/backend.cdx.json
          cp ./sbom-download/lighthouse-frontend-sbom.cdx.json ./Lighthouse.Frontend/public/sbom/frontend.cdx.json

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Automatically sets up the default builder
          use: true    

      - name: Build and push multi-platform Docker image
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          VERSION=${{ inputs.fileversion }}

          # Define platforms you want to support
          PLATFORMS="linux/amd64,linux/arm64"

          # Build and push the multi-platform image
          docker buildx build --platform $PLATFORMS --no-cache \
            --file Dockerfile \
            --tag ghcr.io/$REPO_NAME:$VERSION \
            --tag ghcr.io/$REPO_NAME:dev-latest \
            --build-arg VERSION=$VERSION \
            --build-arg NODE_VERSION=$(cat .nvmrc) \
            --push .

      - name: Pull and verify Docker image
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          VERSION=${{ inputs.fileversion }}
          
          # Pull the amd64 version for testing
          docker pull --platform linux/amd64 ghcr.io/$REPO_NAME:$VERSION

      - name: Run Docker container for health check
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          VERSION=${{ inputs.fileversion }}
          
          # Run container in detached mode with SQLite
          docker run -d --name lighthouse-test \
            -p 443:443 \
            -e Database__Provider=sqlite \
            -e UsageData__CollectorBaseUrl=http://127.0.0.1:9 \
            -e Database__ConnectionString="Data Source=lighthouse.db" \
            ghcr.io/$REPO_NAME:$VERSION

      - name: Wait for Lighthouse to start
        run: |
          echo "Waiting for server to be ready..."
          timeout 30 bash -c 'until curl --silent --fail --insecure https://localhost:443/api/latest/systeminfo; do sleep 1; done'
          echo "Server is ready!"

      - name: Check the container runs on .NET 11
        run: |
          runtime=$(curl --silent --fail --insecure https://localhost:443/api/latest/systeminfo | jq -r '.runtime // .Runtime')
          echo "Runtime reported by the container: $runtime"
          case "$runtime" in
            ".NET 11"*) ;;
            *) echo "Expected a runtime that starts with .NET 11, got: $runtime"; exit 1 ;;
          esac

      - name: Check the container sends compressed answers only when asked
        run: |
          asset=$(curl --silent --fail --insecure https://localhost:443/ | grep -o '/assets/[^"]*\.js' | head -n 1)
          if [ -z "$asset" ]; then echo "No /assets/*.js found in the page shell"; exit 1; fi
          echo "Checking $asset"
          encoding=$(curl --silent --fail --insecure --output /dev/null --dump-header - -H "Accept-Encoding: br" "https://localhost:443$asset" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-encoding" {print $2}')
          if [ "$encoding" != "br" ]; then echo "Expected content-encoding br for $asset, got: '$encoding'"; exit 1; fi
          plain=$(curl --silent --fail --insecure --output /dev/null --dump-header - https://localhost:443/api/latest/systeminfo | tr -d '\r' | awk -F': ' 'tolower($1)=="content-encoding" {print $2}')
          if [ -n "$plain" ]; then echo "Expected no content-encoding on systeminfo without Accept-Encoding, got: '$plain'"; exit 1; fi

      - name: Cleanup test container
        if: always()
        run: |
          echo "Container logs:"
          docker logs lighthouse-test || true
          docker stop lighthouse-test || true
          docker rm lighthouse-test || true