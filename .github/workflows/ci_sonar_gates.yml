name: Verify SonarCloud Quality Gates

on:
  workflow_call:
    inputs:
      frontend-ran:
        type: boolean
        required: true
      backend-ran:
        type: boolean
        required: true

jobs:
  sonar-gates:
    if: inputs.frontend-ran || inputs.backend-ran
    runs-on: ubuntu-latest
    steps:
      - name: Download Frontend Sonar report
        if: inputs.frontend-ran
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sonar-report-frontend
          path: ./Lighthouse.Frontend/.scannerwork/

      - name: Wait for Frontend Quality Gate
        if: inputs.frontend-ran
        uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        with:
          scanMetadataReportFile: ./Lighthouse.Frontend/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Download Backend Sonar report
        if: inputs.backend-ran
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sonar-report-backend
          path: .sonarqube/out/.sonar/

      - name: Wait for Backend Quality Gate
        if: inputs.backend-ran
        uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        with:
          scanMetadataReportFile: .sonarqube/out/.sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      
      - name: Checkout
        if: inputs.frontend-ran
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'

      - name: Setup pnpm
        if: inputs.frontend-ran
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: Lighthouse.Frontend/package.json
          run_install: false

      - name: Use Node.js
        if: inputs.frontend-ran
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: './Lighthouse.Frontend/pnpm-lock.yaml'
      
      - name: Audit Frontend Dependencies
        if: inputs.frontend-ran && github.ref == 'refs/heads/main'
        working-directory: ./Lighthouse.Frontend
        run: pnpm audit --audit-level=low --prod