name: Version
on:
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.version.outputs.version }}
      fileversion:
        value: ${{ jobs.version.outputs.fileversion }}
jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.generate_version.outputs.version }}
      fileversion: ${{ steps.generate_version.outputs.fileversion }}
    steps:          
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Generate version
        id: generate_version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { generateVersion } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/generate-version.mjs`);

            try {
              const { version, fileversion } = await generateVersion({
                // The module is handed the bare list of runs, not the Octokit envelope.
                listRuns: async ({ branch, page }) => (await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'ci.yml',
                  branch,
                  per_page: 100,
                  page,
                })).data.workflow_runs,
                ref: context.ref,
                pullRequestHeadRef: context.payload.pull_request?.head?.ref,
                now: new Date(),
                runId: context.runId,
                sleep: (ms) => new Promise(resolve => setTimeout(resolve, ms)),
              });

              core.setOutput('version', version);
              core.setOutput('fileversion', fileversion);
              return version;
            } catch (err) {
              core.setFailed(err.message);
            }