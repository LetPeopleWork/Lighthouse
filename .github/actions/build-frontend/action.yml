name: "build-frontend"
description: "Composite action to build and test the frontend with fixed tool versions and paths"

inputs:
  run-tests:
    description: "Run tests and Sonar analysis (true/false)"
    required: false
    default: 'true'
  sbom-version:
    description: "Version string to download SBOM artifact (leave empty to skip)"
    required: false
    default: ''
  shuffle-seed:
    description: "Seed for a shuffled test order (leave empty to keep the default order)"
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: '0'

    - name: Download SBOM artifacts
      if: ${{ inputs.sbom-version != '' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: Lighthouse-SBOM-${{ inputs.sbom-version }}
        path: ./sbom-download

    - name: Copy SBOM files to frontend public directory
      if: ${{ inputs.sbom-version != '' }}
      shell: bash
      run: |
        mkdir -p ./Lighthouse.Frontend/public/sbom
        cp ./sbom-download/lighthouse-backend-sbom.cdx.json ./Lighthouse.Frontend/public/sbom/backend.cdx.json
        cp ./sbom-download/lighthouse-frontend-sbom.cdx.json ./Lighthouse.Frontend/public/sbom/frontend.cdx.json

    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: Lighthouse.Frontend/package.json
        run_install: false

    - name: Use Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'
        cache-dependency-path: './Lighthouse.Frontend/pnpm-lock.yaml'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
      working-directory: ./Lighthouse.Frontend

    - name: Build Frontend
      shell: bash
      run: pnpm run build
      working-directory: ./Lighthouse.Frontend

    - name: Test Frontend and Sonar report
      if: ${{ inputs.run-tests == 'true' }}
      shell: bash
      run: |
        if [ -n "$SHUFFLE_SEED" ]; then
          echo "Test order seed: $SHUFFLE_SEED"
          echo "::notice title=Test order seed::Reproduce locally from the Lighthouse.Frontend folder with: pnpm test --sequence.shuffle.tests --sequence.seed=$SHUFFLE_SEED"
          pnpm test --sequence.shuffle.tests --sequence.seed="$SHUFFLE_SEED"
        else
          pnpm test
        fi
      working-directory: ./Lighthouse.Frontend
      env:
        CI: true
        SHUFFLE_SEED: ${{ inputs.shuffle-seed }}

    - name: Setup Sonar cache
      if: ${{ inputs.run-tests == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: |
          ${{ runner.os }}-sonar

    - name: Frontend SonarCloud
      if: ${{ inputs.run-tests == 'true' }}
      uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
      env:
        SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
      with:
        projectBaseDir: ./Lighthouse.Frontend
