name: "build-frontend"
description: "Composite action to build and test the frontend with fixed tool versions and paths"

inputs:
  run-tests:
    description: "Run tests and Sonar analysis (true/false)"
    required: false
    default: 'true'
  sbom-version:
    description: "Version string to download SBOM artifact (leave empty to skip)"
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: '0'

    - name: Download SBOM artifacts
      if: ${{ inputs.sbom-version != '' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: Lighthouse-SBOM-${{ inputs.sbom-version }}
        path: ./sbom-download

    - name: Copy SBOM files to frontend public directory
      if: ${{ inputs.sbom-version != '' }}
      shell: bash
      run: |
        mkdir -p ./Lighthouse.Frontend/public/sbom
        cp ./sbom-download/lighthouse-backend-sbom.cdx.json ./Lighthouse.Frontend/public/sbom/backend.cdx.json
        cp ./sbom-download/lighthouse-frontend-sbom.cdx.json ./Lighthouse.Frontend/public/sbom/frontend.cdx.json

    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: Lighthouse.Frontend/package.json
        run_install: false

    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'
        cache-dependency-path: './Lighthouse.Frontend/pnpm-lock.yaml'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
      working-directory: ./Lighthouse.Frontend

    - name: Build Frontend
      shell: bash
      run: pnpm run build
      working-directory: ./Lighthouse.Frontend

    - name: Test Frontend and Sonar report
      if: ${{ inputs.run-tests == 'true' }}
      shell: bash
      run: pnpm run sonarreport
      working-directory: ./Lighthouse.Frontend
      env:
        CI: true

    - name: Setup Sonar cache
      if: ${{ inputs.run-tests == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: |
          ${{ runner.os }}-sonar

    - name: Frontend SonarCloud
      if: ${{ inputs.run-tests == 'true' }}
      uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7.2.1
      env:
        SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
      with:
        projectBaseDir: ./Lighthouse.Frontend
